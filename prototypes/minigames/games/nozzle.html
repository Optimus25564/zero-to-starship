<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>喷管实验 · Nozzle Lab</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific bits common.css doesn't cover */
  .stage{aspect-ratio:1/1}
  canvas{cursor:crosshair}
  .netbig.opt{color:var(--ok)}
  .netbig.low{color:var(--muted)}
  .netbig.heavy{color:var(--bad)}
  .mval{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">喷管实验</h1><span class="en" id="titleEn">Nozzle Lab</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big netbig" id="net">0</span><span class="unit">kN</span>
      <span class="chip" id="chip"></span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="sliderrow">
      <label id="epsLabel"><span></span><b></b></label>
      <div class="sliderwrap">
        <input type="range" id="slider" min="1" max="100" step="0.5" value="3" />
      </div>
    </div>

    <div class="meters" id="meters">
      <div class="meter">
        <div class="mlabel"><span id="mVeName">排气速度 Exhaust velocity</span><span class="mval" id="mVeVal"></span></div>
        <div class="mbar"><div class="mfill blue" id="mVe"></div></div>
      </div>
      <div class="meter">
        <div class="mlabel"><span id="mGrName">毛推力 Gross thrust</span><span class="mval" id="mGrVal"></span></div>
        <div class="mbar"><div class="mfill" id="mGr"></div></div>
      </div>
      <div class="meter">
        <div class="mlabel"><span id="mPeName">重量惩罚 Weight penalty</span><span class="mval" id="mPeVal"></span></div>
        <div class="mbar"><div class="mfill bad" id="mPe"></div></div>
      </div>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">点火测试</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- real nozzle physics (isentropic, ideal gas) ----------
  const g   = 1.2;                 // ratio of specific heats (combustion gas)
  const Rs  = 378;                 // J/(kg·K) specific gas constant (~M=22)
  const Tc  = 3500;                // K chamber temperature
  const mdot= 350;                 // kg/s mass flow (fixed)
  const VeMax2 = 2*g/(g-1)*Rs*Tc;  // (m/s)^2 max possible exhaust velocity^2
  const VeMax  = Math.sqrt(VeMax2);// ~3984 m/s
  const gm1 = g-1, gp1 = g+1;
  const AEXP = gp1/(2*gm1);        // area-ratio exponent

  // supersonic Mach from area ratio eps (bisection on the isentropic area relation)
  function machFromArea(eps){
    if(eps<=1.00001) return 1;
    const area = (M)=> (1/M)*Math.pow((2/gp1)*(1+gm1/2*M*M), AEXP); // increasing for M>1
    let lo=1, hi=60;
    for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(area(m)<eps) lo=m; else hi=m; }
    return (lo+hi)/2;
  }
  // exhaust velocity for an expansion ratio (m/s)
  function exhaustVel(eps){
    const M = machFromArea(eps);
    const pr = Math.pow(1+gm1/2*M*M, -g/gm1);      // Pe/Pc  (0..1)
    return Math.sqrt(VeMax2*(1 - Math.pow(pr, gm1/g)));
  }
  // full performance at an expansion ratio (all thrust in kN)
  function perf(eps){
    const Ve = exhaustVel(eps);
    const gross = mdot*Ve/1000;          // momentum thrust, kN
    const penalty = 0.9*Math.pow(eps,1.3); // weight penalty grows super-linearly with length
    return { Ve, gross, penalty, net: gross-penalty };
  }

  // ---------- find the optimum band once (no hardcoded bands) ----------
  const EPS_MIN=1, EPS_MAX=100;
  let netMax=-1e9, epsOpt=1;
  const samples=[]; // {eps, net} for the mini-curve
  for(let e=EPS_MIN;e<=EPS_MAX+1e-9;e+=0.5){
    const n=perf(e).net; samples.push({eps:e, net:n});
    if(n>netMax){ netMax=n; epsOpt=e; }
  }
  const BAND_FRAC=0.985;                 // "best" = within 1.5% of the peak
  let bandLo=epsOpt, bandHi=epsOpt;
  for(const s of samples){ if(s.net>=BAND_FRAC*netMax){ bandLo=Math.min(bandLo,s.eps); bandHi=Math.max(bandHi,s.eps); } }
  const grossMaxUI = perf(EPS_MAX).gross;   // ~1173 kN, meter scale
  const penMaxUI   = perf(EPS_MAX).penalty; // ~358 kN, meter scale

  // ---------- i18n ----------
  const T = {
    zh: {
      title:'喷管实验', titleEn:'Nozzle Lab', lang:'EN', back:'← 目录',
      hook:'马斯克：喷管的秘密——<b>先掐脖子，再放开</b>，气体就疯跑。张太长又被重量反噬。拨动滑块，找出净推力最大的那一档。',
      eps:'喷管张开度（膨胀比 ε）',
      veName:'排气速度 Exhaust velocity', grName:'毛推力 Gross thrust', peName:'重量惩罚 Weight penalty',
      fire:'点火测试',
      chipLow:'太保守', chipOpt:'最佳!', chipHeavy:'太重了',
      analogy:(Ve,net)=>{
        const el=Math.max(1,Math.round(net/9.8/5));
        return `排气速度 <b>${(Ve/1000).toFixed(2)} km/s</b>（子弹出膛才 1 km/s）；净推力约能举起 <b>${el}</b> 头大象。`;
      },
      badgeLocked:'徽章未解锁：找到净推力最大的膨胀比，即可获得「喷管工程师」。',
      badgeEarned:'已获得徽章「喷管工程师」——先掐脖子，再放开，恰到好处。',
      curveEps:'膨胀比 ε →', curveNet:'净推力 ↑',
      v:{
        waste:{cls:'bad', tag:'浪费', t:'喷管几乎没张开，气体只跑到<b>音速</b>就出门了——高温高压全白费。<small>再往右拨。 · 炸了？又一份数据。</small>'},
        short:{cls:'bad', tag:'还不够', t:'气体开始加速了，但喷管还能更张开一点，速度没榨干。<small>继续往右。 · 炸了？又一份数据。</small>'},
        opt:{cls:'ok', tag:'最佳区 ✅', t:'完美！<b>排气速度</b>和<b>喷管重量</b>刚好平衡，净推力最大。你成了喷管工程师！<small>先掐脖子，再放开。</small>'},
        heavy:{cls:'bad', tag:'太长了', t:'贪心过头，<b>被重量反噬</b>！气体是更快了，可这么长的喷管太重，净推力反而掉下来。<small>往左收一点。 · 炸了？又一份数据。</small>'}
      }
    },
    en: {
      title:'Nozzle Lab', titleEn:'喷管实验', lang:'中', back:'← Menu',
      hook:"Musk: the nozzle's secret — <b>pinch the throat, then let go</b> and the gas bolts. Too long and its own weight bites back. Slide it and find the expansion ratio with the biggest net thrust.",
      eps:'Nozzle expansion ratio (ε)',
      veName:'Exhaust velocity 排气速度', grName:'Gross thrust 毛推力', peName:'Weight penalty 重量惩罚',
      fire:'Test Fire',
      chipLow:'Too shy', chipOpt:'Best!', chipHeavy:'Too heavy',
      analogy:(Ve,net)=>{
        const el=Math.max(1,Math.round(net/9.8/5));
        return `Exhaust <b>${(Ve/1000).toFixed(2)} km/s</b> (a bullet leaves at only 1 km/s); net thrust could lift about <b>${el}</b> elephants.`;
      },
      badgeLocked:'Badge locked: find the expansion ratio with the biggest net thrust to earn "Nozzle Engineer".',
      badgeEarned:'Badge earned: "Nozzle Engineer" — pinch the throat, then let go, just right.',
      curveEps:'expansion ε →', curveNet:'net ↑',
      v:{
        waste:{cls:'bad', tag:'Wasteful', t:'The nozzle barely opens; gas leaves at just the <b>speed of sound</b> — all that heat and pressure wasted.<small>Slide right. · Boom? Another data point.</small>'},
        short:{cls:'bad', tag:'Not enough', t:'Gas is speeding up, but the nozzle can open more — you haven\'t squeezed out all the speed.<small>Keep going right. · Boom? Another data point.</small>'},
        opt:{cls:'ok', tag:'Sweet spot ✅', t:'Perfect! <b>Exhaust speed</b> and <b>nozzle weight</b> balance exactly — net thrust is maxed. You\'re a Nozzle Engineer!<small>Pinch the throat, then let go.</small>'},
        heavy:{cls:'bad', tag:'Too long', t:'Greedy — the <b>weight bites back</b>! The gas is faster, but such a long nozzle is too heavy, so net thrust drops.<small>Pull back left. · Boom? Another data point.</small>'}
      }
    }
  };
  let lang='zh';

  // ---------- DOM ----------
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const slider=document.getElementById('slider');
  const netEl=document.getElementById('net'), chipEl=document.getElementById('chip');
  const analogyEl=document.getElementById('analogy');
  const epsLabel=document.getElementById('epsLabel');
  const mVe=document.getElementById('mVe'), mGr=document.getElementById('mGr'), mPe=document.getElementById('mPe');
  const mVeVal=document.getElementById('mVeVal'), mGrVal=document.getElementById('mGrVal'), mPeVal=document.getElementById('mPeVal');
  const fireBtn=document.getElementById('fireBtn');
  const verdictEl=document.getElementById('verdict');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');

  // ---------- storage ----------
  const KEY='nozzleLab.v1';
  const store=load();
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  // ---------- state ----------
  let eps=+slider.value;
  let firing=false, plumePower=0;      // eases 0..1
  let shake=0;
  let particles=[];

  // ---------- canvas sizing ----------
  let W=0,H=0,dpr=1;
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  // ---------- nozzle profile in abstract units ----------
  function buildProfile(e){
    const rT=1, rC=3.2, chL=2.2, conL=3.0;
    const rE=rT*Math.sqrt(e);
    const bellL=(rE-rT)/Math.tan(14*Math.PI/180);
    const xT=chL+conL;
    const pts=[];
    const nCh=6; for(let i=0;i<=nCh;i++){ const f=i/nCh; pts.push({x:f*chL, r:rC}); }
    const nCo=12; for(let i=1;i<=nCo;i++){ const f=i/nCo; const r=rT+(rC-rT)*0.5*(1+Math.cos(Math.PI*f)); pts.push({x:chL+f*conL, r}); }
    const nBe=18; for(let i=1;i<=nBe;i++){ const f=i/nBe; const r=rT+(rE-rT)*Math.pow(f,0.72); pts.push({x:xT+f*bellL, r}); }
    return {pts, rT, rC, rE, xT, bellL, Ltot:xT+bellL, maxR:Math.max(rC,rE)};
  }
  function radiusAt(prof, xu){
    const p=prof.pts;
    if(xu<=p[0].x) return p[0].r;
    if(xu>=p[p.length-1].x) return p[p.length-1].r;
    for(let i=1;i<p.length;i++){ if(xu<=p[i].x){ const f=(xu-p[i-1].x)/(p[i].x-p[i-1].x); return p[i-1].r+(p[i].r-p[i-1].r)*f; } }
    return prof.rE;
  }

  // ---------- particles (decorative gas flow) ----------
  function spawnParticles(){ particles=[]; for(let i=0;i<80;i++) particles.push(newP(Math.random())); }
  function newP(x0){ return {xu:x0, off:(Math.random()*2-1), jit:Math.random()*0.5+0.5}; }

  // ---------- main draw / animation loop ----------
  let lastT=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
    // ease plume + shake
    const target=firing?1:0;
    plumePower += (target-plumePower)*Math.min(1,dt*4);
    shake *= Math.exp(-dt*6);
    if(firing && plumePower>0.5) shake=Math.max(shake, (Math.random()*2-1)*2.2);
    draw(dt);
    requestAnimationFrame(frame);
  }

  function draw(dt){
    ctx.clearRect(0,0,W,H);
    // starfield-free dark; subtle vignette handled by stage bg
    const prof=buildProfile(eps);
    const P=perf(eps);
    const plumeLen = (P.Ve/VeMax)*prof.Ltot*0.7*plumePower;
    const totalLen = prof.Ltot + plumeLen;

    // fit: keep whole nozzle+plume inside with margins
    const marginX=0.86, marginY=0.72;
    const sc=Math.min(W*marginX/totalLen, H*marginY/(2*prof.maxR));
    const drawW=totalLen*sc;
    const ox=(W-drawW)/2 + (Math.random()*0+ (shake));
    const oy=H/2 + shake*0.4;
    // convert abstract (xu, r) -> screen
    const SX=(xu)=> ox + xu*sc;
    const SY=(r)=> oy + r*sc;

    // ---- exhaust plume (behind nozzle wall edges) ----
    if(plumeLen>0.2){
      const exX=SX(prof.Ltot), tipX=SX(totalLen);
      const rExit=prof.rE*sc;
      const grad=ctx.createLinearGradient(exX,0,tipX,0);
      grad.addColorStop(0,'rgba(255,210,140,0.95)');
      grad.addColorStop(0.35,'rgba(120,180,255,0.85)');
      grad.addColorStop(1,'rgba(74,163,255,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(exX, oy-rExit*0.9);
      ctx.quadraticCurveTo((exX+tipX)/2, oy-rExit*1.5, tipX, oy);
      ctx.quadraticCurveTo((exX+tipX)/2, oy+rExit*1.5, exX, oy+rExit*0.9);
      ctx.closePath(); ctx.fill();
      // mach diamonds
      ctx.fillStyle='rgba(255,255,255,'+(0.5*plumePower)+')';
      const nd=4;
      for(let i=1;i<=nd;i++){ const t=i/(nd+0.5); const dx=exX+(tipX-exX)*t; const dr=rExit*0.35*(1-t);
        ctx.beginPath(); ctx.ellipse(dx,oy,dr*0.6,dr,0,0,7); ctx.fill(); }
    }

    // ---- particles flowing through the nozzle ----
    for(const p of particles){
      // local speed: slow in chamber, accelerates after throat, scaled by Ve
      const past = p.xu>prof.xT;
      const spd = (past ? (0.6+2.4*(P.Ve/VeMax)) : 0.5) * prof.Ltot * 0.28;
      p.xu += spd*dt*p.jit;
      if(p.xu>prof.Ltot){ Object.assign(p, newP(0)); continue; }
      const r=radiusAt(prof,p.xu);
      const px=SX(p.xu), py=oy + p.off*r*0.82*sc;
      const f=p.xu/prof.Ltot; // 0 chamber -> 1 exit
      // hot orange in chamber -> blue-white at exit
      const col = f<0.4 ? 'rgba(255,150,60,0.9)' : f<0.72 ? 'rgba(255,220,150,0.9)' : 'rgba(190,225,255,0.95)';
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(px,py, 1.8+2.2*(1-f), 0, 7); ctx.fill();
    }

    // ---- nozzle wall (metallic), drawn as outline over the gas ----
    ctx.beginPath();
    ctx.moveTo(SX(prof.pts[0].x), SY(-prof.pts[0].r));
    for(const q of prof.pts) ctx.lineTo(SX(q.x), SY(-q.r));
    for(let i=prof.pts.length-1;i>=0;i--) ctx.lineTo(SX(prof.pts[i].x), SY(prof.pts[i].r));
    ctx.closePath();
    // fill only the WALL: use even-odd with inner path
    // simpler: draw two thick strokes (upper & lower contour) as the metal wall
    const wall=(sign)=>{
      ctx.beginPath();
      ctx.moveTo(SX(prof.pts[0].x), SY(sign*prof.pts[0].r));
      for(const q of prof.pts) ctx.lineTo(SX(q.x), SY(sign*q.r));
      const grd=ctx.createLinearGradient(0,oy-prof.maxR*sc,0,oy+prof.maxR*sc);
      grd.addColorStop(0,'#e7ecf3'); grd.addColorStop(0.5,'#9aa3b2'); grd.addColorStop(1,'#5b6474');
      ctx.strokeStyle=grd; ctx.lineWidth=Math.max(4,sc*0.5); ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.stroke();
      // inner cooling-line highlight
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=Math.max(1,sc*0.12); ctx.stroke();
    };
    wall(-1); wall(1);

    // chamber cap (left, rounded) + injector dots
    const capX=SX(0), capR=prof.rC*sc;
    ctx.strokeStyle='#aeb6c4'; ctx.lineWidth=Math.max(4,sc*0.5); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(capX, oy-capR); ctx.quadraticCurveTo(capX-capR*0.5, oy, capX, oy+capR); ctx.stroke();
    ctx.fillStyle='rgba(255,140,66,0.55)';
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(capX+2, oy+i*capR*0.35, Math.max(1.5,sc*0.1),0,7); ctx.fill(); }

    // throat marker (the "pinch")
    const thX=SX(prof.xT), thR=prof.rT*sc;
    ctx.strokeStyle='rgba(255,90,90,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(thX,oy-thR*2.4); ctx.lineTo(thX,oy+thR*2.4); ctx.stroke(); ctx.setLineDash([]);

    // ---- mini net-vs-eps curve (top-right) ----
    drawCurve();
  }

  function drawCurve(){
    const gw=Math.min(150, W*0.34), gh=Math.min(92, H*0.24);
    const gx=W-gw-12, gy=12;
    ctx.save();
    ctx.fillStyle='rgba(8,12,22,0.7)'; ctx.strokeStyle='var(--line)';
    ctx.strokeStyle='rgba(90,104,140,0.6)'; ctx.lineWidth=1;
    roundRect(gx,gy,gw,gh,8); ctx.fill(); ctx.stroke();
    const pad=8, x0=gx+pad, y0=gy+gh-pad, plotW=gw-pad*2, plotH=gh-pad*2-8;
    // net range for y
    let nMin=1e9,nMax=-1e9; for(const s of samples){ nMin=Math.min(nMin,s.net); nMax=Math.max(nMax,s.net); }
    const sx=(e)=> x0 + (e-EPS_MIN)/(EPS_MAX-EPS_MIN)*plotW;
    const sy=(n)=> y0 - (n-nMin)/(nMax-nMin)*plotH;
    // band shading
    ctx.fillStyle='rgba(87,211,140,0.16)';
    ctx.fillRect(sx(bandLo), gy+pad, sx(bandHi)-sx(bandLo), gh-pad*2-8);
    // curve
    ctx.strokeStyle='#ffd27f'; ctx.lineWidth=1.6; ctx.beginPath();
    samples.forEach((s,i)=>{ const X=sx(s.eps), Y=sy(s.net); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
    // current point
    const cp=perf(eps);
    const inBand = eps>=bandLo && eps<=bandHi;
    ctx.fillStyle = inBand?'#57d38c':(eps>bandHi?'#ff5a5a':'#8ba0b4');
    ctx.beginPath(); ctx.arc(sx(eps), sy(cp.net), 4, 0, 7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx(eps), sy(cp.net), 1.6, 0, 7); ctx.fill();
    // labels
    ctx.fillStyle='rgba(139,160,180,0.9)'; ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText(T[lang].curveNet, gx+pad, gy+11);
    ctx.textAlign='right'; ctx.fillText(T[lang].curveEps, gx+gw-pad, gy+gh-2);
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ---------- readouts ----------
  function classifyBand(){
    if(eps>=bandLo && eps<=bandHi) return 'opt';
    if(eps>bandHi) return 'heavy';
    if(eps < bandLo*0.42) return 'waste';
    return 'short';
  }
  function renderReadout(){
    const P=perf(eps), t=T[lang];
    netEl.textContent=Math.round(P.net);
    const band=classifyBand();
    netEl.className='big netbig '+(band==='opt'?'opt':band==='heavy'?'heavy':'low');
    chipEl.textContent = band==='opt'?t.chipOpt : band==='heavy'?t.chipHeavy : t.chipLow;
    chipEl.className='chip'+(band==='opt'?' on':'');
    analogyEl.innerHTML=t.analogy(P.Ve,P.net);
    epsLabel.querySelector('span').textContent=t.eps;
    epsLabel.querySelector('b').textContent='ε = '+eps.toFixed(1);
    // meters
    mVe.style.width=(P.Ve/VeMax*100)+'%';   mVeVal.textContent=(P.Ve/1000).toFixed(2)+' km/s';
    mGr.style.width=(P.gross/grossMaxUI*100)+'%'; mGrVal.textContent=Math.round(P.gross)+' kN';
    mPe.style.width=(P.penalty/penMaxUI*100)+'%'; mPeVal.textContent=Math.round(P.penalty)+' kN';
    mVeName.textContent=t.veName; mGrName.textContent=t.grName; mPeName.textContent=t.peName;
  }
  const mVeName=document.getElementById('mVeName'), mGrName=document.getElementById('mGrName'), mPeName=document.getElementById('mPeName');

  // ---------- fire / verdict ----------
  function fire(){
    if(firing) return;
    firing=true; fireBtn.disabled=true; hideVerdict();
    setTimeout(()=>{
      const band=classifyBand();
      const vd=T[lang].v[band];
      verdictEl.className='verdict show '+vd.cls;
      verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
      if(band==='opt'){ store.won=true; save(); try{ localStorage.setItem('mg.badge.nozzle','1'); }catch(e){} renderBadge(); }
      firing=false; fireBtn.disabled=false;
    }, 1400);
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  function renderBadge(){
    const earned=!!store.won;
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }

  // ---------- static text ----------
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    fireBtn.textContent=t.fire;
    document.documentElement.lang=lang;
  }

  // ---------- events ----------
  slider.addEventListener('input', ()=>{ eps=+slider.value; hideVerdict(); renderReadout(); });
  fireBtn.addEventListener('click', fire);
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang=lang==='zh'?'en':'zh'; renderStatic(); renderReadout(); renderBadge();
    if(verdictEl.classList.contains('show')){ // re-render current verdict in new language
      const vd=T[lang].v[classifyBand()];
      verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
    }
  });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic();
  spawnParticles();
  renderReadout();
  renderBadge();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
