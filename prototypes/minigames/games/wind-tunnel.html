<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>风洞实验 · Wind Tunnel</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific extras only — everything else comes from common.css */
  .stage canvas{cursor:pointer}
  .meter.sel .mlabel{color:var(--ink)}
  .meter.sel .mbar{outline:2px solid var(--flame2); outline-offset:2px}
  .cdchip{font-size:11px; padding:2px 7px; border-radius:999px; background:var(--panel2);
          color:var(--muted); font-variant-numeric:tabular-nums}
  .seen{color:var(--ok); font-weight:700}
  .cmp{font-size:13px; line-height:1.5; color:var(--muted); min-height:18px; margin:2px 0 10px}
  .cmp b{color:var(--ink)}
  .cmp.hit{color:var(--ok)}
  .cmp.hit b{color:var(--ok)}
  .markrow{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap}
</style>
</head>
<body>
  <header>
    <div class="htitle">
      <h1 id="title">风洞实验 <span class="en" id="titleEn">Wind Tunnel</span></h1>
    </div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage wide">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="spd">12</span><span class="unit" id="unit">m/s 风速</span>
      <span class="chip" id="kmh"></span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="sliderwrap">
      <input type="range" id="slider" min="4" max="40" step="0.5" value="12" />
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="markrow">
      <button class="mini" id="markBtn">记住当前风速</button>
      <span class="muted" id="markState"></span>
    </div>
  </div>

  <div class="panel">
    <div class="cmp" id="cmp"></div>
    <div class="meters" id="meters">
      <div class="meter" id="mBox">
        <div class="mlabel">
          <span><b id="nmBox">方盒</b> <span class="cdchip">Cd 1.05</span> <span id="seenBox"></span></span>
          <span><b id="nBox">0</b> N</span>
        </div>
        <div class="mbar"><div class="mfill bad" id="mfBox"></div></div>
      </div>
      <div class="meter" id="mSphere">
        <div class="mlabel">
          <span><b id="nmSphere">圆球</b> <span class="cdchip">Cd 0.47</span> <span id="seenSphere"></span></span>
          <span><b id="nSphere">0</b> N</span>
        </div>
        <div class="mbar"><div class="mfill" id="mfSphere"></div></div>
      </div>
      <div class="meter" id="mRocket">
        <div class="mlabel">
          <span><b id="nmRocket">铅笔火箭</b> <span class="cdchip">Cd 0.1</span> <span id="seenRocket"></span></span>
          <span><b id="nRocket">0</b> N</span>
        </div>
        <div class="mbar"><div class="mfill ok" id="mfRocket"></div></div>
      </div>
    </div>
    <p class="analogy" id="formula"></p>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- real drag physics ----------
  // F = 0.5 · ρ · Cd · A · v²   (numeric, no fake if-bands)
  const RHO = 1.225;     // kg/m³, sea-level air density
  const AREA = 0.10;     // m², one shared representative frontal area
  function drag(cd, v){ return 0.5 * RHO * cd * AREA * v * v; }   // Newtons

  const SHAPE_DEF = [
    {key:'box',    cd:1.05},
    {key:'sphere', cd:0.47},
    {key:'rocket', cd:0.10}
  ];
  const VMAX = 40;
  const MAXDRAG = drag(1.05, VMAX);   // meter full-scale ≈ box at max wind

  // ---------- i18n ----------
  const T = {
    zh: {
      title:'风洞实验', titleEn:'Wind Tunnel', lang:'EN', back:'← 目录',
      hook:'马斯克：把手伸出车窗，风推你的手；<b>速度翻倍，风的推力翻四倍</b>。选个形状，调风速，看谁最"滑"。',
      unit:'m/s 风速',
      names:{box:'方盒', sphere:'圆球', rocket:'铅笔火箭'},
      analogy:(v,lab)=>`≈ <b>${Math.round(v*3.6)}</b> km/h（${lab}）。风越快，推力涨得更凶。`,
      labSlow:'城市开车', labMid:'高速公路', labFast:'台风级',
      tapHint:'点画面里的形状，看它的阻力系数 Cd。三个都看一遍，再把风速翻一倍，就解锁徽章。',
      markBtn:'记住当前风速',
      markState:'',
      markStateSet:(v)=>`已记住 ${v} m/s`,
      cmpPrompt:'先"记住"一个风速，再把滑块拖到它的两倍，看阻力怎么变。',
      cmpNow:(v0,f0,v1,f1,r,rf)=>`记住：<b>${v0} m/s</b>（${f0.toFixed(1)} N）→ 现在 <b>${v1} m/s</b>：速度 ×${r.toFixed(2)} → 阻力 <b>×${rf.toFixed(2)}</b>（${f1.toFixed(1)} N）`,
      x4:' ✅ 速度×2 → 阻力×4，找到了！',
      formula:'公式：阻力 F = ½ · ρ · Cd · A · v²。Cd 越小越"滑"；v 进了平方，所以翻倍就是四倍。',
      badgeLocked:'徽章未解锁：三个形状都看过 + 亲眼看到"速度×2 → 阻力×4"，即可获得「气动驯风师」。',
      badgeEarned:'已获得徽章「气动驯风师」——尖的形状最省力，风顺着它溜走。',
      seen:'✓ 已看',
      vWin:{tag:'气动驯风师 🏅', t:'看数据：<b>铅笔火箭</b>阻力最小（Cd 只有 0.1）。尖头让风顺着身体溜过去——火箭就该长这样。'},
      vGust:{tag:'飓风级 🌀', t:'风速拉满！方盒被吹得翻着跟头飞走了。<small>炸了？又一份数据。 / Boom? Another data point.</small>'}
    },
    en: {
      title:'Wind Tunnel', titleEn:'风洞实验', lang:'中', back:'← Menu',
      hook:'Musk: Stick your hand out a car window — the wind shoves it. <b>Double the speed, four times the push.</b> Pick a shape, dial the wind, find the slipperiest one.',
      unit:'m/s wind',
      names:{box:'Box', sphere:'Sphere', rocket:'Pencil Rocket'},
      analogy:(v,lab)=>`≈ <b>${Math.round(v*3.6)}</b> km/h (${lab}). Faster wind, far bigger push.`,
      labSlow:'city driving', labMid:'highway', labFast:'typhoon',
      tapHint:'Tap a shape in the scene to read its drag coefficient Cd. Inspect all three, then double the wind speed to unlock the badge.',
      markBtn:'Mark this speed',
      markState:'',
      markStateSet:(v)=>`Marked ${v} m/s`,
      cmpPrompt:'Mark a speed, then drag the slider to double it — watch the drag.',
      cmpNow:(v0,f0,v1,f1,r,rf)=>`Marked: <b>${v0} m/s</b> (${f0.toFixed(1)} N) → now <b>${v1} m/s</b>: speed ×${r.toFixed(2)} → drag <b>×${rf.toFixed(2)}</b> (${f1.toFixed(1)} N)`,
      x4:' ✅ speed×2 → drag×4, you found it!',
      formula:'Formula: drag F = ½ · ρ · Cd · A · v². Smaller Cd = slipperier; v is squared, so doubling means four times.',
      badgeLocked:'Badge locked: inspect all three shapes and see "speed×2 → drag×4" to earn "Aero Tamer".',
      badgeEarned:'Badge earned: "Aero Tamer" — the pointed shape wins; air slips right past it.',
      seen:'✓ seen',
      vWin:{tag:'Aero Tamer 🏅', t:'The data is clear: the <b>pencil rocket</b> has the least drag (Cd just 0.1). A sharp nose lets air slip right past — that\'s why rockets look like this.'},
      vGust:{tag:'Hurricane 🌀', t:'Wind maxed out! The box tumbled away end over end.<small>炸了？又一份数据。 / Boom? Another data point.</small>'}
    }
  };
  let lang = 'zh';

  // ---------- DOM ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');
  const spdEl = document.getElementById('spd');
  const unitEl = document.getElementById('unit');
  const kmhEl = document.getElementById('kmh');
  const analogyEl = document.getElementById('analogy');
  const ticksEl = document.getElementById('ticks');
  const cmpEl = document.getElementById('cmp');
  const formulaEl = document.getElementById('formula');
  const markBtn = document.getElementById('markBtn');
  const markState = document.getElementById('markState');
  const verdictEl = document.getElementById('verdict');
  const badgeEl = document.getElementById('badge');
  const badgeText = document.getElementById('badgeText');
  const M = {
    box:   {fill:document.getElementById('mfBox'),    n:document.getElementById('nBox'),    name:document.getElementById('nmBox'),    seen:document.getElementById('seenBox'),    row:document.getElementById('mBox')},
    sphere:{fill:document.getElementById('mfSphere'), n:document.getElementById('nSphere'), name:document.getElementById('nmSphere'), seen:document.getElementById('seenSphere'), row:document.getElementById('mSphere')},
    rocket:{fill:document.getElementById('mfRocket'), n:document.getElementById('nRocket'), name:document.getElementById('nmRocket'), seen:document.getElementById('seenRocket'), row:document.getElementById('mRocket')}
  };

  // ---------- storage ----------
  const KEY = 'windTunnel.v1';
  const store = load();
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  // ---------- state ----------
  let v = 12;                 // wind speed m/s
  let markV = null, markF = null;
  const inspected = new Set(store.inspected || []);
  let sawX4 = !!store.sawX4;
  let awarded = !!store.done;
  let selected = -1;
  let gustShown = false;

  // ---------- canvas geometry ----------
  let W=0, H=0, dpr=1;
  let lanes = [];            // per-shape geometry, filled in resize()
  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const laneH = H/3;
    const bx = W*0.42;
    lanes = SHAPE_DEF.map((s,i)=>{
      const cy = laneH*(i+0.5);
      const g = {key:s.key, cd:s.cd, cy, cx:bx, laneH};
      if(s.key==='box'){
        g.hw=laneH*0.15; g.hh=laneH*0.15; g.amp=laneH*0.125; g.wake=laneH*0.06; g.wf=3;   g.wl=W*0.34; g.pad=g.hw*1.15;
      } else if(s.key==='sphere'){
        g.hw=laneH*0.16; g.hh=laneH*0.16; g.amp=laneH*0.09;  g.wake=laneH*0.022;g.wf=1.6; g.wl=W*0.26; g.pad=g.hw*1.05;
      } else { // rocket
        g.hw=laneH*0.30; g.hh=laneH*0.075;g.amp=laneH*0.03;  g.wake=0;         g.wf=0;   g.wl=1;      g.pad=g.hw*0.5;
      }
      g.spreadY = laneH*0.24;
      // streamline base offsets (both sides, skip exact centreline)
      g.bases = [];
      for(let k=1;k<=6;k++){ const off=k*laneH*0.05; g.bases.push(off, -off); }
      return g;
    });
    draw();
  }

  // deflected height of a streamline (px above centreline) at local x
  function pathY(g, x, base){
    const dx = x - g.cx;
    const iw = g.hw + g.pad;
    let env = 0;
    if(Math.abs(dx) < iw) env = 0.5*(1+Math.cos(Math.PI*dx/iw));
    const bulge = g.amp * env * Math.exp(-(base*base)/(g.spreadY*g.spreadY));
    let y = base + Math.sign(base)*bulge;
    if(dx>0 && g.wake>0){                                   // turbulent wake behind blunt bodies
      const decay = Math.exp(-dx/g.wl);
      y += Math.sin(dx*0.09 + dashPhase*0.03*g.wf + base*0.05) * g.wake * decay;
    }
    return y;
  }

  // ---------- drawing ----------
  let dashPhase = 0, lastT = 0;

  function drawShape(g){
    ctx.save();
    if(g.key==='box'){
      ctx.fillStyle='#c7ccd3';
      ctx.strokeStyle='#8a929e'; ctx.lineWidth=1.5;
      const x=g.cx-g.hw, y=g.cy-g.hh;
      ctx.beginPath(); ctx.rect(x,y,g.hw*2,g.hh*2); ctx.fill(); ctx.stroke();
    } else if(g.key==='sphere'){
      const grad=ctx.createRadialGradient(g.cx-g.hw*0.4,g.cy-g.hh*0.4,g.hw*0.2, g.cx,g.cy,g.hw);
      grad.addColorStop(0,'#dfe4ea'); grad.addColorStop(1,'#8a929e');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(g.cx,g.cy,g.hw,0,7); ctx.fill();
      ctx.strokeStyle='#8a929e'; ctx.lineWidth=1.5; ctx.stroke();
    } else {                                                // pencil rocket, nose into the wind (left)
      const grad=ctx.createLinearGradient(g.cx-g.hw,0,g.cx+g.hw,0);
      grad.addColorStop(0,'#ffd27f'); grad.addColorStop(0.5,'#ff9a4d'); grad.addColorStop(1,'#e5651a');
      ctx.fillStyle=grad; ctx.strokeStyle='#c85a1e'; ctx.lineWidth=1.5;
      const L=g.cx-g.hw, R=g.cx+g.hw, T=g.cy-g.hh, B=g.cy+g.hh;
      // fins at tail
      ctx.fillStyle='#c85a1e';
      ctx.beginPath(); ctx.moveTo(R-g.hw*0.35,T); ctx.lineTo(R+g.hw*0.05,T-g.hh*1.4); ctx.lineTo(R,T); ctx.fill();
      ctx.beginPath(); ctx.moveTo(R-g.hw*0.35,B); ctx.lineTo(R+g.hw*0.05,B+g.hh*1.4); ctx.lineTo(R,B); ctx.fill();
      // body: pointed nose left → cylinder → tail
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(L, g.cy);
      ctx.quadraticCurveTo(g.cx-g.hw*0.4, T, g.cx+g.hw*0.4, T);
      ctx.lineTo(R, T);
      ctx.lineTo(R, B);
      ctx.lineTo(g.cx+g.hw*0.4, B);
      ctx.quadraticCurveTo(g.cx-g.hw*0.4, B, L, g.cy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawLane(i){
    const g = lanes[i];
    const top = g.laneH*i, bot = g.laneH*(i+1);
    const isSel = selected===i;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, top, W, g.laneH); ctx.clip();
    // lane background
    ctx.fillStyle = isSel ? 'rgba(74,163,255,.10)' : 'rgba(255,255,255,.015)';
    ctx.fillRect(0, top, W, g.laneH);
    // streamlines (dashed, flowing left→right; speed via dash offset)
    ctx.lineWidth = isSel ? 1.8 : 1.3;
    ctx.setLineDash([6,10]);
    ctx.lineDashOffset = -dashPhase;
    for(const base of g.bases){
      const alpha = 0.28 + 0.42*Math.exp(-(base*base)/(g.spreadY*g.spreadY*1.6));
      ctx.strokeStyle = isSel ? `rgba(124,192,255,${alpha+0.15})` : `rgba(74,163,255,${alpha})`;
      ctx.beginPath();
      for(let x=0;x<=W;x+=6){
        const y = g.cy - pathY(g, x, base);
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    drawShape(g);
    ctx.restore();

    // label (drawn unclipped)
    const t=T[lang];
    ctx.save();
    ctx.font='600 13px -apple-system,PingFang SC,Segoe UI,sans-serif';
    ctx.textBaseline='top';
    ctx.fillStyle = isSel ? '#ffd27f' : '#e6ebf2';
    const name = t.names[g.key];
    ctx.fillText(name, 12, top+10);
    const nameW = ctx.measureText(name).width;
    ctx.font='12px -apple-system,PingFang SC,Segoe UI,sans-serif';
    ctx.fillStyle='#8ba0b4';
    ctx.fillText(`Cd ${g.cd}`, 12+nameW+8, top+11);
    if(inspected.has(i)){
      ctx.fillStyle='#57d38c';
      ctx.fillText(t.seen, 12, top+28);
    } else {
      ctx.fillStyle='rgba(255,210,127,.75)';
      ctx.fillText(lang==='zh'?'👆 点我':'👆 tap', 12, top+28);
    }
    // live drag number on the right of the lane
    ctx.font='700 15px -apple-system,PingFang SC,Segoe UI,sans-serif';
    ctx.textAlign='right';
    ctx.fillStyle = g.key==='rocket' ? '#57d38c' : (g.key==='box' ? '#ff9b9b' : '#ffd27f');
    ctx.fillText(`${drag(g.cd,v).toFixed(1)} N`, W-14, top+12);
    ctx.restore();

    // lane divider
    if(i<2){ ctx.strokeStyle='rgba(38,48,74,.9)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,bot); ctx.lineTo(W,bot); ctx.stroke(); }
  }

  function draw(){
    if(!W) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#03040a'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<3;i++) drawLane(i);
  }

  function loop(t){
    const dt = Math.min(0.05, (t-lastT)/1000) || 0; lastT = t;
    dashPhase += v * dt * 26;                 // streamline flow speed scales with wind
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- readouts ----------
  function speedLabel(){
    const t=T[lang];
    if(v < 20) return t.labSlow;
    if(v <= 33) return t.labMid;
    return t.labFast;
  }
  function renderReadout(){
    const t=T[lang];
    spdEl.textContent = (v%1===0)? v.toFixed(0) : v.toFixed(1);
    kmhEl.textContent = Math.round(v*3.6)+' km/h';
    analogyEl.innerHTML = t.analogy(v, speedLabel());
    for(const s of SHAPE_DEF){
      const F = drag(s.cd, v);
      const m = M[s.key];
      m.n.textContent = F.toFixed(1);
      m.fill.style.width = Math.min(100, F/MAXDRAG*100).toFixed(1)+'%';
    }
  }

  function renderCmp(){
    const t=T[lang];
    if(markV==null){ cmpEl.className='cmp'; cmpEl.innerHTML=t.cmpPrompt; return; }
    const F1 = drag(1.05, v);              // compare using the box, the most dramatic
    const r = v/markV;
    const rf = F1/markF;
    const hit = Math.abs(r-2) < 0.15;
    cmpEl.className = 'cmp' + (hit?' hit':'');
    let html = t.cmpNow(fmt(markV), markF, fmt(v), F1, r, rf);
    if(hit) html += t.x4;
    cmpEl.innerHTML = html;
    if(hit && !sawX4){
      sawX4 = true; store.sawX4 = true; save();
      checkDiscovery();
    }
  }
  function fmt(x){ return (x%1===0)? x.toFixed(0) : x.toFixed(1); }

  function renderMeterSel(){
    for(let i=0;i<3;i++){
      const key = SHAPE_DEF[i].key;
      M[key].row.classList.toggle('sel', selected===i);
      M[key].seen.innerHTML = inspected.has(i) ? `<span class="seen">${T[lang].seen}</span>` : '';
    }
  }

  // ---------- discovery / badge ----------
  function checkDiscovery(){
    if(awarded) return;
    if(inspected.size>=3 && sawX4){
      awarded = true; store.done = true; save();
      try{ localStorage.setItem('mg.badge.wind-tunnel','1'); }catch(e){}
      showVerdict('win');
      renderBadge();
    }
  }
  function renderBadge(){
    const t=T[lang];
    badgeEl.className = 'badge' + (awarded?' earned':'');
    badgeText.textContent = awarded ? t.badgeEarned : t.badgeLocked;
  }

  // ---------- verdict ----------
  function showVerdict(kind){
    const t=T[lang];
    const vd = kind==='win' ? t.vWin : t.vGust;
    const cls = kind==='win' ? 'ok' : 'bad';
    verdictEl.className = 'verdict show ' + cls;
    verdictEl.innerHTML = `<span class="tag">${vd.tag}</span>${vd.t}`;
    clearTimeout(showVerdict._to);
    if(kind==='gust'){ showVerdict._to = setTimeout(hideVerdict, 4200); }
  }
  function hideVerdict(){
    // never hide the winning card
    if(awarded && verdictEl.classList.contains('ok')) return;
    verdictEl.className='verdict';
  }

  // ---------- interactions ----------
  function onSlider(){
    v = +slider.value;
    renderReadout();
    renderCmp();
    if(v >= VMAX-0.5){ if(!gustShown){ gustShown=true; showVerdict('gust'); } }
    else { gustShown=false; if(verdictEl.classList.contains('bad')) hideVerdict(); }
  }
  slider.addEventListener('input', onSlider);

  markBtn.addEventListener('click', ()=>{
    markV = v; markF = drag(1.05, v);
    markState.textContent = T[lang].markStateSet(fmt(v));
    renderCmp();
  });

  function laneFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const yy = (e.clientY - rect.top);
    return Math.max(0, Math.min(2, Math.floor(yy/(rect.height/3))));
  }
  canvas.addEventListener('click', (e)=>{
    const i = laneFromEvent(e);
    selected = i;
    inspected.add(i);
    store.inspected = [...inspected]; save();
    renderMeterSel();
    checkDiscovery();
  });

  // ---------- ticks (gentle doubling hint: 10 → 20) ----------
  const TICKS = [{v:10,label:'10'},{v:20,label:'20 =×2'}];
  function buildTicks(){
    ticksEl.innerHTML='';
    const min=+slider.min, max=+slider.max;
    for(const tk of TICKS){
      const el=document.createElement('div'); el.className='tick reveal';
      el.style.left = ((tk.v-min)/(max-min)*100)+'%';
      el.innerHTML = `<b>${tk.label}</b>`;
      ticksEl.appendChild(el);
    }
  }

  // ---------- static text ----------
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').firstChild.textContent = t.title + ' ';
    document.getElementById('titleEn').textContent = t.titleEn;
    document.getElementById('langBtn').textContent = t.lang;
    document.getElementById('back').textContent = t.back;
    document.getElementById('hook').innerHTML = t.hook;
    unitEl.textContent = t.unit;
    markBtn.textContent = t.markBtn;
    markState.textContent = (markV==null) ? '' : t.markStateSet(fmt(markV));
    formulaEl.innerHTML = t.formula + ' <span class="muted">' + t.tapHint + '</span>';
    M.box.name.textContent = t.names.box;
    M.sphere.name.textContent = t.names.sphere;
    M.rocket.name.textContent = t.names.rocket;
    document.documentElement.lang = lang;
  }

  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic(); renderReadout(); renderCmp(); renderMeterSel(); renderBadge();
    // re-show whichever verdict is currently up, in the new language
    if(verdictEl.classList.contains('show')){
      if(verdictEl.classList.contains('ok')) showVerdict('win');
      else if(verdictEl.classList.contains('bad')) showVerdict('gust');
    }
  });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic();
  buildTicks();
  renderReadout();
  renderCmp();
  renderMeterSel();
  renderBadge();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
