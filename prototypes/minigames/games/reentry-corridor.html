<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>火墙冲刺 · Reentry Corridor</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* ---- game-specific bits common.css doesn't cover ---- */
  .predict{color:var(--muted); font-size:12px; line-height:1.5; min-height:34px; margin:2px 0 12px}
  .predict b{color:var(--ink); font-weight:600}
  .predict .chip{font-size:11px; padding:2px 8px; border-radius:999px; margin-left:6px}
  .predict .chip.skip{background:rgba(74,163,255,.2); color:var(--blue)}
  .predict .chip.safe{background:rgba(87,211,140,.2); color:var(--ok)}
  .predict .chip.burn{background:rgba(255,90,90,.2); color:#ff9b9b}

  .mbar{position:relative}
  .mbar .redline{position:absolute; top:-3px; bottom:-3px; width:2px; background:rgba(255,255,255,.8);
                 z-index:2; box-shadow:0 0 4px rgba(255,255,255,.6)}
  .mlabel .lim{color:var(--muted); font-size:11px}

  /* the alarmingly narrow corridor strip */
  .corwrap{margin:6px 0 4px}
  .corridor{position:relative; height:36px; border-radius:9px; overflow:hidden;
            border:1px solid var(--line); background:#0a1020}
  .corridor .zone{position:absolute; top:0; bottom:0}
  .corridor .zone.skip{background:linear-gradient(180deg,rgba(74,163,255,.40),rgba(74,163,255,.14))}
  .corridor .zone.safe{background:linear-gradient(180deg,rgba(87,211,140,.65),rgba(87,211,140,.30))}
  .corridor .zone.burn{background:linear-gradient(180deg,rgba(255,90,90,.48),rgba(255,90,90,.16))}
  .corridor .zlabel{position:absolute; top:50%; transform:translate(-50%,-50%); font-size:10px;
                    color:#eaf2ff; white-space:nowrap; pointer-events:none; text-shadow:0 1px 3px #000; font-weight:600}
  .corridor .marker{position:absolute; top:-3px; bottom:-3px; width:3px; background:#fff;
                    box-shadow:0 0 10px #fff, 0 0 3px #fff; transform:translateX(-1.5px); z-index:3}
  .corridor .marker::after{content:'▲'; position:absolute; top:-11px; left:50%; transform:translateX(-50%);
                    font-size:9px; color:#fff}
  .corscale{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:3px}
  .cornote{font-size:11px; color:var(--muted); margin:8px 0 2px; line-height:1.5}
  .cornote b{color:var(--half)}

  /* blunt vs sharp compare */
  .cmp{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .cmp .card{padding:10px}
  .cmp h3{font-size:13px; margin:0 0 6px; display:flex; align-items:center; gap:6px}
  .cmp canvas{width:100%; height:120px; display:block; background:#03040a; border-radius:8px; border:1px solid var(--line)}
  .cmp .cap{font-size:11px; color:var(--muted); line-height:1.45; margin-top:7px}
  .cmp .cap b{color:var(--ink)}
  .infocard{margin-top:10px; font-size:12px; line-height:1.55}
  .infocard b{color:var(--flame2)}
  .panel h2{font-size:15px; margin:0 0 10px}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">火墙冲刺</h1><span class="en" id="titleEn">Reentry Corridor</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="angVal">6.0</span><span class="unit">°</span>
      <span class="chip" id="stateChip"></span>
    </div>
    <div class="predict" id="predict"></div>

    <!-- live peak meters -->
    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="tempLbl">峰值温度 Peak heat</span><span id="tempReadout">— °C</span></div>
        <div class="mbar"><div class="mfill" id="tempFill"></div><div class="redline" id="tempRed"></div></div>
      </div>
      <div class="meter">
        <div class="mlabel"><span id="gLbl">峰值过载 Peak g-load</span><span id="gReadout">— g</span></div>
        <div class="mbar"><div class="mfill" id="gFill"></div><div class="redline" id="gRed"></div></div>
      </div>
    </div>

    <div class="sliderrow">
      <label id="angLbl"><span>再入角度 Reentry angle</span><b id="angLabelVal">6.0°</b></label>
      <div class="sliderwrap">
        <input type="range" id="slider" min="0.5" max="10" step="0.1" value="3.0" />
      </div>
    </div>

    <!-- always-visible narrow corridor -->
    <div class="corwrap">
      <div class="corridor" id="corridor">
        <div class="zone skip" id="zSkip"></div>
        <div class="zone safe" id="zSafe"></div>
        <div class="zone burn" id="zBurn"></div>
        <div class="zlabel" id="lSkip"></div>
        <div class="zlabel" id="lSafe"></div>
        <div class="zlabel" id="lBurn"></div>
        <div class="marker" id="corMarker"></div>
      </div>
      <div class="corscale"><span>0.5°</span><span>10°</span></div>
      <p class="cornote" id="cornote"></p>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">点火再入！</button>
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <!-- SECONDARY INSIGHT 17-2: blunt vs sharp -->
  <div class="panel">
    <h2 id="cmpTitle">尖头 vs 钝头：谁更凉？</h2>
    <div class="cmp">
      <div class="card">
        <h3><span>🔺</span><span id="sharpTitle">尖头</span></h3>
        <canvas id="sharpC"></canvas>
        <div class="cap" id="sharpCap"></div>
      </div>
      <div class="card">
        <h3><span>🥣</span><span id="bluntTitle">钝头（锅底）</span></h3>
        <canvas id="bluntC"></canvas>
        <div class="cap" id="bluntCap"></div>
      </div>
    </div>
  </div>

  <!-- CONFIG QUESTION 17-3 -->
  <div class="panel">
    <p class="q" id="quizQ"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="quizFb"></div>
    <div class="infocard" id="infocard"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ================= REAL reentry physics (SI, metres) =================
  // Round-planet 2D integration through an exponential atmosphere.
  // Deep-space return speed (~11 km/s) so a shallow pass genuinely SKIPS
  // back to space, and a steep pass burns/crushes — the narrow corridor
  // emerges from the integration, not from hardcoded if-bands.
  const R    = 6.371e6;      // m, Earth radius
  const MU   = 3.986e14;     // m^3/s^2
  const g0   = 9.81;
  const RHO0 = 1.225;        // kg/m^3 sea-level density
  const HS   = 7200;         // m scale height
  const V0   = 11000;        // m/s entry speed (return from deep space)
  const H0   = 120000;       // m entry interface altitude
  const BETA = 350;          // kg/m^2 ballistic coefficient m/(Cd A)
  const RN   = 2.0;          // m nose radius (Sutton-Graves)
  const SG   = 1.7415e-4, SIG = 5.67e-8, EPS = 0.85;
  const G_LIMIT = 12;        // g — crew/structure survivable
  const T_LIMIT = 2500;      // °C — heat-shield limit
  const DT   = 0.25;

  function qToT(q){ return Math.pow(q/(SIG*EPS), 0.25) - 273; } // W/m^2 -> °C

  // integrate one reentry; record a decimated side-view trajectory
  function simulate(gammaDeg){
    const g = gammaDeg*Math.PI/180;
    let x = 0, y = R + H0;
    let vx = V0*Math.cos(g), vy = -V0*Math.sin(g);
    let peakQ = 0, peakG = 0, t = 0;
    let outcome = null, burnIdx = -1;
    const traj = [];  // {dr, h, q, g}
    const maxSteps = 200000;
    for(let i=0;i<maxSteps;i++){
      const r = Math.hypot(x,y);
      const h = r - R;
      const rho = h>0 ? RHO0*Math.exp(-h/HS) : RHO0;
      const v = Math.hypot(vx,vy);
      const q = SG*Math.sqrt(rho/RN)*v*v*v;      // W/m^2
      const aDrag = 0.5*rho*v*v/BETA;            // m/s^2
      const gL = aDrag/g0;
      if(q>peakQ) peakQ=q;
      if(gL>peakG) peakG=gL;
      // downrange along the ground track (swept angle * R)
      const dr = Math.atan2(x, y) * R;
      if(i%3===0){
        traj.push({dr:dr/1000, h:h/1000, q:q, g:gL});
        if(burnIdx<0 && (gL>G_LIMIT || qToT(q)>T_LIMIT)) burnIdx = traj.length-1;
      }
      // integrate (semi-implicit)
      const gr = MU/(r*r);
      const ax = -aDrag*(vx/v) - gr*(x/r);
      const ay = -aDrag*(vy/v) - gr*(y/r);
      vx += ax*DT; vy += ay*DT;
      x  += vx*DT; y  += vy*DT; t += DT;
      const vr = (x*vx + y*vy)/r;                // radial velocity
      if(h > H0+2000 && vr>0){ outcome='skip'; break; }
      if(h < 12000){ outcome='land'; break; }
      if(h < 0){ outcome='crash'; break; }
      if(t > 3000){ outcome='timeout'; break; }
    }
    const peakT = qToT(peakQ);
    // classify from the REAL result
    let cls;
    if(outcome==='skip' || outcome==='timeout') cls='skip';
    else if(peakT > T_LIMIT) cls='burnT';
    else if(peakG > G_LIMIT) cls='burnG';
    else cls='safe';
    return {outcome, cls, peakG, peakT, peakQ, traj, burnIdx};
  }

  // ================= i18n =================
  const T = {
    zh:{
      title:'火墙冲刺', titleEn:'Reentry Corridor', lang:'EN', back:'← 目录',
      hook:'马斯克：从深空回家，你会以<b>几十倍音速</b>冲进大气。想用发动机刹车？燃料跟发射时一样多。免费的刹车片就是<b>大气</b>——但免费的最贵：角度差一点点，不是被弹回太空，就是烧成灰。',
      angLbl:'再入角度 Reentry angle', tempLbl:'峰值温度 Peak heat', gLbl:'峰值过载 Peak g-load',
      fire:'点火再入！', reset:'重来',
      chipSkip:'太浅·会弹飞', chipSafe:'走廊内', chipBurn:'太陡·会烧毁',
      predict:(tt,gg,cls)=>{
        const kiln=(tt/1500);
        const t=`预测：峰值温度 <b>${Math.round(tt)}°C</b>（≈ 炼钢炉的 ${kiln.toFixed(1)} 倍），峰值过载 <b>${gg.toFixed(0)} g</b>（≈ ${gg.toFixed(0)} 个你压在胸口）。`;
        return t;
      },
      corSkip:'弹飞', corSafe:'走廊', corBurn:'烧毁',
      cornote:(w)=>`看清楚：绿色的<b>安全走廊只有约 ${w.toFixed(1)}°</b> 宽。太平会被大气弹回太空，太陡会烧成灰。阿波罗当年的走廊比这还窄。`,
      tempUnit:(t)=>`${Math.round(t)} °C`, gUnit:(g)=>`${g.toFixed(1)} g`,
      limT:'烧毁线 2500°C', limG:'压碎线 12 g',
      meme:'炸了？又一份数据。',
      v:{
        skip:{tag:'被弹回太空 🏓', t:'角度太平了！大气像水面，把你<b>像打水漂一样弹了回去</b>。飞船带着满速冲回黑暗的太空，回不了家。<small> 再入太浅，最低点还在稀薄的高空，速度几乎没减，轨道就把你甩了出去。</small>'},
        burnG:{tag:'过载压碎 💥', t:'角度太陡！飞船一头扎进浓密大气，<b>刹车太猛</b>——过载冲过 12 g，结构被自己的重量压垮。<small> 越陡，越晚才开始减速，减速就越暴力。</small>'},
        burnT:{tag:'烧成一团火球 💥', t:'角度太陡！飞船扎得太深太快，<b>激波温度冲过 2500°C</b>，隔热罩顶不住，烧穿了。<small> 火墙冲刺失败——热得像掉进太阳里。</small>'},
        safe:{tag:'成功穿越·开伞溅落 🎉', t:'完美地钻过了火墙！峰值 <b>{tt}°C</b>、<b>{gg} g</b> 都压在安全线内。降落伞打开，飞船稳稳溅落大海。<b>欢迎回家！</b><small> 你找到了那条又窄又险的再入走廊。</small>'}
      },
      cmpTitle:'尖头 vs 钝头：谁更凉？', sharpTitle:'尖头', bluntTitle:'钝头（锅底）',
      sharpCap:'尖头把<b>激波紧紧贴</b>在尖尖上，热量全堆在这一小点——又尖又烫，很快烧穿。',
      bluntCap:'钝头把<b>弓形激波推到前方</b>老远，最烫的空气留在飞船和激波之间的缝里，外壳反而更凉。返回舱都长成锅底就是这个道理。',
      airflow:'气流', shock:'激波',
      quizQ:'返回舱为什么做成<b>钝乎乎的锅底</b>，而不是像子弹一样的尖头？',
      choices:[
        {k:'A', cls:'correct', txt:'钝头把弓形激波推到前方老远，最烫的空气留在缝里，外壳反而更凉。',
         fb:'对！<b>钝头把激波推远，热量留在空气里</b>，不是留在飞船上。这就是所有载人返回舱都是锅底的原因。'},
        {k:'B', cls:'wrong', txt:'尖头能像针一样"刺穿"大气，加热更少。',
         fb:'反了。尖头让激波紧贴尖尖，热量全挤在一点上，<b>更容易烧穿</b>。'},
        {k:'C', cls:'half', txt:'尖头在低速滑翔时阻力小、更灵活——所以飞船也该用尖头。',
         fb:'一半对：尖头在<b>低速滑翔</b>时确实更灵活（有的滑翔器就是尖的）。但高速再入时，尖头会把热量全堆在尖尖上烧穿——鱼和熊掌不可兼得。'},
        {k:'D', cls:'wrong', txt:'只是为了在里面塞下降落伞，跟温度没关系。',
         fb:'不对，形状是为了对付热量。钝头是<b>热控设计</b>，不是为了装东西。'}
      ],
      infocard:'配置事实：<b>载人龙飞船</b>用 PICA-X <b>烧蚀罩</b>——再入时烧掉薄薄一层、把热量带走，简单可靠。<b>星舰</b>想每周都飞，改用可复用的<b>隔热瓦</b>——不烧掉，可以重复用，但一块块很娇贵、容易掉。可靠 vs 可复用，又一个权衡。',
      badgeLocked:'徽章未解锁：成功钻过再入走廊、开伞溅落一次，即可获得「烈焰穿越者」。',
      badgeEarned:'已获得徽章「烈焰穿越者」——再入走廊又窄又险：太平被弹飞，太陡被烧毁，你正好穿过中间。'
    },
    en:{
      title:'Reentry Corridor', titleEn:'火墙冲刺', lang:'中', back:'← Menu',
      hook:'Musk: Coming home from deep space, you hit the air at <b>dozens of times the speed of sound</b>. Brake with engines? That costs as much fuel as launch. The free brake pad is the <b>atmosphere</b> — but free is the most expensive kind: a hair off on the angle and you either skip back into space or burn to ash.',
      angLbl:'Reentry angle', tempLbl:'Peak heat', gLbl:'Peak g-load',
      fire:'Reenter!', reset:'Reset',
      chipSkip:'too shallow · skips', chipSafe:'in corridor', chipBurn:'too steep · burns',
      predict:(tt,gg,cls)=>{
        const kiln=(tt/1500);
        return `Prediction: peak heat <b>${Math.round(tt)}°C</b> (≈ ${kiln.toFixed(1)}× a steel furnace), peak g-load <b>${gg.toFixed(0)} g</b> (≈ ${gg.toFixed(0)} of you stacked on your chest).`;
      },
      corSkip:'SKIP', corSafe:'SAFE', corBurn:'BURN',
      cornote:(w)=>`Look closely: the green <b>safe corridor is only about ${w.toFixed(1)}°</b> wide. Too shallow and the air skips you back to space; too steep and you burn. Apollo's corridor was even narrower.`,
      tempUnit:(t)=>`${Math.round(t)} °C`, gUnit:(g)=>`${g.toFixed(1)} g`,
      limT:'burn line 2500°C', limG:'crush line 12 g',
      meme:'Boom? Another data point.',
      v:{
        skip:{tag:'Skipped back to space 🏓', t:'Angle too shallow! The atmosphere acts like water and <b>skips you like a stone</b>. You shoot back into the dark at nearly full speed — no way home.<small> Too shallow: your lowest point stays in thin high air, you barely slow, and the orbit flings you back out.</small>'},
        burnG:{tag:'Crushed by g-load 💥', t:'Angle too steep! You plunge into thick air and <b>brake far too hard</b> — g-load blows past 12 g and the structure is crushed by its own weight.<small> Steeper means you slow down later, and later means more violently.</small>'},
        burnT:{tag:'Burned to a fireball 💥', t:'Angle too steep! You dive deep and fast, the <b>shock temperature blows past 2500°C</b>, and the heat shield burns through.<small> Reentry failed — hot as falling into the Sun.</small>'},
        safe:{tag:'Through the fire · chutes & splashdown 🎉', t:'You threaded the wall of fire! Peak <b>{tt}°C</b> and <b>{gg} g</b> both stayed under the line. Parachutes open, capsule splashes down safe. <b>Welcome home!</b><small> You found the narrow, dangerous reentry corridor.</small>'}
      },
      cmpTitle:'Sharp nose vs blunt body: which stays cooler?', sharpTitle:'Sharp nose', bluntTitle:'Blunt body (pot bottom)',
      sharpCap:'A sharp nose keeps the <b>shock hugging the tip</b>, piling all the heat onto one tiny point — sharp and scorching, it burns through fast.',
      bluntCap:'A blunt body <b>pushes the bow shock way out front</b>; the hottest air stays in the gap between ship and shock, so the surface stays cooler. That is why every capsule is shaped like a pot bottom.',
      airflow:'airflow', shock:'shock',
      quizQ:'Why is a reentry capsule a <b>blunt pot bottom</b> instead of a sharp bullet nose?',
      choices:[
        {k:'A', cls:'correct', txt:'A blunt body pushes the bow shock far out front, keeping the hottest air in the gap, so the shell stays cooler.',
         fb:'Yes! <b>The blunt shape pushes the shock away and leaves the heat in the air</b>, not on the ship. That is why every crewed capsule is a pot bottom.'},
        {k:'B', cls:'wrong', txt:'A sharp nose "stabs" through the air like a needle and heats up less.',
         fb:'Backwards. A sharp nose keeps the shock glued to the tip, piling heat on one point — it <b>burns through faster</b>.'},
        {k:'C', cls:'half', txt:'A sharp nose has less drag and more agility when gliding slowly — so ships should be sharp too.',
         fb:'Half right: a sharp nose really is more agile when <b>gliding slowly</b> (some gliders are pointy). But at reentry speed a sharp tip concentrates all the heat and burns through — you cannot have both.'},
        {k:'D', cls:'wrong', txt:'It is only to fit the parachutes inside; the shape has nothing to do with heat.',
         fb:'No — the shape is all about heat. Blunt is a <b>thermal design</b>, not a packing trick.'}
      ],
      infocard:'Config fact: <b>Crew Dragon</b> uses a PICA-X <b>ablative shield</b> — it burns off a thin layer during reentry and carries the heat away. Simple and reliable. <b>Starship</b> wants to fly weekly, so it uses reusable <b>heat-shield tiles</b> — they do not burn away and can fly again, but each tile is delicate and can fall off. Reliable vs reusable — another trade-off.',
      badgeLocked:'Badge locked: thread the reentry corridor and splash down once to earn "Fire Crosser".',
      badgeEarned:'Badge earned: "Fire Crosser" — the reentry corridor is narrow and cruel: too shallow skips you off, too steep burns you up, and you slipped right through the middle.'
    }
  };
  let lang='zh';

  // ================= DOM =================
  const $=id=>document.getElementById(id);
  const canvas=$('c'), ctx=canvas.getContext('2d');
  const slider=$('slider');
  const angVal=$('angVal'), angLabelVal=$('angLabelVal'), stateChip=$('stateChip'), predictEl=$('predict');
  const tempFill=$('tempFill'), gFill=$('gFill'), tempReadout=$('tempReadout'), gReadout=$('gReadout');
  const tempRed=$('tempRed'), gRed=$('gRed');
  const fireBtn=$('fireBtn'), resetBtn=$('resetBtn'), verdictEl=$('verdict');
  const corMarker=$('corMarker'), cornote=$('cornote');
  const badgeEl=$('badge'), badgeText=$('badgeText');
  const sharpC=$('sharpC'), bluntC=$('bluntC');

  const A_MIN=0.5, A_MAX=10;
  const TEMP_MAX=3200, GMAX=30;

  // ================= corridor boundaries (scan the SAME sim) =================
  let safeMin=null, safeMax=null, corW=0;
  function scanCorridor(){
    let firstSafe=null, lastSafe=null;
    for(let a=A_MIN; a<=A_MAX+1e-6; a+=0.05){
      const cls=simulate(a).cls;
      if(cls==='safe'){ if(firstSafe===null) firstSafe=a; lastSafe=a; }
    }
    safeMin=firstSafe; safeMax=lastSafe; corW=(lastSafe-firstSafe)+0.05;
  }
  function pct(a){ return (a-A_MIN)/(A_MAX-A_MIN)*100; }
  function paintCorridor(){
    const s0=pct(safeMin-0.025), s1=pct(safeMax+0.025);
    $('zSkip').style.left='0%'; $('zSkip').style.width=s0+'%';
    $('zSafe').style.left=s0+'%'; $('zSafe').style.width=(s1-s0)+'%';
    $('zBurn').style.left=s1+'%'; $('zBurn').style.width=(100-s1)+'%';
    $('lSkip').style.left=(s0/2)+'%'; $('lSkip').textContent=T[lang].corSkip;
    $('lSafe').style.left=((s0+s1)/2)+'%'; $('lSafe').textContent=T[lang].corSafe;
    $('lBurn').style.left=(s1+(100-s1)/2)+'%'; $('lBurn').textContent=T[lang].corBurn;
    cornote.innerHTML=T[lang].cornote(corW);
  }

  // ================= canvas sizing =================
  let W=0,H=0,dpr=1, yOcean=0, yTop=0;
  const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    yOcean=H*0.86; yTop=H*0.10;
    if(stars.length===0){ for(let i=0;i<90;i++) stars.push({x:Math.random(), y:Math.random()*0.55, r:Math.random()*1.2+0.2, a:Math.random()*0.6+0.2}); }
    drawScene();
    sizeMini(sharpC); sizeMini(bluntC); drawCompare();
  }
  const altToY=h=>yOcean-(Math.max(0,h)/120)*(yOcean-yTop);
  let curDR=1;
  const drToX=dr=>W*0.09 + (dr/curDR)*(W*0.82);

  // ================= state =================
  let ang=6.0, cur=null;   // cur = simulate() result for current angle
  let phase='idle';        // idle | flying | skipout | burn | parachute | done
  let idx=0, anim=null, shake=0, burnT=0, chuteT=0;

  function recompute(){
    ang=+slider.value;
    cur=simulate(ang);
    curDR=Math.max(1, cur.traj.length? cur.traj[cur.traj.length-1].dr:1);
    renderReadout();
    if(phase==='idle'||phase==='done'){ phase='idle'; drawScene(); }
  }

  // ================= readout / meters =================
  function classChipInfo(cls){
    if(cls==='skip') return {txt:T[lang].chipSkip, k:'skip'};
    if(cls==='safe') return {txt:T[lang].chipSafe, k:'safe'};
    return {txt:T[lang].chipBurn, k:'burn'};
  }
  function renderReadout(){
    angVal.textContent=ang.toFixed(1);
    angLabelVal.textContent=ang.toFixed(1)+'°';
    const ci=classChipInfo(cur.cls);
    stateChip.textContent=ci.txt; stateChip.className='chip '+ci.k;
    predictEl.innerHTML=T[lang].predict(cur.peakT, cur.peakG, cur.cls);
    // temp bar
    const tp=Math.min(1, cur.peakT/TEMP_MAX);
    tempFill.style.width=(tp*100)+'%';
    tempFill.className='mfill '+(cur.peakT>T_LIMIT?'bad':(cur.peakT>1500?'':'blue'));
    tempReadout.textContent=T[lang].tempUnit(cur.peakT);
    // g bar
    const gp=Math.min(1, cur.peakG/GMAX);
    gFill.style.width=(gp*100)+'%';
    gFill.className='mfill '+(cur.peakG>G_LIMIT?'bad':(cur.peakG>8?'':'ok'));
    gReadout.textContent=T[lang].gUnit(cur.peakG);
    // redlines + marker
    tempRed.style.left=(T_LIMIT/TEMP_MAX*100)+'%';
    gRed.style.left=(G_LIMIT/GMAX*100)+'%';
    corMarker.style.left=pct(ang)+'%';
  }

  // ================= scene drawing =================
  function drawSky(){
    const sk=ctx.createLinearGradient(0,0,0,yOcean);
    sk.addColorStop(0,'#03040a'); sk.addColorStop(0.28,'#070c1c');
    sk.addColorStop(0.62,'#0d2a55'); sk.addColorStop(1,'#2a6bb0');
    ctx.fillStyle=sk; ctx.fillRect(0,0,W,yOcean);
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#dfeaff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*yOcean,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // atmosphere haze bands (denser toward the ground)
    for(let i=0;i<5;i++){
      const f=i/5; const yb=yTop+(yOcean-yTop)*(0.45+f*0.55);
      ctx.fillStyle='rgba(74,163,255,'+(0.04+f*0.06)+')';
      ctx.fillRect(0,yb,W,yOcean-yb);
    }
    // "120 km — top of atmosphere" line
    ctx.strokeStyle='rgba(74,163,255,.25)'; ctx.setLineDash([4,6]); ctx.lineWidth=1;
    const yInt=altToY(120);
    ctx.beginPath(); ctx.moveTo(0,yInt); ctx.lineTo(W,yInt); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(150,190,240,.6)'; ctx.font='10px sans-serif'; ctx.textAlign='left';
    ctx.fillText(lang==='zh'?'大气层顶 120 km':'top of atmosphere 120 km', 8, yInt-4);
  }
  function drawOcean(){
    const oc=ctx.createLinearGradient(0,yOcean,0,H);
    oc.addColorStop(0,'#2f6fb0'); oc.addColorStop(1,'#0a2444');
    ctx.fillStyle=oc; ctx.fillRect(0,yOcean,W,H-yOcean);
    ctx.strokeStyle='rgba(180,220,255,.2)'; ctx.lineWidth=1;
    for(let i=1;i<4;i++){ const y=yOcean+(H-yOcean)*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }
  function drawTrail(upto){
    const tr=cur.traj; if(tr.length<2) return;
    ctx.lineJoin='round'; ctx.lineCap='round';
    const n=Math.min(upto,tr.length);
    // faint full path preview when idle
    if(phase==='idle'){
      ctx.strokeStyle='rgba(255,140,66,.18)'; ctx.lineWidth=1.5; ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.moveTo(drToX(tr[0].dr),altToY(tr[0].h));
      for(let i=1;i<tr.length;i++) ctx.lineTo(drToX(tr[i].dr),altToY(tr[i].h));
      ctx.stroke(); ctx.setLineDash([]);
    }
    // glowing plasma trail up to current point
    ctx.strokeStyle='rgba(255,150,70,.85)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(drToX(tr[0].dr),altToY(tr[0].h));
    for(let i=1;i<n;i++) ctx.lineTo(drToX(tr[i].dr),altToY(tr[i].h));
    ctx.stroke();
  }
  function drawCapsule(px,py,heat,tilt){
    ctx.save(); ctx.translate(px,py); ctx.rotate(tilt||0);
    // plasma glow
    if(heat>0.02){
      const rg=ctx.createRadialGradient(0,0,2,0,0,26+18*heat);
      rg.addColorStop(0,'rgba(255,255,255,'+(0.6*heat+0.2)+')');
      rg.addColorStop(0.4,'rgba(255,150,60,'+(0.7*heat)+')');
      rg.addColorStop(1,'rgba(255,90,30,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,26+18*heat,0,7); ctx.fill();
      // leading shock streaks
      ctx.strokeStyle='rgba(255,210,120,'+(0.5*heat)+')'; ctx.lineWidth=2;
      for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(6,k*4); ctx.lineTo(20+8*heat,k*7); ctx.stroke(); }
    }
    // capsule: blunt (pot) bottom facing travel direction (down-right)
    ctx.fillStyle='#c7ccd3';
    ctx.beginPath();
    ctx.moveTo(-7,-8); ctx.lineTo(7,-8);
    ctx.quadraticCurveTo(13,-2,10,7);
    ctx.quadraticCurveTo(0,13,-10,7);
    ctx.quadraticCurveTo(-13,-2,-7,-8);
    ctx.closePath(); ctx.fill();
    // glowing heat shield (bottom)
    ctx.fillStyle='rgba(255,140,60,'+(0.35+0.6*heat)+')';
    ctx.beginPath(); ctx.moveTo(-10,7); ctx.quadraticCurveTo(0,13,10,7);
    ctx.quadraticCurveTo(0,10,-10,7); ctx.fill();
    ctx.restore();
  }
  function currentHeat(i){
    const tr=cur.traj; if(!tr.length) return 0;
    const q=tr[Math.min(i,tr.length-1)].q;
    return Math.min(1, q/2.5e6);
  }
  function trajPt(i){
    const tr=cur.traj; const p=tr[Math.min(i,tr.length-1)];
    return {x:drToX(p.dr), y:altToY(p.h)};
  }
  function drawScene(){
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
    ctx.clearRect(-20,-20,W+40,H+40);
    drawSky(); drawOcean();
    if(!cur){ ctx.restore(); return; }
    const tr=cur.traj;

    if(phase==='idle'){
      drawTrail(0);
      const p=trajPt(0); drawCapsule(p.x,p.y,0.05,0.7);
    } else if(phase==='flying'){
      drawTrail(idx);
      const p=trajPt(idx); const h=currentHeat(idx);
      // travel tilt from local slope
      const a=Math.max(0,idx-1), b=Math.min(tr.length-1,idx+1);
      const tilt=Math.atan2(altToY(tr[b].h)-altToY(tr[a].h), drToX(tr[b].dr)-drToX(tr[a].dr));
      drawCapsule(p.x,p.y,h,tilt+Math.PI/2);
    } else if(phase==='skipout'){
      drawTrail(tr.length);
      // capsule flies up and off toward space
      const last=tr[tr.length-1], prev=tr[Math.max(0,tr.length-3)];
      const dirx=drToX(last.dr)-drToX(prev.dr), diry=altToY(last.h)-altToY(prev.h);
      const L=Math.hypot(dirx,diry)||1;
      const px=drToX(last.dr)+dirx/L*skipT*3.2, py=altToY(last.h)+diry/L*skipT*3.2;
      // dashed arc back to space
      ctx.strokeStyle='rgba(74,163,255,.5)'; ctx.setLineDash([5,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(drToX(last.dr),altToY(last.h)); ctx.lineTo(px,py); ctx.stroke(); ctx.setLineDash([]);
      drawCapsule(px,py,0.15,Math.atan2(diry,dirx)+Math.PI/2);
    } else if(phase==='burn'){
      const bi=cur.burnIdx>0?cur.burnIdx:tr.length-1;
      drawTrail(bi);
      const p=trajPt(bi);
      // expanding orange/white puff
      const rad=8+burnT*70;
      const pg=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,rad);
      pg.addColorStop(0,'rgba(255,255,255,'+Math.max(0,0.9-burnT*0.6)+')');
      pg.addColorStop(0.4,'rgba(255,170,60,'+Math.max(0,0.8-burnT*0.5)+')');
      pg.addColorStop(1,'rgba(255,80,30,0)');
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7); ctx.fill();
      // debris sparks
      for(let k=0;k<10;k++){ const an=k/10*7, dd=burnT*rad*0.9;
        ctx.fillStyle='rgba(255,200,120,'+Math.max(0,0.8-burnT)+')';
        ctx.beginPath(); ctx.arc(p.x+Math.cos(an)*dd,p.y+Math.sin(an)*dd,2,0,7); ctx.fill(); }
    } else if(phase==='parachute'){
      drawTrail(tr.length);
      const last=tr[tr.length-1];
      const sx=drToX(last.dr), sy=altToY(last.h);
      const ey=yOcean-10, ex=sx+30;
      const px=sx+(ex-sx)*chuteT, py=sy+(ey-sy)*chuteT;
      // parachute canopy
      ctx.strokeStyle='#e6ebf2'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(px-6,py-8); ctx.lineTo(px-14,py-24); ctx.moveTo(px+6,py-8); ctx.lineTo(px+14,py-24); ctx.stroke();
      ctx.fillStyle='#ff8c42';
      ctx.beginPath(); ctx.moveTo(px-20,py-24); ctx.quadraticCurveTo(px,py-46,px+20,py-24);
      ctx.quadraticCurveTo(px,py-32,px-20,py-24); ctx.fill();
      ctx.strokeStyle='#ffd27f'; ctx.stroke();
      drawCapsule(px,py,0.05,0);
      if(chuteT>=1){
        // splash ripples
        ctx.strokeStyle='rgba(220,240,255,.7)'; ctx.lineWidth=2;
        for(let k=0;k<3;k++){ ctx.beginPath(); ctx.ellipse(px,yOcean, (splashT*30)+(k*12), (splashT*8)+(k*3),0,0,7); ctx.globalAlpha=Math.max(0,0.7-splashT-k*0.2); ctx.stroke(); }
        ctx.globalAlpha=1;
      }
    } else if(phase==='done'){
      // leave the final frame according to what happened
      if(cur.cls==='safe'){
        drawTrail(tr.length);
        const px=drToX(tr[tr.length-1].dr)+30;
        drawCapsule(px,yOcean-10,0,0);
        ctx.strokeStyle='rgba(220,240,255,.4)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(px,yOcean,34,9,0,0,7); ctx.stroke();
      } else if(cur.cls==='skip'){
        drawTrail(tr.length);
      } else {
        const bi=cur.burnIdx>0?cur.burnIdx:tr.length-1; drawTrail(bi);
      }
    }
    ctx.restore();
  }

  // ================= animation =================
  let skipT=0, splashT=0;
  function fire(){
    if(phase==='flying'||phase==='skipout'||phase==='burn'||phase==='parachute') return;
    hideVerdict();
    recompute();
    phase='flying'; idx=0; shake=0; burnT=0; chuteT=0; skipT=0; splashT=0;
    fireBtn.disabled=true;
    const tr=cur.traj;
    const endIdx = (cur.cls==='burnG'||cur.cls==='burnT') && cur.burnIdx>0 ? cur.burnIdx : tr.length;
    const per=Math.max(1, Math.floor(endIdx/220)); // ~3.7s at 60fps
    function step(){
      if(phase!=='flying') return;
      idx+=per;
      drawScene();
      if(idx<endIdx){ requestAnimationFrame(step); }
      else { idx=endIdx; endFlight(); }
    }
    requestAnimationFrame(step);
  }
  function endFlight(){
    const cls=cur.cls;
    if(cls==='skip'){ phase='skipout'; skipout(); }
    else if(cls==='safe'){ phase='parachute'; parachute(); }
    else { phase='burn'; burn(); }
  }
  function skipout(){
    skipT=0;
    (function loop(){
      if(phase!=='skipout') return;
      skipT+=6; drawScene();
      if(skipT<60){ requestAnimationFrame(loop); } else finishAll();
    })();
  }
  function burn(){
    burnT=0; shake=10;
    (function loop(){
      if(phase!=='burn') return;
      burnT+=0.03; shake=Math.max(0,10*(1-burnT*1.2)); drawScene();
      if(burnT<1){ requestAnimationFrame(loop); } else { shake=0; finishAll(); }
    })();
  }
  function parachute(){
    chuteT=0; splashT=0;
    (function loop(){
      if(phase!=='parachute') return;
      if(chuteT<1){ chuteT=Math.min(1,chuteT+0.02); }
      else { splashT+=0.03; }
      drawScene();
      if(splashT<1){ requestAnimationFrame(loop); } else finishAll();
    })();
  }
  function finishAll(){
    phase='done'; drawScene();
    fireBtn.disabled=false;
    showVerdict();
    if(cur.cls==='safe'){ try{ localStorage.setItem('mg.badge.reentry-corridor','1'); }catch(e){} }
    renderBadge();
  }

  // ================= verdict =================
  function showVerdict(){
    const v=T[lang].v[cur.cls];
    const cls = cur.cls==='safe' ? 'ok' : (cur.cls==='skip' ? 'info' : 'bad');
    let t=v.t.replace('{tt}', Math.round(cur.peakT)).replace('{gg}', cur.peakG.toFixed(0));
    if(cur.cls!=='safe') t += ' <b>'+T[lang].meme+'</b>';
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML='<span class="tag">'+v.tag+'</span>'+t;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ================= blunt vs sharp mini-canvases =================
  function sizeMini(cv){
    const rect=cv.getBoundingClientRect();
    const d=Math.min(window.devicePixelRatio||1,2);
    cv.width=rect.width*d; cv.height=rect.height*d;
    const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0);
    cv._w=rect.width; cv._h=rect.height;
  }
  function drawFlowArrows(c,w,h){
    c.strokeStyle='rgba(150,190,240,.55)'; c.fillStyle='rgba(150,190,240,.55)'; c.lineWidth=1.5;
    for(let i=0;i<4;i++){ const y=h*0.2+i*(h*0.6/3);
      c.beginPath(); c.moveTo(6,y); c.lineTo(w*0.32,y); c.stroke();
      c.beginPath(); c.moveTo(w*0.32,y); c.lineTo(w*0.32-6,y-3); c.lineTo(w*0.32-6,y+3); c.fill(); }
    c.fillStyle='rgba(150,190,240,.75)'; c.font='10px sans-serif'; c.textAlign='left';
    c.fillText(T[lang].airflow, 6, h-6);
  }
  function drawCompare(){
    // SHARP
    let c=sharpC.getContext('2d'), w=sharpC._w, h=sharpC._h;
    c.clearRect(0,0,w,h); c.fillStyle='#03040a'; c.fillRect(0,0,w,h);
    drawFlowArrows(c,w,h);
    const cxs=w*0.62, cy=h/2;
    // shock hugging the tip (hot, close)
    c.strokeStyle='rgba(255,90,50,.9)'; c.lineWidth=3;
    c.beginPath(); c.moveTo(cxs-14,cy-30); c.quadraticCurveTo(cxs-24,cy,cxs-14,cy+30); c.stroke();
    // hot glow ON the tip
    let rg=c.createRadialGradient(cxs-10,cy,1,cxs-10,cy,20);
    rg.addColorStop(0,'rgba(255,240,180,.95)'); rg.addColorStop(1,'rgba(255,90,40,0)');
    c.fillStyle=rg; c.beginPath(); c.arc(cxs-10,cy,20,0,7); c.fill();
    // sharp body (pointing into flow, left)
    c.fillStyle='#c7ccd3'; c.beginPath();
    c.moveTo(cxs-12,cy); c.lineTo(cxs+22,cy-16); c.lineTo(cxs+22,cy+16); c.closePath(); c.fill();
    c.fillStyle='#ff5a3c'; c.font='10px sans-serif'; c.textAlign='center';
    c.fillText(lang==='zh'?'热量堆在尖上':'heat on the tip', cxs+2, h-6);

    // BLUNT
    c=bluntC.getContext('2d'); w=bluntC._w; h=bluntC._h;
    c.clearRect(0,0,w,h); c.fillStyle='#03040a'; c.fillRect(0,0,w,h);
    drawFlowArrows(c,w,h);
    const cxb=w*0.66, cyb=h/2;
    // detached bow shock standing OFF in front
    c.strokeStyle='rgba(255,150,60,.85)'; c.lineWidth=3;
    c.beginPath(); c.moveTo(cxb-40,cyb-34); c.quadraticCurveTo(cxb-58,cyb,cxb-40,cyb+34); c.stroke();
    // hottest air in the GAP (not on the shell)
    let gg=c.createRadialGradient(cxb-30,cyb,2,cxb-30,cyb,26);
    gg.addColorStop(0,'rgba(255,210,120,.8)'); gg.addColorStop(1,'rgba(255,120,50,0)');
    c.fillStyle=gg; c.beginPath(); c.ellipse(cxb-30,cyb,20,28,0,0,7); c.fill();
    // blunt pot body — cooler shell (yellow, not white-hot)
    c.fillStyle='#c7ccd3'; c.beginPath();
    c.moveTo(cxb-16,cyb-24);
    c.quadraticCurveTo(cxb-30,cyb,cxb-16,cyb+24);
    c.lineTo(cxb+20,cyb+16); c.lineTo(cxb+20,cyb-16); c.closePath(); c.fill();
    c.fillStyle='rgba(255,200,90,.5)'; c.beginPath();
    c.moveTo(cxb-16,cyb-24); c.quadraticCurveTo(cxb-30,cyb,cxb-16,cyb+24);
    c.quadraticCurveTo(cxb-22,cyb,cxb-16,cyb-24); c.fill();
    c.fillStyle='rgba(150,190,240,.85)'; c.font='10px sans-serif'; c.textAlign='center';
    c.fillText(T[lang].shock, cxb-49, cyb-30);
    c.fillStyle='#57d38c'; c.fillText(lang==='zh'?'外壳更凉':'shell stays cool', cxb, h-6);
  }

  // ================= quiz =================
  const choicesEl=$('choices'), quizFb=$('quizFb');
  let quizAnswered=false;
  function buildQuiz(){
    choicesEl.innerHTML=''; quizAnswered=false; quizFb.textContent='';
    T[lang].choices.forEach((ch,i)=>{
      const b=document.createElement('button'); b.className='choice';
      b.innerHTML='<span class="key">'+ch.k+'</span><span>'+ch.txt+'</span>';
      b.addEventListener('click',()=>answer(i));
      choicesEl.appendChild(b);
    });
  }
  function answer(i){
    if(quizAnswered) return; quizAnswered=true;
    const ch=T[lang].choices[i];
    [...choicesEl.children].forEach((el,j)=>{
      const cj=T[lang].choices[j];
      if(cj.cls==='correct') el.classList.add('correct');
      if(j===i && cj.cls!=='correct') el.classList.add(cj.cls==='half'?'half':'wrong');
      if(j!==i && cj.cls!=='correct') el.classList.add('dim');
    });
    quizFb.innerHTML=ch.fb;
  }

  // ================= badge =================
  function badgeEarnedNow(){ try{ return localStorage.getItem('mg.badge.reentry-corridor')==='1'; }catch(e){ return false; } }
  function renderBadge(){
    const e=badgeEarnedNow();
    badgeEl.className='badge'+(e?' earned':'');
    badgeText.textContent=e?T[lang].badgeEarned:T[lang].badgeLocked;
  }

  // ================= static text =================
  function renderStatic(){
    const t=T[lang];
    $('title').textContent=t.title; $('titleEn').textContent=t.titleEn;
    $('langBtn').textContent=t.lang; $('back').textContent=t.back;
    $('hook').innerHTML=t.hook;
    $('angLbl').firstElementChild.textContent=t.angLbl;
    $('tempLbl').textContent=t.tempLbl+'  '+'('+t.limT+')';
    $('gLbl').textContent=t.gLbl+'  '+'('+t.limG+')';
    fireBtn.textContent=t.fire; resetBtn.textContent=t.reset;
    $('cmpTitle').textContent=t.cmpTitle;
    $('sharpTitle').textContent=t.sharpTitle; $('bluntTitle').textContent=t.bluntTitle;
    $('sharpCap').innerHTML=t.sharpCap; $('bluntCap').innerHTML=t.bluntCap;
    $('quizQ').innerHTML=t.quizQ; $('infocard').innerHTML=t.infocard;
    document.documentElement.lang=lang;
  }

  // ================= events =================
  slider.addEventListener('input', recompute);
  fireBtn.addEventListener('click', fire);
  resetBtn.addEventListener('click', ()=>{ phase='idle'; hideVerdict(); drawScene(); });
  $('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic(); renderReadout(); paintCorridor(); buildQuiz(); renderBadge(); drawCompare();
    if(phase==='done') showVerdict();
  });
  window.addEventListener('resize', resize);

  // ================= init =================
  scanCorridor();
  renderStatic();
  recompute();
  paintCorridor();
  buildQuiz();
  renderBadge();
  resize();
})();
</script>
