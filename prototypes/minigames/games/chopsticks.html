<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>筷子夹火箭 · Chopsticks Catch</title>
<link rel="stylesheet" href="../common.css">
<style>
  .hud{position:absolute; left:10px; top:10px; right:10px; display:flex; gap:8px; pointer-events:none;
       font-variant-numeric:tabular-nums}
  .hud .cell{flex:1; background:rgba(8,12,22,.62); border:1px solid var(--line); border-radius:10px;
             padding:6px 8px; backdrop-filter:blur(4px)}
  .hud .lab{font-size:10px; color:var(--muted); letter-spacing:.5px}
  .hud .val{font-size:16px; font-weight:800; color:var(--flame2)}
  .hud .val small{font-size:11px; color:var(--muted); font-weight:600}
  .hud .val.ok{color:var(--ok)} .hud .val.warn{color:var(--bad)}
  .aln{height:6px; border-radius:999px; background:#1b2338; margin-top:5px; position:relative; overflow:hidden}
  .aln .zone{position:absolute; top:0; bottom:0; background:rgba(87,211,140,.4)}
  .aln .dot{position:absolute; top:-2px; width:4px; height:10px; border-radius:2px; background:#fff}
  .lat{display:flex; gap:10px; margin-top:10px}
  .lat button{font-size:20px}
  .qwrap{margin-top:6px}
  .starrow{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:10px}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">筷子夹火箭</h1><span class="en" id="titleEn">Chopsticks Catch</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud">
      <div class="cell"><div class="lab" id="labH">高度差 Δ臂</div><div class="val" id="vH">—</div></div>
      <div class="cell"><div class="lab" id="labSpd">速度 SPD</div><div class="val" id="vSpd">—</div></div>
      <div class="cell"><div class="lab" id="labAln">对准 ALIGN</div><div class="val" id="vAln">—</div>
        <div class="aln"><div class="zone" id="alnZone"></div><div class="dot" id="alnDot"></div></div></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="buttons">
      <button class="fire" id="fireBtn">投放</button>
      <button class="ghost" id="retryBtn">重来</button>
    </div>
    <div class="lat" id="latRow">
      <button id="leftBtn">◀ 左推</button>
      <button id="rightBtn">右推 ▶</button>
    </div>
  </div>

  <!-- point-home question, revealed after a catch -->
  <div class="panel qwrap hidden" id="quizPanel">
    <p class="q" id="qText"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="qFeedback"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  "use strict";
  // ============================================================
  //  2D Mechazilla catch — REAL numeric integration.
  //  Vertical: a landing-burn P-controller drives descent speed toward a slow
  //  target (thrust = g + kp*(vTarget - v)); genuinely simulated, ease-in fast->slow.
  //  Lateral: booster drifts under a gusty crosswind; the player applies side
  //  thrust to hold it over the tower's catch line.
  //  A catch succeeds ONLY inside a joint window: catch-pin height near the arms
  //  (|Δ| < TOL_V) AND horizontal alignment (|x| < TOL_X).
  // ============================================================
  const g=9.8, KP=1.4, V_SLOW=5;         // m/s target descent
  const H_VIEW=200;                       // m mapped across scene height
  const H_ARM=120;                        // m  chopstick carriage height
  const LEN=64, WID=13;                   // m booster length / width
  const PIN=LEN*0.82;                     // m catch-pin offset above booster base
  const BASE0=118, VY0=-22;               // m start base / start descent speed
  const TOL_V=5;                          // m vertical catch tolerance (band 115..125)
  const TOL_X=4;                          // m horizontal alignment tolerance
  const OPEN_HALF=13, HOLD_HALF=WID/2+1;  // m arm gap open / clamped

  const T18={
    zh:{
      title:'筷子夹火箭', titleEn:'Chopsticks Catch', lang:'EN', back:'← 目录',
      hook:'马斯克：支腿好几吨重，每次发射都白背着上天。让<b>发射塔</b>来接！Mechazilla 伸出两根「筷子」，在半空<b>夹住</b>助推器。对准中线，算准高度，合拢。',
      drop:'投放', close:'合拢筷子 🥢', retry:'重来',
      labH:'高度差 Δ臂', labSpd:'速度 SPD', labAln:'对准 ALIGN',
      left:'◀ 左推', right:'右推 ▶',
      ready:'点「投放」。助推器边下落边被侧风吹偏——用左右推顶住中线，等它降到<b>筷子高度</b>再合拢。',
      badgeLocked:'徽章未解锁：半空夹住助推器，即可获得「筷子操作员」。',
      badgeEarned:'已获得徽章「筷子操作员」——人类最难的夹娃娃，你成了。',
      hud_above:'高', hud_below:'低',
      resOk:{tag:'夹住了！🎉', t:'两根筷子稳稳合拢，助推器挂在半空轻轻晃……<b>你完成了人类最难的「夹娃娃」。</b><small> 塔接住它，就不用背着几吨重的支腿上天了。</small>'},
      resEarly:{tag:'早合拢 💥', t:(d)=>`筷子合太早了——助推器还在上面 <b>${d} m</b>，一头撞在闭合的臂上。<small> 炸了？又一份数据。等它再降一点。</small>`},
      resLate:{tag:'滑过去了 💥', t:(d)=>`慢了半拍——助推器已经低于筷子 <b>${d} m</b>，从中间滑过去砸向地面。<small> 炸了？又一份数据。早一点点合拢。</small>`},
      resMiss:{tag:'没对准 💥', t:(o)=>`高度对了，可它偏了中线 <b>${o} m</b>，擦着一根筷子翻了个跟头。<small> 炸了？又一份数据。先用左右推把它顶回中线。</small>`},
      resGround:{tag:'砸地了 💥', t:'一直没合拢，助推器落到底了。<small> 炸了？又一份数据。盯着「Δ臂」，接近 0 就合拢。</small>',},
      q:'去掉着陆支腿，本质上是在执行哪句口头禅？',
      choices:[
        {k:'A', txt:'炸了也是数据', cls:'wrong', fb:'这句没错，但它说的是「敢于失败」，不是为什么去掉支腿。再想想。'},
        {k:'B', txt:'最好的零件，是不存在的零件', cls:'correct', fb:'对！支腿不飞了，省下的好几吨重量全变成了运力——最好的零件就是根本不装的那个。'},
        {k:'C', txt:'It depends（看情况）', cls:'wrong', fb:'万能答案，但这里有明确的对：去掉一整套支腿是在贯彻「删掉零件」。'}
      ],
      qDone:'徽章到手，问题也答对了——发射塔接火箭，删掉了一整套支腿。完美闭环。'
    },
    en:{
      title:'Chopsticks Catch', titleEn:'筷子夹火箭', lang:'中', back:'← Menu',
      hook:"Musk: landing legs weigh several tons and ride to space for nothing. Let the <b>tower</b> catch it! Mechazilla swings out two \"chopsticks\" and <b>catches</b> the booster in mid-air. Line up the centerline, judge the height, close.",
      drop:'DROP', close:'CLOSE 🥢', retry:'Retry',
      labH:'Δ to arms', labSpd:'SPD', labAln:'ALIGN',
      left:'◀ thrust', right:'thrust ▶',
      ready:'Tap DROP. The booster falls while a crosswind pushes it — hold the centerline with left/right thrust and CLOSE when it reaches <b>arm height</b>.',
      badgeLocked:'Badge locked: catch the booster mid-air to earn "Chopstick Operator".',
      badgeEarned:'Badge earned: "Chopstick Operator" — the hardest claw-machine grab ever, and you nailed it.',
      hud_above:'high', hud_below:'low',
      resOk:{tag:'Caught it! 🎉', t:'The chopsticks close clean and the booster hangs there, swaying gently…<b> You just pulled off the hardest claw-machine grab humans have tried.</b><small> The tower catches it, so it never has to carry tons of landing legs to space.</small>'},
      resEarly:{tag:'Closed too early 💥', t:(d)=>`Closed too soon — the booster was still <b>${d} m</b> above and slammed into the shut arms.<small> Boom? Another data point. Let it drop a bit more.</small>`},
      resLate:{tag:'Slipped past 💥', t:(d)=>`Half a beat late — it was already <b>${d} m</b> below the arms and slid through toward the ground.<small> Boom? Another data point. Close a touch earlier.</small>`},
      resMiss:{tag:'Not lined up 💥', t:(o)=>`Height was right, but it was <b>${o} m</b> off the centerline and clipped a chopstick, tumbling.<small> Boom? Another data point. Use the side thrust to recenter first.</small>`},
      resGround:{tag:'Hit the ground 💥', t:'Never closed — the booster rode all the way down.<small> Boom? Another data point. Watch "Δ to arms" and close near 0.</small>'},
      q:'Removing the landing legs is really carrying out which mantra?',
      choices:[
        {k:'A', txt:'"Boom is also data"', cls:'wrong', fb:'True saying, but it\'s about daring to fail — not why the legs are gone. Think again.'},
        {k:'B', txt:'"The best part is no part"', cls:'correct', fb:'Yes! The legs no longer fly, so the tons they weighed all become payload — the best part is the one you never install.'},
        {k:'C', txt:'"It depends"', cls:'wrong', fb:'The universal answer, but here there is a clear right one: deleting a whole leg system is "delete the part".'}
      ],
      qDone:'Badge earned and the question nailed — the tower catches the rocket, deleting a whole set of landing legs. Clean loop.'
    }
  };
  let lang='zh';

  const $=id=>document.getElementById(id);
  const canvas=$('c'), ctx=canvas.getContext('2d');
  const verdictEl=$('verdict'), badgeEl=$('badge'), badgeText=$('badgeText');
  const fireBtn=$('fireBtn'), retryBtn=$('retryBtn');
  const vH=$('vH'), vSpd=$('vSpd'), vAln=$('vAln'), alnZone=$('alnZone'), alnDot=$('alnDot');
  const leftBtn=$('leftBtn'), rightBtn=$('rightBtn');
  const quizPanel=$('quizPanel'), choicesEl=$('choices'), qFeedback=$('qFeedback');

  let earned=false, quizDone=false;
  try{ earned=localStorage.getItem('mg.badge.chopsticks')==='1'; }catch(e){}

  // ---------- canvas ----------
  let W=0,Hp=0,dpr=1; const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; Hp=rect.height; canvas.width=W*dpr; canvas.height=Hp*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<80;i++) stars.push({x:Math.random(),y:Math.random()*0.6,r:Math.random()*1.2+0.2,a:Math.random()*0.6+0.2}); }
    draw();
  }
  function groundPx(){ return Hp*0.94; }
  function pxPerM(){ return (groundPx()-Hp*0.04)/H_VIEW; }
  function altToPy(y){ return groundPx()-y*pxPerM(); }
  const TOWER_X=-40;                       // tower stands left of the catch line
  function xToPx(x){ return W*0.56 + x*pxPerM(); }  // catch line ~ centre-right

  // ---------- state ----------
  let state='ready';        // ready | live | done
  let base, vy, x, vx, windAcc, windPh, userThrust, armClose, result, pinNow;
  let lastT=0, shake=0, puffs=[], sway=0;

  function reset(){
    state='ready';
    base=BASE0; vy=VY0; x=(Math.random()<0.5?-1:1)*(5+Math.random()*3); vx=0;
    windAcc=(Math.random()<0.5?-1:1)*(1.0+Math.random()*0.9); windPh=Math.random()*7;
    userThrust=0; armClose=0; result=null; puffs=[]; shake=0; sway=0;
    pinNow=base+PIN;
    fireBtn.textContent=T18[lang].drop; fireBtn.className='fire'; fireBtn.disabled=false;
    quizPanel.classList.add('hidden'); hideVerdict();
    updateHUD(); draw();
  }

  // ---------- physics ----------
  function integrate(h,t){
    // vertical landing-burn controller (real): thrust drives vy -> -V_SLOW
    let thrust=g+KP*(-V_SLOW - vy); if(thrust<0) thrust=0;
    const a=-g+thrust;
    vy+=a*h; base+=vy*h; pinNow=base+PIN;
    // lateral: gusty crosswind + player side thrust
    const wind=windAcc*(0.7+0.3*Math.sin(t*1.3+windPh));
    const ax=wind+userThrust*11;
    vx+=ax*h; x+=vx*h;
  }
  function timeScaleAt(){
    const d=Math.abs(pinNow-H_ARM);
    let ts=1.0;
    if(d<22) ts=0.45+(1.0-0.45)*(d/22);   // gentle slow-mo through the catch band
    return ts;
  }

  function tick(now){
    if(!lastT) lastT=now;
    let dtReal=Math.min(0.05,(now-lastT)/1000); lastT=now;
    if(state==='live'){
      let simT=dtReal*timeScaleAt(); tSim+=dtReal;
      while(simT>0 && state==='live'){
        const h=Math.min(0.004,simT); integrate(h,tSim); simT-=h;
        if(base<=0){ base=0; missGround(); break; }
      }
      if(Math.random()<0.5) spawnPuff();
      updateHUD();
    }
    if(state==='done' && result && result.k==='ok'){ sway+=dtReal; }
    for(const p of puffs){ p.life-=dtReal; p.r+=p.gr*dtReal; if(p.boom){ p.x+=p.vx*dtReal; p.y+=p.vy*dtReal; } }
    puffs=puffs.filter(p=>p.life>0);
    if(shake>0) shake=Math.max(0,shake-dtReal*2.4);
    // animate arms toward target
    const target = (state==='done'&&result&&result.k==='ok')?1 : (armClose);
    // (armClose already 0/1; smooth handled in draw via arm gap lerp store)
    armGap += ((target?HOLD_HALF:OPEN_HALF)-armGap)*Math.min(1,dtReal*10);
    draw();
    requestAnimationFrame(tick);
  }
  let tSim=0, armGap=OPEN_HALF;

  function spawnPuff(){
    const py=altToPy(base), px=xToPx(x);
    puffs.push({x:px+(Math.random()-0.5)*10, y:py+3, r:3+Math.random()*3, gr:24, life:0.5+Math.random()*0.3});
  }

  // ---------- close / evaluate ----------
  function closeArms(){
    if(state!=='live') return;
    state='done';
    const dv=pinNow-H_ARM;          // + = booster still above arms (early), - = below (late)
    const off=Math.abs(x);
    fireBtn.disabled=true;
    if(Math.abs(dv)>TOL_V){
      if(dv>0) result={k:'early',d:Math.round(dv)};
      else result={k:'late',d:Math.round(-dv)};
      armClose=1; boom();
    } else if(off>TOL_X){
      result={k:'miss',o:off.toFixed(1)};
      armClose=1; boom();
    } else {
      result={k:'ok'}; armClose=1; x=0;           // snap to centre, held
      earned=true;
      try{ localStorage.setItem('mg.badge.chopsticks','1'); }catch(e){}
      revealQuiz();
    }
    showVerdict(); renderBadge();
  }
  function missGround(){
    state='done'; result={k:'ground'}; fireBtn.disabled=true; boom(); showVerdict();
  }
  function boom(){
    shake=1; const py=altToPy(base), px=xToPx(x);
    for(let i=0;i<24;i++){ const a=Math.random()*7, sp=30+Math.random()*90;
      puffs.push({x:px,y:py,r:4+Math.random()*6,gr:sp,life:0.6+Math.random()*0.5,boom:true,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp}); }
  }

  function onFire(){
    if(state==='ready'){ state='live'; lastT=0; tSim=0; fireBtn.textContent=T18[lang].close; }
    else if(state==='live') closeArms();
  }

  // ---------- drawing ----------
  function draw(){
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-0.5)*10*shake,(Math.random()-0.5)*10*shake);
    ctx.clearRect(-20,-20,W+40,Hp+40);
    const sky=ctx.createLinearGradient(0,0,0,groundPx());
    sky.addColorStop(0,'#05070f'); sky.addColorStop(0.6,'#0a1428'); sky.addColorStop(1,'#101d33');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundPx());
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*Hp,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ground
    ctx.fillStyle='#0c1524'; ctx.fillRect(0,groundPx(),W,Hp-groundPx());
    ctx.fillStyle='#16233a'; ctx.fillRect(0,groundPx(),W,3);
    drawTower();
    drawBooster();
    drawArms();
    drawPuffs();
    // wind arrow
    if(state!=='done'){
      const dir=windAcc>0?1:-1, wx=42, wy=Hp*0.16;
      ctx.strokeStyle='rgba(74,163,255,.75)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(wx-dir*15,wy); ctx.lineTo(wx+dir*15,wy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx+dir*15,wy); ctx.lineTo(wx+dir*7,wy-5); ctx.lineTo(wx+dir*7,wy+5); ctx.closePath();
      ctx.fillStyle='rgba(74,163,255,.75)'; ctx.fill();
      ctx.fillStyle='rgba(74,163,255,.9)'; ctx.font='10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(lang==='zh'?'侧风':'wind', wx, wy-10);
    }
    ctx.restore();
  }
  function drawTower(){
    const tx=xToPx(TOWER_X), top=altToPy(H_ARM+40), bot=groundPx();
    ctx.fillStyle='#2a323f'; ctx.fillRect(tx-9,top,18,bot-top);
    ctx.strokeStyle='#3c4655'; ctx.lineWidth=1.4;
    for(let yy=top; yy<bot; yy+=16){ ctx.beginPath(); ctx.moveTo(tx-9,yy); ctx.lineTo(tx+9,yy+10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx+9,yy); ctx.lineTo(tx-9,yy+10); ctx.stroke(); }
    // catch line guide (dashed centre)
    if(state!=='done'){
      ctx.strokeStyle='rgba(255,207,90,.35)'; ctx.setLineDash([5,6]); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(xToPx(0),altToPy(H_ARM+34)); ctx.lineTo(xToPx(0),groundPx()); ctx.stroke();
      ctx.setLineDash([]);
      // arm-height guide
      ctx.strokeStyle='rgba(87,211,140,.4)'; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(tx+9,altToPy(H_ARM)); ctx.lineTo(W,altToPy(H_ARM)); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  function drawBooster(){
    // early/late/ground failures are consumed by the explosion — don't draw the body
    if(state==='done' && result && (result.k==='early'||result.k==='late'||result.k==='ground')) return;
    const cxCatch=xToPx(0);
    let px=xToPx(x), py=altToPy(base);
    let rot=0;
    if(state==='done' && result){
      if(result.k==='ok'){ px=cxCatch; rot=Math.sin(sway*1.6)*0.05; py=altToPy(H_ARM-PIN); }
      else if(result.k==='miss'){ rot=0.5; }        // tumbling
    }
    const wpx=WID*pxPerM(), lpx=LEN*pxPerM();
    ctx.save(); ctx.translate(px,py); ctx.rotate(rot);
    // flame while descending
    if(state==='live'){
      const fl=14+Math.random()*8;
      const fg=ctx.createLinearGradient(0,0,0,fl);
      fg.addColorStop(0,'#fff'); fg.addColorStop(0.4,'#ffd27f'); fg.addColorStop(1,'rgba(255,140,66,0)');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.lineTo(0,fl); ctx.closePath(); ctx.fill();
    }
    // body (bottom at 0, extends up -lpx)
    ctx.fillStyle='#d7dbe2'; ctx.fillRect(-wpx/2,-lpx,wpx,lpx);
    ctx.fillStyle='#b8bec8'; ctx.fillRect(-wpx/2,-lpx,3,lpx);
    // black top / grid fins
    ctx.fillStyle='#1a1d24'; ctx.fillRect(-wpx/2,-lpx,wpx,lpx*0.10);
    ctx.fillStyle='#8a909c'; ctx.fillRect(-wpx/2-5,-lpx+lpx*0.14,5,6); ctx.fillRect(wpx/2,-lpx+lpx*0.14,5,6);
    // catch pins (load points near top)
    ctx.fillStyle='#ff8c42';
    const pinScreen=-(LEN-PIN)*pxPerM();       // pin located at PIN above base
    ctx.fillRect(-wpx/2-3,pinScreen-2,3,4); ctx.fillRect(wpx/2,pinScreen-2,3,4);
    ctx.restore();
  }
  function drawArms(){
    const ay=altToPy(H_ARM), tx=xToPx(TOWER_X), cx=xToPx(0);
    const gapPx=armGap*pxPerM();
    ctx.strokeStyle='#c7ccd3'; ctx.lineWidth=7; ctx.lineCap='round';
    // left arm: from tower to (cx-gap)
    ctx.beginPath(); ctx.moveTo(tx,ay-4); ctx.lineTo(cx-gapPx,ay-4); ctx.stroke();
    // right arm: a short opposing prong from the right
    ctx.beginPath(); ctx.moveTo(cx+gapPx,ay-4); ctx.lineTo(cx+gapPx+26,ay-4); ctx.stroke();
    // prong tips
    ctx.fillStyle='#ffd27f';
    ctx.beginPath(); ctx.arc(cx-gapPx,ay-4,5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+gapPx,ay-4,5,0,7); ctx.fill();
    // second chopstick (slightly below, for the "two sticks" look)
    ctx.strokeStyle='#aeb4bf'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(tx,ay+6); ctx.lineTo(cx-gapPx,ay+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+gapPx,ay+6); ctx.lineTo(cx+gapPx+26,ay+6); ctx.stroke();
  }
  function drawPuffs(){
    for(const p of puffs){
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
      ctx.fillStyle=p.boom?(Math.random()<0.5?'#ffd27f':'#ff8c42'):'rgba(210,220,230,.7)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // ---------- HUD ----------
  function updateHUD(){
    const dv=pinNow-H_ARM;
    vH.innerHTML = (dv>=0?'+':'') + Math.round(dv) + '<small> m</small>';
    vH.className = 'val' + (Math.abs(dv)<=TOL_V?' ok':'');
    const kmh=Math.round(Math.abs(vy)*3.6);
    vSpd.innerHTML = kmh + '<small> km/h</small>';
    const off=x;
    vAln.innerHTML = (Math.abs(off)<=TOL_X? (lang==='zh'?'中线':'centered') : (Math.round(Math.abs(off))+'m '+(off<0?'◀':'▶')));
    vAln.className='val'+(Math.abs(off)<=TOL_X?' ok':' warn');
    // align bar: map x in [-20,20] to 0..100%
    const span=20;
    alnZone.style.left = (50 - TOL_X/span*50)+'%';
    alnZone.style.width = (TOL_X/span*100)+'%';
    alnDot.style.left = (50 + Math.max(-1,Math.min(1,off/span))*50)+'%';
  }

  // ---------- verdict ----------
  function showVerdict(){
    const t=T18[lang]; let cls='bad', tag, body;
    if(result.k==='ok'){ cls='ok'; tag=t.resOk.tag; body=t.resOk.t; }
    else if(result.k==='early'){ tag=t.resEarly.tag; body=t.resEarly.t(result.d); }
    else if(result.k==='late'){ tag=t.resLate.tag; body=t.resLate.t(result.d); }
    else if(result.k==='miss'){ tag=t.resMiss.tag; body=t.resMiss.t(result.o); }
    else { tag=t.resGround.tag; body=t.resGround.t; }
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${tag}</span>${body}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ---------- quiz ----------
  function revealQuiz(){
    quizPanel.classList.remove('hidden');
    renderQuiz();
  }
  function renderQuiz(){
    const t=T18[lang];
    $('qText').textContent=t.q;
    choicesEl.innerHTML='';
    t.choices.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='choice'; b.type='button';
      b.innerHTML=`<span class="key">${c.k}</span><span>${c.txt}</span>`;
      b.addEventListener('click',()=>pickChoice(i,b));
      choicesEl.appendChild(b);
    });
    qFeedback.textContent = quizDone ? t.qDone : '';
    if(quizDone){ // re-mark
      [...choicesEl.children].forEach((el,i)=>{ if(t.choices[i].cls==='correct') el.classList.add('correct'); });
    }
  }
  function pickChoice(i,btn){
    const t=T18[lang], c=t.choices[i];
    if(c.cls==='correct'){
      btn.classList.add('correct'); quizDone=true;
      qFeedback.innerHTML='<b>'+c.fb+'</b>';
      [...choicesEl.children].forEach(el=>el.style.pointerEvents='none');
    } else {
      btn.classList.add('wrong');
      qFeedback.innerHTML=c.fb+' <span class="muted">'+(lang==='zh'?'炸了？又一份数据。':'Boom? Another data point.')+'</span>';
    }
  }

  // ---------- badge / static ----------
  function renderBadge(){ badgeEl.className='badge'+(earned?' earned':''); badgeText.textContent=earned?T18[lang].badgeEarned:T18[lang].badgeLocked; }
  function renderStatic(){
    const t=T18[lang];
    $('title').textContent=t.title; $('titleEn').textContent=t.titleEn;
    $('langBtn').textContent=t.lang; $('back').textContent=t.back; $('hook').innerHTML=t.hook;
    $('labH').textContent=t.labH; $('labSpd').textContent=t.labSpd; $('labAln').textContent=t.labAln;
    leftBtn.textContent=t.left; rightBtn.textContent=t.right; retryBtn.textContent=t.retry;
    if(state==='ready') fireBtn.textContent=t.drop; else if(state==='live') fireBtn.textContent=t.close;
    document.documentElement.lang=lang;
    renderBadge();
    if(state==='done') showVerdict();
    if(!quizPanel.classList.contains('hidden')) renderQuiz();
  }

  // ---------- events ----------
  fireBtn.addEventListener('click', onFire);
  retryBtn.addEventListener('click', ()=>reset());
  function holdBtn(btn,dir){
    const on=e=>{ e.preventDefault(); userThrust=dir; };
    const off=e=>{ e.preventDefault(); if(userThrust===dir) userThrust=0; };
    btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off);
    btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off);
  }
  holdBtn(leftBtn,-1); holdBtn(rightBtn,1);
  // drag on canvas to steer laterally
  canvas.addEventListener('pointerdown', dragMove);
  canvas.addEventListener('pointermove', e=>{ if(dragging) dragMove(e); });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
  let dragging=false;
  function dragMove(e){
    if(state!=='live') return;
    dragging=true;
    const rect=canvas.getBoundingClientRect();
    const mxPx=e.clientX-rect.left;
    const targetX=(mxPx-W*0.56)/pxPerM();
    // steer toward pointer (set velocity, respecting it's a nudge not teleport)
    vx += Math.max(-1,Math.min(1,(targetX-x)/6))*4;
    if(vx>18)vx=18; if(vx<-18)vx=-18;
  }
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ e.preventDefault(); onFire(); }
    else if(e.code==='ArrowLeft'){ userThrust=-1; }
    else if(e.code==='ArrowRight'){ userThrust=1; }
  });
  window.addEventListener('keyup', e=>{ if(e.code==='ArrowLeft'||e.code==='ArrowRight') userThrust=0; });
  $('langBtn').addEventListener('click', ()=>{ lang=lang==='zh'?'en':'zh'; renderStatic(); updateHUD(); draw(); });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic(); reset(); resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
