<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>气球火箭 · Balloon Rocket</title>
<link rel="stylesheet" href="../common.css">
<style>
  .dpad{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:8px; max-width:260px; margin:4px auto 0}
  .dpad button{min-width:0; padding:14px 0; font-size:20px}
  .dpad .lbl{display:grid; place-items:center; font-size:11px; color:var(--muted); text-align:center; line-height:1.2}
  .dpad button.sel{background:linear-gradient(180deg,#ff9a4d,#e5651a); border-color:#ff9a4d; color:#1a0d02}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">气球火箭</h1><span class="en" id="titleEn">Balloon Rocket</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <p class="q" id="q"></p>
    <div class="dpad">
      <div class="lbl"></div><button data-d="up" id="btnUp">↑</button><div class="lbl"></div>
      <button data-d="left" id="btnLeft">←</button>
      <div class="lbl" id="nozzleLbl"></div>
      <button data-d="right" id="btnRight">→</button>
      <div class="lbl"></div><button data-d="down" id="btnDown">↓</button><div class="lbl"></div>
    </div>
    <div class="buttons" style="margin-top:14px">
      <button class="fire" id="releaseBtn">放手！</button>
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  const T={
    zh:{
      title:'气球火箭', titleEn:'Balloon Rocket', lang:'EN', back:'← 目录',
      hook:'马斯克：气往哪喷，气球就往<b>反方向</b>跑。想上天，气球的<b>嘴（喷口）</b>该朝哪？先选喷口方向，再放手——看看气球往哪冲。',
      q:'先选气球<b>喷口朝哪个方向</b>，再点"放手！"。目标：让气球飞到上面的⭐。',
      nozzle:'喷口', release:'放手！', reset:'重来',
      badgeLocked:'徽章未解锁：让气球飞到星星，即可获得「气球指挥官」。',
      badgeEarned:'已获得徽章「气球指挥官」——喷口朝下，气往下喷，气球才往上飞。',
      pick:'⚠️ 先选一个喷口方向。',
      win:{tag:'够到星星了！⭐', t:'完美！喷口<b>朝下</b>，空气拼命往下喷，气球就被推着<b>往上</b>飞。<small> 这就是火箭：发动机朝下喷火，火箭朝上飞。喷口方向 = 反方向。</small>'},
      up:{tag:'一头栽下去', t:'喷口朝上，空气往上喷，气球就往<b>下</b>砸！它疯了！<b>又一份数据。</b><small> 记住：气往哪喷，气球往反方向跑。想上天，喷口朝下。</small>'},
      left:{tag:'飞歪了', t:'喷口朝左，空气往左喷，气球"嗖"地飞到<b>右边</b>去了！<b>又一份数据。</b><small> 你把推力用错了方向。要上天，喷口得朝下。</small>'},
      right:{tag:'飞歪了', t:'喷口朝右，空气往右喷，气球"嗖"地飞到<b>左边</b>去了！<b>又一份数据。</b><small> 你把推力用错了方向。要上天，喷口得朝下。</small>'}
    },
    en:{
      title:'Balloon Rocket', titleEn:'气球火箭', lang:'中', back:'← Menu',
      hook:'Musk: air goes one way, the balloon goes the <b>other</b> way. To fly up, which way should the balloon\'s <b>nozzle</b> point? Pick a direction, then let go.',
      q:'First pick which way the <b>nozzle</b> points, then hit "Let go!". Goal: reach the ⭐ above.',
      nozzle:'nozzle', release:'Let go!', reset:'Reset',
      badgeLocked:'Badge locked: fly the balloon to the star to earn "Balloon Commander".',
      badgeEarned:'Badge earned: "Balloon Commander" — nozzle down, air blasts down, balloon flies up.',
      pick:'⚠️ Pick a nozzle direction first.',
      win:{tag:'Reached the star! ⭐', t:'Perfect! Nozzle points <b>down</b>, air blasts down, so the balloon is pushed <b>up</b>.<small> That\'s a rocket: engine fires down, rocket flies up. Nozzle direction = opposite direction.</small>'},
      up:{tag:'Nose-dived', t:'Nozzle up, air blasts up, balloon slams <b>down</b>! It went crazy! <b>Another data point.</b><small> Remember: air one way, balloon the other. To go up, nozzle down.</small>'},
      left:{tag:'Flew sideways', t:'Nozzle left, air blasts left, balloon zooms off to the <b>right</b>! <b>Another data point.</b><small> Wrong direction for thrust. To go up, nozzle points down.</small>'},
      right:{tag:'Flew sideways', t:'Nozzle right, air blasts right, balloon zooms off to the <b>left</b>! <b>Another data point.</b><small> Wrong direction for thrust. To go up, nozzle points down.</small>'}
    }
  };
  let lang='zh';

  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const verdictEl=document.getElementById('verdict');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');
  const releaseBtn=document.getElementById('releaseBtn'), resetBtn=document.getElementById('resetBtn');
  const dBtns={up:document.getElementById('btnUp'),down:document.getElementById('btnDown'),left:document.getElementById('btnLeft'),right:document.getElementById('btnRight')};

  let W=0,H=0,dpr=1; const stars=[];
  let starPos={x:0,y:0};
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<80;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,a:Math.random()*0.6+0.2}); }
    starPos={x:W*0.5, y:H*0.13};
    draw();
  }

  // ---------- state ----------
  let nozzle=null;      // 'up'|'down'|'left'|'right'
  let flying=false, outcome=null;
  let bx=0,by=0, bvx=0,bvy=0, size=1, spin=0, jets=[];
  const dir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

  function reset(){
    flying=false; outcome=null; nozzle=null; jets=[]; spin=0; size=1;
    bx=W*0.5; by=H*0.72; bvx=0; bvy=0;
    for(const k in dBtns) dBtns[k].classList.remove('sel');
    releaseBtn.disabled=false;
    hideVerdict(); draw();
  }

  function selectNozzle(d){
    if(flying) return;
    nozzle=d;
    for(const k in dBtns) dBtns[k].classList.toggle('sel', k===d);
    draw();
  }

  function release(){
    if(flying) return;
    if(!nozzle){ verdictEl.className='verdict show info'; verdictEl.innerHTML=`<span class="tag">?</span>${T[lang].pick}`; return; }
    flying=true; releaseBtn.disabled=true; hideVerdict();
    requestAnimationFrame(loop);
  }

  let lastT=0;
  function loop(now){
    if(!lastT) lastT=now;
    const dt=Math.min(0.03,(now-lastT)/1000); lastT=now;
    // thrust = opposite of nozzle. air jets out the nozzle direction.
    const [nx,ny]=dir[nozzle];
    const thrust=520;                    // px/s^2 while air remains
    if(size>0.18){
      bvx += -nx*thrust*dt;
      bvy += -ny*thrust*dt;
      size -= 0.55*dt;                    // deflate
      // emit air jet particles OUT the nozzle
      for(let i=0;i<2;i++){
        jets.push({x:bx+nx*14, y:by+ny*14, vx:nx*260+(Math.random()-0.5)*90, vy:ny*260+(Math.random()-0.5)*90, life:1});
      }
      // sideways launches wobble/spin for fun
      if(nozzle==='left'||nozzle==='right') spin += 6*dt;
      if(nozzle==='up') spin += 3*dt;
    }
    bx+=bvx*dt; by+=bvy*dt;
    for(const j of jets){ j.x+=j.vx*dt; j.y+=j.vy*dt; j.life-=dt*1.6; }
    jets=jets.filter(j=>j.life>0);
    draw();

    // resolve outcome
    if(!outcome){
      if(nozzle==='down'){
        if(Math.hypot(bx-starPos.x,by-starPos.y)<34){ settle('win'); return; }
        if(by< -40){ settle('win'); return; }   // safety: made it up top
      } else if(by>H+40 || by<-40 || bx<-40 || bx>W+40){
        settle(nozzle); return;
      }
    }
    if(flying) requestAnimationFrame(loop);
  }

  function settle(o){
    outcome=o; flying=false;
    if(o==='win'){ bx=starPos.x; by=starPos.y; try{ localStorage.setItem('mg.badge.balloon','1'); }catch(e){} }
    draw(); showVerdict(o); renderBadge();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#cfe0ff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ground
    ctx.fillStyle='#0a1a2e'; ctx.fillRect(0,H*0.78,W,H*0.22);
    ctx.strokeStyle='rgba(180,220,255,.15)'; ctx.beginPath(); ctx.moveTo(0,H*0.78); ctx.lineTo(W,H*0.78); ctx.stroke();
    // target star
    drawStar(starPos.x,starPos.y, outcome==='win');
    // air jet particles
    for(const j of jets){ ctx.globalAlpha=Math.max(0,j.life); ctx.fillStyle='#bfe0ff'; ctx.beginPath(); ctx.arc(j.x,j.y,3.2,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    drawBalloon();
  }

  function drawStar(x,y,glow){
    ctx.save(); ctx.translate(x,y);
    if(glow){ ctx.shadowColor='#ffd27f'; ctx.shadowBlur=24; }
    ctx.fillStyle=glow?'#ffd27f':'#6b7590';
    ctx.beginPath();
    for(let i=0;i<10;i++){ const r=i%2?6:14; const a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawBalloon(){
    ctx.save(); ctx.translate(bx,by); ctx.rotate(spin);
    const s=Math.max(0.18,size);
    // nozzle points 'nozzle' direction: draw knot on that side
    const [nx,ny]=nozzle?dir[nozzle]:[0,1];
    // body
    ctx.fillStyle='#ff5a7a';
    ctx.beginPath(); ctx.ellipse(0,0,20*s,24*s,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-6*s,-8*s,5*s,8*s,0,0,7); ctx.fill();
    // knot/nozzle
    ctx.fillStyle='#c8324f';
    ctx.beginPath(); ctx.moveTo(nx*20*s-ny*5, ny*20*s+nx*5); ctx.lineTo(nx*30*s,ny*30*s); ctx.lineTo(nx*20*s+ny*5, ny*20*s-nx*5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function showVerdict(o){
    const vd=T[lang][o]; const cls=o==='win'?'ok':'bad';
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }
  function renderBadge(){
    const earned=(()=>{ try{ return localStorage.getItem('mg.badge.balloon')==='1'; }catch(e){ return false; } })();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.getElementById('q').innerHTML=t.q;
    document.getElementById('nozzleLbl').textContent=t.nozzle;
    releaseBtn.textContent=t.release; resetBtn.textContent=t.reset;
    document.documentElement.lang=lang;
  }

  for(const k in dBtns) dBtns[k].addEventListener('click',()=>selectNozzle(k));
  releaseBtn.addEventListener('click',release);
  resetBtn.addEventListener('click',reset);
  document.getElementById('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh'; renderStatic(); if(outcome) showVerdict(outcome); renderBadge();
  });
  window.addEventListener('resize',resize);

  renderStatic(); renderBadge(); resize(); reset();
})();
</script>
</body>
</html>
