<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Max-Q 油门挑战 · Max-Q Throttle</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* ---- game-specific: throttle control + canvas HUD (not in common.css) ---- */
  .callout{position:absolute; left:0; right:0; top:12px; text-align:center; pointer-events:none;
           font-size:20px; font-weight:800; letter-spacing:.5px; opacity:0; transition:.2s;
           text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .callout.show{opacity:1}
  .callout .en{display:block; font-size:12px; font-weight:600; opacity:.85; margin-top:2px}
  .callout.go{color:var(--ok)}
  .callout.warn{color:var(--flame2)}
  .callout.danger{color:#ff8f8f}

  .thr-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
  .thr-head .lbl{font-size:13px; color:var(--muted)}
  .thr-head .val{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--flame2)}
  .thr-head .val small{font-size:13px; color:var(--muted); font-weight:600}
  .thrwrap{position:relative; padding:4px 2px 6px}
  /* colour the throttle track so it reads as a power lever */
  #thr{background:linear-gradient(90deg,#2f6fb0,#4aa3ff 45%,#ff9a4d 80%,#e5651a)}

  .hud{position:absolute; top:10px; left:12px; font-size:12px; line-height:1.55;
       color:var(--ink); text-shadow:0 1px 6px rgba(0,0,0,.9); pointer-events:none; font-variant-numeric:tabular-nums}
  .hud b{color:var(--flame2); font-size:15px}
  .hud .k{color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">Max-Q 油门挑战</h1><span class="en" id="titleEn">Max-Q Throttle</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud"></div>
    <div class="callout" id="callout"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <!-- Q meter with fixed red danger zone -->
    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="qlbl">动压 Q</span><span><b id="qval">0</b> <span class="k">kPa</span></span></div>
        <div class="mbar">
          <div class="mfill blue" id="qfill" style="width:0%"></div>
          <div class="mzone" id="qzone"></div>
        </div>
      </div>
    </div>
    <div class="analogy" id="analogy"></div>

    <!-- throttle -->
    <div class="thr-head">
      <span class="lbl" id="thrlbl">油门 THROTTLE</span>
      <span class="val"><span id="thrval">100</span><small>%</small></span>
    </div>
    <div class="thrwrap">
      <input type="range" id="thr" min="0" max="100" step="1" value="100" />
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">点火发射</button>
      <button class="ghost" id="retryBtn">重来</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ============================================================
  //  REAL PHYSICS (SI units, numeric time integration)
  //  Q = 0.5 * rho(h) * v^2 ,  rho(h) = rho0 * exp(-h/H)
  //  a = (Fmax*throttle - drag - m*g) / m ,  drag = Q * CdA
  //  rho falls with altitude while v rises  ->  Q rises then FALLS (single peak)
  // ============================================================
  const g0   = 9.8;
  const RHO0 = 1.225;      // kg/m^3 sea-level air density
  const H    = 8500;       // m   atmospheric scale height
  const FMAX = 8.0e6;      // N   full-throttle thrust (Falcon-ish)
  const CDA  = 3.6;        // m^2 drag coeff * area (lumped)
  const MDOT = 2000;       // kg/s propellant burn at full throttle
  const M0   = 550000;     // kg  liftoff mass
  const M_DRY= 250000;     // kg  floor so we never burn to nothing

  const Q_RED   = 24000;   // Pa  crossing this = 解体 / breakup
  const Q_MAX   = 30000;   // Pa  full scale of the Q meter
  const TARGET  = 10000;   // m   survive Max-Q AND reach this = win
  const TSCALE  = 3.4;     // sim-seconds per wall-second (watchable time-lapse)

  const rho = h => RHO0 * Math.exp(-h/H);

  // ---------- i18n ----------
  const T = {
    zh:{
      title:'Max-Q 油门挑战', titleEn:'Max-Q Throttle', lang:'EN', back:'← 目录',
      hook:'马斯克：起飞一分钟，空气从微风变成<b>一堵墙</b>。最凶那一刻，<b>主动松油门</b>——扛过去，再轰满。',
      qlbl:'动压 Q', thrlbl:'油门 THROTTLE', fire:'点火发射', retry:'重来', flying:'飞行中…',
      analogyIdle:'动压 Q = 迎面空气砸在火箭上的力。飞得越快、空气越浓，这堵墙越硬。',
      analogyFly:(q)=>`这堵风墙 ≈ 把手伸出<b>时速 ${Math.round(Math.sqrt(2*q/RHO0)*3.6)} 公里</b>的车窗。`,
      cLift:{a:'全速起飞！',b:'FULL THROTTLE'},
      cDown:{a:'松油门！',b:'THROTTLE DOWN'},
      cMaxQ:{a:'Max-Q… 挺住',b:'Max-Q… hold on'},
      cUp:{a:'轰满油门！',b:'THROTTLE UP'},
      badgeLocked:'徽章未解锁：扛过 Max-Q 并抛掉整流罩，即可获得「扛过 Max-Q」。',
      badgeEarned:'已获得徽章「扛过 Max-Q」——最凶那一刻松油门，风墙就推不垮你。',
      vBoom:{tag:'解体 💥', t:'空气这堵墙，硬闯是闯不过的。<b>炸了？又一份数据。</b><small> 油门全开冲进 Max-Q，动压顶穿了红线。下次在最凶那一刻松一下。</small>'},
      vWin:{tag:'扛过 Max-Q 🛰️', t:'漂亮！你在最凶那一刻松了油门，风墙没推垮你。<b>抛整流罩——太空见。</b><small> 动压过了峰值就一路下滑，现在空气稀薄，可以轰满油门了。</small>'},
      vStall:{tag:'推力不够', t:'油门收太狠，火箭飞不动、开始往回掉。<b>炸了？又一份数据。</b><small> 松油门是为了扛 Max-Q，不是熄火——留住往上冲的劲。</small>'}
    },
    en:{
      title:'Max-Q Throttle', titleEn:'Max-Q 油门挑战', lang:'中', back:'← Menu',
      hook:'Musk: one minute after liftoff, the air turns from a breeze into <b>a wall</b>. At the worst instant, <b>ease off the throttle</b> — ride it out, then go full again.',
      qlbl:'Dyn. pressure Q', thrlbl:'THROTTLE', fire:'IGNITE', retry:'Retry', flying:'flying…',
      analogyIdle:'Q = the force of oncoming air slamming the rocket. Faster + thicker air = a harder wall.',
      analogyFly:(q)=>`This air wall ≈ sticking your hand out a car at <b>${Math.round(Math.sqrt(2*q/RHO0)*3.6)} km/h</b>.`,
      cLift:{a:'FULL THROTTLE',b:'全速起飞'},
      cDown:{a:'THROTTLE DOWN',b:'松油门'},
      cMaxQ:{a:'Max-Q… hold on',b:'挺住'},
      cUp:{a:'THROTTLE UP',b:'轰满油门'},
      badgeLocked:'Badge locked: survive Max-Q and jettison the fairing to earn "Survived Max-Q".',
      badgeEarned:'Badge earned: "Survived Max-Q" — ease off at the worst instant and the air wall can\'t break you.',
      vBoom:{tag:'Breakup 💥', t:'You can\'t muscle through the air wall. <b>Boom? Another data point.</b><small> Full throttle into Max-Q pushed dynamic pressure past the red line. Next time, ease off at the worst instant.</small>'},
      vWin:{tag:'Survived Max-Q 🛰️', t:'Beautiful — you eased off at the worst instant and the wall never broke you. <b>Fairing away — see you in space.</b><small> Past the peak Q only falls; the air is thin now, so go full throttle.</small>'},
      vStall:{tag:'Not enough thrust', t:'Throttled down too hard — the rocket stalls and starts falling back. <b>Boom? Another data point.</b><small> Easing off is to survive Max-Q, not to shut down — keep the climb alive.</small>'}
    }
  };
  let lang = 'zh';

  // ---------- DOM ----------
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const hudEl=document.getElementById('hud'), calloutEl=document.getElementById('callout');
  const verdictEl=document.getElementById('verdict');
  const qfill=document.getElementById('qfill'), qzone=document.getElementById('qzone'), qval=document.getElementById('qval');
  const thr=document.getElementById('thr'), thrval=document.getElementById('thrval');
  const analogyEl=document.getElementById('analogy');
  const fireBtn=document.getElementById('fireBtn'), retryBtn=document.getElementById('retryBtn');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');

  // ---------- canvas sizing (DPR-aware, from newton-cannon) ----------
  let W=0,H_=0,dpr=1; const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H_=rect.height;
    canvas.width=W*dpr; canvas.height=H_*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<140;i++) stars.push({x:Math.random(),y:Math.random()*0.8,r:Math.random()*1.3+0.2,a:Math.random()*0.7+0.3}); }
    draw();
  }

  // ---------- game state ----------
  const PX_PER_M = 0.02;          // world scroll rate
  let state='idle';               // idle | flying | jettison | boom | done
  let h,v,m,missionT, throttle, Q, Qpk, prevQ, touchedRed, phase;
  let last=0;
  const clouds=[];
  const shockParts=[];            // fairing halves / explosion particles
  let shake=0, animT=0;
  let winStored=false;

  function reset(){
    state='idle'; h=0; v=0; m=M0; missionT=0; Q=0; Qpk=0; prevQ=0;
    touchedRed=false; phase='pad'; throttle=1; shake=0; animT=0;
    shockParts.length=0;
    thr.value=100; thrval.textContent='100'; fireBtn.disabled=false;
    clouds.length=0;
    for(let i=0;i<7;i++) clouds.push({alt:800+i*1400+Math.random()*600, x:Math.random(), s:0.5+Math.random()*0.7});
    hideVerdict(); setCallout(null);
    updatePanel();
    draw();
  }

  // ---------- launch / loop ----------
  function launch(){
    if(state!=='idle') return;
    state='flying'; fireBtn.disabled=true; phase='climb';
    last=performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now){
    const dtWall=Math.min(0.05,(now-last)/1000); last=now;
    if(state==='flying'){
      stepPhysics(dtWall*TSCALE);
      updatePanel();
    } else if(state==='jettison' || state==='boom'){
      animT+=dtWall;
      stepAnim(dtWall);
    }
    if(shake>0) shake=Math.max(0,shake-dtWall*2.2);
    draw();
    if(state!=='done') requestAnimationFrame(loop);
  }

  // integrate physics in small fixed sub-steps for stability
  function stepPhysics(dtSim){
    let rem=dtSim;
    while(rem>1e-6 && state==='flying'){
      const dt=Math.min(0.02,rem); rem-=dt;
      throttle = (+thr.value)/100;
      const F = FMAX*throttle;
      Q = 0.5*rho(h)*v*v;
      const drag = Q*CDA;
      const a = (F - drag)/m - g0;
      v += a*dt;
      h += v*dt;
      if(m>M_DRY) m -= MDOT*throttle*dt;
      missionT += dt;
      if(Q>Qpk) Qpk=Q;

      // FAIL: dynamic pressure crossed the red line
      if(Q>=Q_RED){ touchedRed=true; boom(); return; }
      // FAIL: throttled so low it fell back to the pad
      if(v<0 && h<200 && missionT>4){ stall(); return; }
      // WIN: Q clearly past its peak (falling) AND reached target altitude
      const peaked = Qpk>12000 && Q < Qpk*0.6;
      if(peaked && h>=TARGET){ succeed(); return; }
    }
    updateCallout();
  }

  // ---------- callouts (guide the kid live) ----------
  function updateCallout(){
    const rising = Q > prevQ + 1;
    prevQ = Q;
    const peaked = Qpk>12000 && Q < Qpk*0.7;
    let key;
    if(Q < 12000 && !peaked) key = rising && Q>7000 ? 'cLift' : (h<50?'cLift':null);
    if(Q >= 12000 && rising && !peaked) key='cDown';
    if(!rising && Q>=13000 && !peaked) key='cMaxQ';
    if(peaked) key='cUp';
    if(Q<7000 && h<50) key='cLift';
    setCallout(key);
  }
  let curCallout=null;
  function setCallout(key){
    if(key===curCallout) return; curCallout=key;
    if(!key){ calloutEl.className='callout'; return; }
    const c=T[lang][key];
    const cls = key==='cDown'?'danger' : key==='cMaxQ'?'warn' : 'go';
    calloutEl.className='callout show '+cls;
    calloutEl.innerHTML = `${c.a}<span class="en">${c.b}</span>`;
  }

  // ---------- outcomes ----------
  function boom(){
    state='boom'; animT=0; shake=1; setCallout(null);
    for(let i=0;i<26;i++){ const ang=Math.random()*Math.PI*2, sp=40+Math.random()*140;
      shockParts.push({x:0,y:0,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:6+Math.random()*16,life:1}); }
    showVerdict(T[lang].vBoom,'bad');
  }
  function stall(){
    state='boom'; animT=0; shake=0.6; setCallout(null);
    for(let i=0;i<18;i++){ const ang=Math.random()*Math.PI*2, sp=30+Math.random()*90;
      shockParts.push({x:0,y:0,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5+Math.random()*12,life:1}); }
    showVerdict(T[lang].vStall,'bad');
  }
  function succeed(){
    state='jettison'; animT=0; setCallout('cUp');
    // two fairing half-shells split off
    shockParts.push({fair:-1, x:-10, y:-70, vx:-46, vy:-30, rot:0, vr:-1.4});
    shockParts.push({fair: 1, x: 10, y:-70, vx: 46, vy:-30, rot:0, vr: 1.4});
    if(!winStored){ try{ localStorage.setItem('mg.badge.maxq','1'); }catch(e){} winStored=true; }
    renderBadge();
    showVerdict(T[lang].vWin,'ok');
  }
  function stepAnim(dt){
    for(const p of shockParts){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.fair){ p.vy+=60*dt; p.rot+=p.vr*dt; }
      else { p.life-=dt*0.9; }
    }
    // keep the rocket gently climbing during jettison
    if(state==='jettison'){ h+=v*dt*TSCALE*0.4; }
    if(animT>2.6){ state='done'; }
  }

  // ---------- drawing ----------
  function skyColor(alt){
    // day-blue near ground -> black space up high
    const f=Math.min(1,alt/9000);
    const top=[8,14,34], bot=[92,150,210];
    const mix=(i)=>Math.round(bot[i]+(top[i]-bot[i])*f);
    return {top:`rgb(${Math.round(20+ (8-20)*f)},${Math.round(30+(14-30)*f)},${Math.round(60+(34-60)*f)})`,
            bot:`rgb(${mix(0)},${mix(1)},${mix(2)})`, f};
  }
  function draw(){
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*14*shake,(Math.random()-0.5)*14*shake); }
    const sk=skyColor(h);
    const grad=ctx.createLinearGradient(0,0,0,H_);
    grad.addColorStop(0,sk.top); grad.addColorStop(1,sk.bot);
    ctx.fillStyle=grad; ctx.fillRect(-20,-20,W+40,H_+40);
    // stars fade in with altitude
    if(sk.f>0.15){ ctx.globalAlpha=Math.min(1,(sk.f-0.15)/0.5);
      for(const s of stars){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H_,s.r,0,7); ctx.fill(); }
      ctx.globalAlpha=1; }

    const rBaseY = H_*0.66;           // rocket base fixed on screen
    const groundY = rBaseY + h*PX_PER_M;
    // clouds
    for(const cl of clouds){
      const cy = rBaseY - (cl.alt - h)*PX_PER_M;
      if(cy>-40 && cy<H_+40) drawCloud(cl.x*W, cy, cl.s);
    }
    // ground / pad
    if(groundY < H_+40){
      ctx.fillStyle='#3a3f4b'; ctx.fillRect(-20,groundY,W+40,H_-groundY+40);
      ctx.fillStyle='#2b2f38'; ctx.fillRect(W*0.5-40,groundY-6,80,6);
    }

    // rocket + effects
    const rx=W*0.5;
    if(state!=='boom') drawRocket(rx,rBaseY);
    drawAirwall(rx,rBaseY);
    drawParticles(rx,rBaseY);

    // red vignette as Q nears the wall
    const near = Math.min(1,Q/Q_RED);
    if(state==='flying' && near>0.6){
      ctx.globalAlpha=(near-0.6)/0.4*0.5;
      const vg=ctx.createRadialGradient(W/2,H_/2,H_*0.2,W/2,H_/2,H_*0.7);
      vg.addColorStop(0,'rgba(255,60,60,0)'); vg.addColorStop(1,'rgba(255,40,40,1)');
      ctx.fillStyle=vg; ctx.fillRect(0,0,W,H_); ctx.globalAlpha=1;
    }
    ctx.restore();
    drawHud();
  }

  function drawCloud(x,y,s){
    ctx.save(); ctx.globalAlpha=0.85; ctx.fillStyle='rgba(235,242,250,.9)';
    for(const[dx,dy,r] of [[-22,4,16],[0,-6,20],[20,4,15],[38,6,12],[-38,6,11]]){
      ctx.beginPath(); ctx.ellipse(x+dx*s,y+dy*s,r*s,r*s*0.7,0,0,7); ctx.fill();
    }
    ctx.restore();
  }

  function drawRocket(rx,baseY){
    const bodyH=64, bodyW=13, noseH=22;
    const topY=baseY-bodyH;
    // engine flame (scales with throttle)
    if(state==='flying'||state==='jettison'){
      const fl=throttle, len=(14+fl*44)*(0.85+Math.random()*0.3);
      const fg=ctx.createLinearGradient(0,baseY,0,baseY+len);
      fg.addColorStop(0,'#fff'); fg.addColorStop(0.3,'#ffd27f'); fg.addColorStop(1,'rgba(255,90,20,0)');
      ctx.fillStyle=fg; ctx.beginPath();
      ctx.moveTo(rx-bodyW*0.5,baseY); ctx.lineTo(rx+bodyW*0.5,baseY);
      ctx.lineTo(rx+2,baseY+len); ctx.lineTo(rx-2,baseY+len); ctx.closePath(); ctx.fill();
    }
    // fins
    ctx.fillStyle='#c7ccd3';
    ctx.beginPath(); ctx.moveTo(rx-bodyW*0.5,baseY); ctx.lineTo(rx-bodyW*0.5-7,baseY); ctx.lineTo(rx-bodyW*0.5,baseY-16); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx+bodyW*0.5,baseY); ctx.lineTo(rx+bodyW*0.5+7,baseY); ctx.lineTo(rx+bodyW*0.5,baseY-16); ctx.closePath(); ctx.fill();
    // body
    const bg=ctx.createLinearGradient(rx-bodyW*0.5,0,rx+bodyW*0.5,0);
    bg.addColorStop(0,'#d7dce3'); bg.addColorStop(0.5,'#fff'); bg.addColorStop(1,'#b8bec8');
    ctx.fillStyle=bg; ctx.fillRect(rx-bodyW*0.5,topY,bodyW,bodyH);
    // interstage band
    ctx.fillStyle='#2b303a'; ctx.fillRect(rx-bodyW*0.5,topY+14,bodyW,5);
    // fairing / nose (only if not yet jettisoned)
    const jettisoned = shockParts.some(p=>p.fair);
    if(!jettisoned){
      ctx.fillStyle='#eef2f7'; ctx.beginPath();
      ctx.moveTo(rx-bodyW*0.5,topY); ctx.quadraticCurveTo(rx,topY-noseH,rx+bodyW*0.5,topY); ctx.closePath(); ctx.fill();
    }
  }

  function drawAirwall(rx,baseY){
    if(state!=='flying') return;
    const topY=baseY-64-22;
    const inten=Math.min(1,Q/Q_RED);
    if(inten<0.12) return;
    // bright compression bow at the nose
    ctx.save();
    ctx.globalAlpha=inten*0.9;
    ctx.strokeStyle=inten>0.75?`rgba(255,150,120,${inten})`:`rgba(180,215,255,${inten})`;
    ctx.lineWidth=2+inten*2;
    ctx.beginPath(); ctx.arc(rx,topY+6,10+inten*10,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    ctx.restore();
    // rushing air = downward speed lines, density ~ Q
    const n=Math.floor(inten*18);
    ctx.strokeStyle=`rgba(200,225,255,${0.15+inten*0.4})`; ctx.lineWidth=1.4;
    for(let i=0;i<n;i++){
      const lx=rx+(Math.random()-0.5)*70, ly=topY+Math.random()*120, ll=10+Math.random()*24;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+ll); ctx.stroke();
    }
  }

  function drawParticles(rx,baseY){
    for(const p of shockParts){
      if(p.fair){
        // a fairing half-shell tumbling away
        ctx.save();
        ctx.translate(rx+p.x, baseY-70+p.y); ctx.rotate(p.rot);
        ctx.fillStyle='#eef2f7';
        ctx.beginPath();
        ctx.moveTo(0,-11); ctx.quadraticCurveTo(p.fair*9,-4,p.fair*6,12); ctx.lineTo(0,12); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        if(p.life<=0) continue;
        ctx.globalAlpha=Math.max(0,p.life);
        const gr=ctx.createRadialGradient(rx+p.x,baseY-30+p.y,0,rx+p.x,baseY-30+p.y,p.r);
        gr.addColorStop(0,'rgba(255,255,240,1)'); gr.addColorStop(0.4,'rgba(255,180,70,.95)'); gr.addColorStop(1,'rgba(255,90,20,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(rx+p.x,baseY-30+p.y,p.r,0,7); ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }

  function drawHud(){
    const t=T[lang];
    hudEl.innerHTML =
      `<div><span class="k">T+</span> <b>${missionT.toFixed(0)}</b> s</div>`+
      `<div><span class="k">${lang==='zh'?'高度':'ALT'}</span> <b>${(h/1000).toFixed(1)}</b> km</div>`+
      `<div><span class="k">${lang==='zh'?'速度':'VEL'}</span> <b>${Math.round(v)}</b> m/s</div>`;
  }

  // ---------- panel (Q meter + throttle) ----------
  function updatePanel(){
    const kpa=Q/1000;
    qval.textContent=kpa.toFixed(0);
    qfill.style.width=Math.min(100,Q/Q_MAX*100)+'%';
    qfill.className='mfill '+(Q>=Q_RED?'bad':Q>Q_RED*0.8?'':'blue');
    thrval.textContent=thr.value;
    if(state==='flying' && Q>2000) analogyEl.innerHTML=T[lang].analogyFly(Q);
  }

  function positionZone(){
    // fixed red danger band: from Q_RED up to full scale
    const left=Q_RED/Q_MAX*100;
    qzone.style.left=left+'%'; qzone.style.width=(100-left)+'%';
  }

  // ---------- verdict / badge ----------
  function showVerdict(vd,cls){
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }
  function renderBadge(){
    const earned = winStored || (()=>{try{return localStorage.getItem('mg.badge.maxq')==='1';}catch(e){return false;}})();
    winStored = winStored || earned;
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  // ---------- static text / language ----------
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.getElementById('qlbl').textContent=t.qlbl;
    document.getElementById('thrlbl').textContent=t.thrlbl;
    fireBtn.textContent = state==='flying'? t.flying : t.fire;
    retryBtn.textContent=t.retry;
    if(state==='idle' || Q<2000) analogyEl.innerHTML=t.analogyIdle;
    document.documentElement.lang=lang;
    // re-render current callout & verdict in new language
    if(curCallout){ const k=curCallout; curCallout=null; setCallout(k); }
    renderBadge();
    drawHud();
  }

  // ---------- events ----------
  thr.addEventListener('input',()=>{ thrval.textContent=thr.value; });
  fireBtn.addEventListener('click',launch);
  retryBtn.addEventListener('click',reset);
  document.getElementById('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh'; renderStatic();
  });
  window.addEventListener('resize',()=>{ resize(); positionZone(); });

  // ---------- init ----------
  positionZone();
  renderStatic();
  reset();
  resize();
})();
</script>
</body>
</html>
