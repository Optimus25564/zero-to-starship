<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>生命保障配平 · Life Support</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific bits common.css doesn't cover */
  .facts{font-size:12px;color:var(--muted);line-height:1.6;margin:2px 0 12px;
         background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .facts b{color:var(--flame2)}
  .remrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
  .remrow .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--flame2)}
  .remrow .big.zero{color:var(--ok)}
  .remrow .big.over{color:var(--bad)}
  .remrow .lbl{font-size:12px;color:var(--muted)}
  .sliderrow label .need{color:var(--muted);font-weight:400;font-size:11px}
  .sliderrow label b.short{color:var(--bad)}
  .sliderrow label b.ok{color:var(--ok)}
  .icon{display:inline-block;width:1.3em;text-align:center}
  .qtitle{font-size:15px;line-height:1.5;margin:0 0 4px}
  .qtitle b{color:var(--flame2)}
  .qsub{font-size:12px;color:var(--muted);margin:0 0 12px}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">生命保障配平</h1><span class="en" id="titleEn">Life Support</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="facts" id="facts"></div>

    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="budLabel"></span><span id="budNums"></span></div>
        <div class="mbar"><div class="mfill blue" id="budFill"></div></div>
      </div>
    </div>

    <div class="remrow">
      <span class="lbl" id="remLbl"></span>
      <span><span class="big" id="remVal">0</span> <span class="unit muted">kg</span></span>
    </div>

    <div id="sliders"></div>

    <div class="buttons">
      <button class="fire" id="goBtn">出发！</button>
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <div class="panel">
    <p class="qtitle" id="quizQ"></p>
    <p class="qsub" id="quizSub"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="quizFb"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ============ mission constants (real per-person figures) ============
  const CAP   = 200;   // kg — total mass budget for this cargo run
  const CREW  = 2;     // astronauts
  const DAYS  = 5;     // mission length
  const STEP  = 5;     // slider granularity (kg)
  // per person per day (plausible NASA-ish short-mission figures)
  const PP = { o2:0.8, water:3, food:1.5 };
  // battery: life-support hardware (fans, CO2 scrubber, water pump) draws power
  const BATT_PER_DAY = 8;               // kg of battery consumed per day
  const SCI_WIN = 20;                   // kg of science needed for a "real" mission

  // per-day burn for the whole crew, and 5-day need
  const RES = [
    { key:'o2',    icon:'🫧', rate:+(PP.o2  *CREW).toFixed(1), col:'#7fd0ff' },
    { key:'water', icon:'💧', rate:+(PP.water*CREW).toFixed(1), col:'#4aa3ff' },
    { key:'food',  icon:'🍎', rate:+(PP.food *CREW).toFixed(1), col:'#57d38c' },
    { key:'batt',  icon:'🔋', rate:BATT_PER_DAY,               col:'#ffcf5a' },
    { key:'sci',   icon:'🔬', rate:0,                          col:'#c58cff' }
  ];
  RES.forEach(r => r.need = r.rate * DAYS);   // sci.need = 0

  // ============ i18n ============
  const T = {
    zh: {
      title:'生命保障配平', titleEn:'Life Support', lang:'EN', back:'← 目录',
      hook:'马斯克：至今你运的都是卫星——它们<b>不用呼吸</b>。装人了，一切都变了。你有 <b>200kg</b> 载重上限，5 天飞行，2 名宇航员。氧气、水、食物、电池、科学器材——全靠你分配。少一样，人就回不来。',
      facts:'每人每天要：<b>氧气 0.8kg</b> · <b>水 3kg</b> · <b>食物 1.5kg</b>。乘组 <b>2 人 × 5 天</b>（自己算算各要多少）。生命保障系统还得靠电池供电，5 天要 <b>≥40kg</b> 电池。',
      budLabel:'载重预算', budNums:(u)=>`${u} / ${CAP} kg`,
      remLblLeft:'还能装', remLblZero:'预算刚好用完 ✓ 可以出发', remLblOver:'超预算了！',
      go:'出发！', reset:'重来',
      goHintLeft:(r)=>`还有 ${r}kg 没分配，用完预算才能出发`,
      goHintOver:(r)=>`超了 ${r}kg，先减一点`,
      names:{o2:'氧气', water:'水', food:'食物', batt:'备用电池', sci:'科学实验器材'},
      needTxt:(n)=>`5 天需 ≥ ${n}kg`,
      dayLabel:(d)=>`第 ${d} 天`, launching:'发射…', arrived:'抵达空间站',
      // verdicts
      failMsg:{
        o2:(d,a,n)=>({tag:`第 ${d} 天 · 氧气耗尽`, t:`舱里没氧气了，谁也没法呼吸——任务中止。你只装了 <b>${a}kg</b>，5 天要 <b>${n}kg</b>。<small>卫星不用呼吸，人可不行。炸了？又一份数据。</small>`}),
        water:(d,a,n)=>({tag:`第 ${d} 天 · 水喝光了`, t:`没水了。不吃能撑几天，没水撑不住——返航。装了 <b>${a}kg</b>，需要 <b>${n}kg</b>。<small>人体七成是水。炸了？又一份数据。</small>`}),
        food:(d,a,n)=>({tag:`第 ${d} 天 · 食物见底`, t:`饭吃完了，饿着肚子干不了活——提前返航。装了 <b>${a}kg</b>，需要 <b>${n}kg</b>。<small>发动机没燃料会熄火，人没饭也一样。炸了？又一份数据。</small>`}),
        batt:(d,a,n)=>({tag:`第 ${d} 天 · 电池没电`, t:`电池耗尽——风扇、二氧化碳过滤、水泵全停了，生命保障系统关机。装了 <b>${a}kg</b>，需要 <b>${n}kg</b>。<small>电，是让人活着的隐形空气。炸了？又一份数据。</small>`})
      },
      halfMsg:(s)=>({tag:'安全抵达，但…', t:`5 天全员平安！可是科学器材只带了 <b>${s}kg</b>，几乎没做实验。地面科学家问：<b>你们上去干嘛了？</b><small>活着是及格线，不是目标。载人飞行是为了做别人做不到的事。</small>`}),
      winMsg:(s)=>({tag:'任务成功 🎉', t:`5 天全员平安，还带了 <b>${s}kg</b> 科学器材做了真实验——这才是一次有价值的载人任务！<small>你既让人活着回来，又带回了数据。这就是配平的意义。</small>`}),
      badgeLocked:'徽章未解锁：让 2 名宇航员平安飞完 5 天，并带足科学器材，即可获得「生命守护者」。',
      badgeEarned:'已获得徽章「生命守护者」——你懂了：装人，就要为每一次呼吸负责。',
      quizQ:'龙飞船有 <b>4 顶</b>主降落伞，其实 <b>2 顶</b>就够减速。为什么还要装 4 顶？',
      quizSub:'（这题和活着回来有关，想清楚再选）',
      choices:[
        {k:'A', txt:'4 顶降得更快，落得更稳', cls:'wrong'},
        {k:'B', txt:'假设任何一顶都可能坏——就算坏掉 2 顶，剩下 2 顶也够安全落地。这叫冗余', cls:'correct'},
        {k:'C', txt:'4 顶对称，好看', cls:'wrong'}
      ],
      fbCorrect:'对！这叫 <b>冗余</b>：多备几份，坏一个也不出事。降落伞、电脑、氧气瓶都这么设计——因为装了人，不能赌运气。',
      fbWrongA:'不是为了更快——伞多了不会更快，反而要更早开。真正的原因：坏了也不怕。再选选。',
      fbWrongC:'好看排最后。真正的原因：坏了也不怕。这叫冗余——再选一次。'
    },
    en: {
      title:'Life Support', titleEn:'生命保障配平', lang:'中', back:'← Menu',
      hook:"Musk: so far you've shipped satellites — they <b>don't breathe</b>. Put people aboard and everything changes. You get a <b>200 kg</b> mass budget, a 5-day flight, 2 astronauts. Oxygen, water, food, battery, science gear — you divide it up. Miss one, they don't come home.",
      facts:'Per person per day: <b>oxygen 0.8 kg</b> · <b>water 3 kg</b> · <b>food 1.5 kg</b>. Crew of <b>2 × 5 days</b> (work out how much of each). Life support also runs on battery — you need <b>≥40 kg</b> for 5 days.',
      budLabel:'Mass budget', budNums:(u)=>`${u} / ${CAP} kg`,
      remLblLeft:'Left to pack', remLblZero:'Budget used up exactly ✓ ready to launch', remLblOver:'Over budget!',
      go:'GO!', reset:'Reset',
      goHintLeft:(r)=>`${r} kg still unassigned — use the whole budget to launch`,
      goHintOver:(r)=>`${r} kg over — trim something first`,
      names:{o2:'Oxygen', water:'Water', food:'Food', batt:'Backup battery', sci:'Science gear'},
      needTxt:(n)=>`5 days need ≥ ${n} kg`,
      dayLabel:(d)=>`Day ${d}`, launching:'Launch…', arrived:'Docked at station',
      failMsg:{
        o2:(d,a,n)=>({tag:`Day ${d} · Oxygen out`, t:`No oxygen left in the cabin — nobody can breathe. Mission aborted. You packed <b>${a} kg</b>; 5 days needs <b>${n} kg</b>.<small>Satellites don't breathe. People do. Boom? Another data point.</small>`}),
        water:(d,a,n)=>({tag:`Day ${d} · Water gone`, t:`Out of water. You can last days without food, not without water — turning back. Packed <b>${a} kg</b>, needed <b>${n} kg</b>.<small>Bodies are ~70% water. Boom? Another data point.</small>`}),
        food:(d,a,n)=>({tag:`Day ${d} · Food ran out`, t:`Food's gone; you can't work hungry — early return. Packed <b>${a} kg</b>, needed <b>${n} kg</b>.<small>An engine with no fuel cuts out; so do people. Boom? Another data point.</small>`}),
        batt:(d,a,n)=>({tag:`Day ${d} · Battery dead`, t:`Battery drained — fans, CO₂ scrubber and water pump all stopped. Life support shut down. Packed <b>${a} kg</b>, needed <b>${n} kg</b>.<small>Power is the invisible air that keeps people alive. Boom? Another data point.</small>`})
      },
      halfMsg:(s)=>({tag:'Home safe, but…', t:`All 2 alive after 5 days! But you only brought <b>${s} kg</b> of science gear — almost no experiments. Ground scientists ask: <b>so what did you go up there for?</b><small>Staying alive is the pass mark, not the goal. Crewed flight is for doing what nobody else can.</small>`}),
      winMsg:(s)=>({tag:'Mission success 🎉', t:`All 2 home safe after 5 days AND <b>${s} kg</b> of real science done — that's a crewed mission worth flying!<small>You kept people alive and brought back data. That's what balancing is for.</small>`}),
      badgeLocked:'Badge locked: bring both astronauts home safe after 5 days with enough science gear to earn "Life Guardian".',
      badgeEarned:'Badge earned: "Life Guardian" — you get it now: put people aboard and you answer for every breath.',
      quizQ:'Dragon has <b>4</b> main parachutes, but <b>2</b> are enough to slow it down. Why fit 4?',
      quizSub:'(This one is about coming home alive — think first.)',
      choices:[
        {k:'A', txt:'4 chutes make it fall faster and steadier', cls:'wrong'},
        {k:'B', txt:'Assume any chute can fail — even if 2 fail, the other 2 still land safely. This is redundancy', cls:'correct'},
        {k:'C', txt:'4 look nice and symmetric', cls:'wrong'}
      ],
      fbCorrect:'Yes! This is <b>redundancy</b>: keep spares so one failure isn\'t a disaster. Chutes, computers, oxygen tanks are all built this way — with people aboard you can\'t gamble.',
      fbWrongA:"Not for speed — more chutes don't fall faster, they open earlier. The real reason: a failure won't doom you. Try again.",
      fbWrongC:'Looks come last. The real reason: a failure won\'t doom you. That\'s redundancy — try again.'
    }
  };
  let lang = 'zh';

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const budFill = $('budFill'), budLabel = $('budLabel'), budNums = $('budNums');
  const remVal = $('remVal'), remLbl = $('remLbl');
  const slidersEl = $('sliders'), goBtn = $('goBtn'), resetBtn = $('resetBtn');
  const verdictEl = $('verdict'), badgeEl = $('badge'), badgeText = $('badgeText');
  const choicesEl = $('choices'), quizFb = $('quizFb');

  // ============ allocation state ============
  const alloc = { o2:0, water:0, food:0, batt:0, sci:0 };
  const sliderInputs = {};
  const valLabels = {};

  function total(){ return RES.reduce((s,r)=>s+alloc[r.key], 0); }

  function buildSliders(){
    slidersEl.innerHTML = '';
    RES.forEach(r=>{
      const row = document.createElement('div'); row.className='sliderrow';
      const label = document.createElement('label');
      const left = document.createElement('span');
      left.innerHTML = `<span class="icon">${r.icon}</span> <span data-nm="${r.key}"></span> `+
                       (r.need>0 ? `<span class="need" data-need="${r.key}"></span>` : '');
      const right = document.createElement('b'); right.dataset.val=r.key; right.textContent='0 kg';
      label.appendChild(left); label.appendChild(right);
      const wrap = document.createElement('div'); wrap.className='sliderwrap'; wrap.style.paddingBottom='10px';
      const inp = document.createElement('input');
      inp.type='range'; inp.min='0'; inp.max=String(CAP); inp.step=String(STEP); inp.value='0';
      inp.dataset.key=r.key;
      wrap.appendChild(inp);
      row.appendChild(label); row.appendChild(wrap);
      slidersEl.appendChild(row);
      sliderInputs[r.key]=inp; valLabels[r.key]=right;
      inp.addEventListener('input', ()=>onSlide(r.key, inp));
    });
  }

  function onSlide(key, inp){
    let v = +inp.value;
    // honest constraint: total may never exceed CAP — clamp this slider to remaining
    const others = total() - alloc[key];
    const maxAllowed = CAP - others;
    if (v > maxAllowed){ v = maxAllowed - (maxAllowed % STEP); if(v<0) v=0; inp.value=String(v); }
    alloc[key] = v;
    renderAlloc();
  }

  function renderAlloc(){
    const t = T[lang];
    const used = total(); const rem = CAP - used;
    // budget meter
    budFill.style.width = Math.min(100, used/CAP*100) + '%';
    budFill.className = 'mfill ' + (rem===0 ? 'ok' : 'blue');
    budNums.textContent = t.budNums(used);
    // remaining
    remVal.textContent = rem;
    remVal.className = 'big' + (rem===0 ? ' zero' : (rem<0 ? ' over' : ''));
    remLbl.textContent = rem===0 ? t.remLblZero : (rem<0 ? t.remLblOver : t.remLblLeft);
    // per-slider value + short/ok coloring
    RES.forEach(r=>{
      const b = valLabels[r.key]; b.textContent = alloc[r.key] + ' kg';
      if(r.need>0){
        b.className = alloc[r.key] < r.need ? 'short' : 'ok';
      } else { b.className=''; }
    });
    // GO gating
    goBtn.disabled = (rem !== 0) || simRunning;
    goBtn.textContent = rem===0 ? t.go : (rem<0 ? t.goHintOver(-rem) : t.goHintLeft(rem));
  }

  // ============ simulation (real per-day arithmetic) ============
  function runMission(){
    // for each consumable: days it lasts = floor(alloc/rate); survives if alloc>=need
    const status = {};   // key -> {lastOkDay, failDay|null}
    let earliestFail = null; // {key, day}
    const order = ['o2','water','food','batt'];
    order.forEach(k=>{
      const r = RES.find(x=>x.key===k);
      if(alloc[k] >= r.need){ status[k] = {lastOkDay:DAYS, failDay:null}; }
      else {
        const lastOk = Math.floor(alloc[k] / r.rate); // whole days it survives
        const failDay = lastOk + 1;
        status[k] = {lastOkDay:lastOk, failDay};
        if(!earliestFail || failDay < earliestFail.day ||
           (failDay === earliestFail.day && order.indexOf(k) < order.indexOf(earliestFail.key))){
          earliestFail = {key:k, day:failDay};
        }
      }
    });
    const survived = !earliestFail;
    const sci = alloc.sci;
    let ending;
    if(!survived) ending = 'fail';
    else ending = (sci >= SCI_WIN) ? 'win' : 'half';
    return { status, earliestFail, survived, sci, ending };
  }

  // ============ canvas / animation ============
  let W=0,H=0,dpr=1; const stars=[];
  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){
      for(let i=0;i<120;i++) stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.2, a:Math.random()*0.6+0.2});
    }
    draw();
  }

  // anim state
  let simRunning=false;
  let anim=null;   // {res, t0, dayFloat, done, aborted, shake, puff}
  const DAY_MS = 900; // ~0.9s per day → up to 4.5s

  function lightColor(key, day, res){
    const r = RES.find(x=>x.key===key);
    if(r.rate===0) return null; // sci has no light
    const st = res.status[key];
    if(day < st.failDay || st.failDay===null){
      if(st.failDay!==null && day===st.lastOkDay) return '#ffcf5a'; // last ok day → warn yellow
      return '#57d38c';
    }
    return '#ff5a5a'; // out
  }

  function drawCapsule(x, y, shake){
    ctx.save();
    ctx.translate(x + (shake?(Math.random()-0.5)*shake:0), y + (shake?(Math.random()-0.5)*shake:0));
    // thruster glow
    const g = ctx.createLinearGradient(-46,0,-16,0);
    g.addColorStop(0,'rgba(255,140,66,0)'); g.addColorStop(1,'rgba(255,180,90,.85)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-16,-7); ctx.lineTo(-44,0); ctx.lineTo(-16,7); ctx.closePath(); ctx.fill();
    // body (Dragon-ish trapezoid, nose right)
    ctx.fillStyle='#dfe6ef';
    ctx.beginPath();
    ctx.moveTo(-16,-15); ctx.lineTo(10,-13); ctx.quadraticCurveTo(24,0,10,13);
    ctx.lineTo(-16,15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#9aa6b8'; ctx.lineWidth=1.5; ctx.stroke();
    // window
    ctx.fillStyle='#2f6fb0'; ctx.beginPath(); ctx.arc(2,0,4.5,0,7); ctx.fill();
    ctx.strokeStyle='#bcd6f5'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }

  function drawStation(x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#c7ccd3';
    ctx.fillRect(-6,-4,12,8);              // core
    ctx.fillStyle='#2f6fb0';
    ctx.fillRect(-26,-3,16,6); ctx.fillRect(10,-3,16,6);  // panels
    ctx.strokeStyle='#6f7a8c'; ctx.lineWidth=1;
    ctx.strokeRect(-26,-3,16,6); ctx.strokeRect(10,-3,16,6);
    ctx.restore();
  }

  function drawLights(res, day){
    const keys = ['o2','water','food','batt'];
    const n = keys.length; const gap = 58; const startX = W/2 - (n-1)*gap/2;
    const y = H - 30;
    ctx.textAlign='center';
    keys.forEach((k,i)=>{
      const x = startX + i*gap;
      const col = lightColor(k, day, res) || '#3a4356';
      ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=10;
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x, y-14, 8, 0, 7); ctx.fill();
      ctx.restore();
      const r = RES.find(x=>x.key===k);
      ctx.font='14px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(r.icon, x, y-9);
      ctx.font='11px sans-serif'; ctx.fillStyle='#8ba0b4';
      ctx.fillText(T[lang].names[k].slice(0, lang==='zh'?4:6), x, y+8);
    });
  }

  function drawScene(day, phase){
    // phase: 'idle' | number(0..1 progress within flight) | 'end'
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    if(!anim){
      // idle: capsule waiting on left, station on right
      drawStation(W-40, H*0.42);
      drawCapsule(60, H*0.42, 0);
      ctx.textAlign='center'; ctx.fillStyle='#8ba0b4'; ctx.font='13px sans-serif';
      ctx.fillText(lang==='zh'?'配平载重 → 出发':'Balance the load → GO', W/2, H*0.42-40);
      return;
    }

    const res = anim.res;
    const prog = anim.prog;              // 0..1 across whole shown flight
    const cx = 60 + prog*(W-140);
    drawStation(W-40, H*0.42);

    // big day counter
    ctx.textAlign='center';
    ctx.font='bold 30px sans-serif';
    ctx.fillStyle = anim.aborted ? '#ff9b9b' : '#ffd27f';
    ctx.fillText(T[lang].dayLabel(anim.aborted ? anim.abortDay : Math.min(DAYS, anim.dayShown)), W/2, 46);

    if(anim.aborted && anim.puff>0){
      // cartoon puff at capsule
      const pr = anim.puff*40;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-anim.puff);
      const pg = ctx.createRadialGradient(cx,H*0.42,2,cx,H*0.42,pr);
      pg.addColorStop(0,'#fff'); pg.addColorStop(.4,'#ffb347'); pg.addColorStop(1,'rgba(255,90,42,0)');
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(cx,H*0.42,pr,0,7); ctx.fill(); ctx.restore();
    }
    drawCapsule(cx, H*0.42, anim.aborted ? anim.shake : 0);

    if(anim.win){
      // science sparkles at station
      for(let i=0;i<6;i++){ const a=Date.now()/300+i;
        ctx.globalAlpha=0.5+0.5*Math.sin(a);
        ctx.fillStyle='#c58cff'; ctx.beginPath();
        ctx.arc(W-40+Math.cos(a)*20, H*0.42+Math.sin(a)*16, 2, 0,7); ctx.fill(); }
      ctx.globalAlpha=1;
    }
    drawLights(res, anim.aborted ? anim.abortDay : Math.min(DAYS, anim.dayShown));
  }

  function draw(){ drawScene(); }

  function startMission(){
    if(simRunning) return;
    const res = runMission();
    simRunning = true; goBtn.disabled=true; resetBtn.disabled=true;
    hideVerdict();
    const finalDay = res.survived ? DAYS : res.earliestFail.day;
    anim = { res, prog:0, dayShown:1, aborted:false, abortDay:finalDay,
             shake:0, puff:0, win:false, t0:performance.now(), finalDay };
    requestAnimationFrame(tick);
  }

  function tick(now){
    if(!anim){ return; }
    const res = anim.res;
    const elapsed = now - anim.t0;
    const totalMs = anim.finalDay * DAY_MS;
    let p = Math.min(1, elapsed/totalMs);
    anim.prog = p;
    anim.dayShown = Math.min(anim.finalDay, 1 + Math.floor(elapsed/DAY_MS));

    if(!res.survived && anim.dayShown >= res.earliestFail.day && !anim.aborted){
      anim.aborted = true; anim.abortDay = res.earliestFail.day;
      anim.shake = 5; anim.puff = 0.001; anim.prog = (res.earliestFail.day-0.5)/res.earliestFail.day;
    }
    if(anim.aborted){ anim.puff = Math.min(1, anim.puff + 0.045); anim.shake = Math.max(0, 5*(1-anim.puff)); }

    drawScene();

    const finished = anim.aborted ? anim.puff>=1 : p>=1;
    if(!finished){ requestAnimationFrame(tick); }
    else { finishMission(res); }
  }

  function finishMission(res){
    if(res.survived && res.ending==='win'){ anim.win=true; }
    // hold last frame; keep animating sparkles if win
    if(anim && anim.win){
      const keep = ()=>{ if(anim && anim.win){ drawScene(); requestAnimationFrame(keep); } };
      requestAnimationFrame(keep);
    } else { drawScene(); }
    simRunning=false; resetBtn.disabled=false; renderAlloc();
    showVerdict(res);
    if(res.ending==='win'){
      try{ localStorage.setItem('mg.badge.life-support','1'); }catch(e){}
      renderBadge();
    }
  }

  // ============ verdict ============
  function showVerdict(res){
    const t=T[lang]; let vd, cls;
    if(res.ending==='fail'){
      const k = res.earliestFail.key; const r = RES.find(x=>x.key===k);
      vd = t.failMsg[k](res.earliestFail.day, alloc[k], r.need); cls='bad';
    } else if(res.ending==='half'){
      vd = t.halfMsg(res.sci); cls='half';
    } else {
      vd = t.winMsg(res.sci); cls='ok';
    }
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML = `<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ============ reset ============
  function reset(){
    if(simRunning) return;
    RES.forEach(r=>{ alloc[r.key]=0; sliderInputs[r.key].value='0'; });
    anim=null; hideVerdict(); renderAlloc(); draw();
  }

  // ============ quiz ============
  let quizDone=false;
  function buildQuiz(){
    choicesEl.innerHTML=''; quizFb.textContent='';
    T[lang].choices.forEach((c,i)=>{
      const btn=document.createElement('button'); btn.className='choice'; btn.type='button';
      btn.innerHTML=`<span class="key">${c.k}</span><span data-ct="${i}">${c.txt}</span>`;
      btn.addEventListener('click', ()=>answerQuiz(i, btn));
      choicesEl.appendChild(btn);
    });
  }
  function answerQuiz(i, btn){
    const c = T[lang].choices[i];
    if(c.cls==='correct'){
      quizDone=true;
      [...choicesEl.children].forEach((el,j)=>{
        el.classList.remove('wrong','dim');
        if(T[lang].choices[j].cls==='correct') el.classList.add('correct');
        else el.classList.add('dim');
        el.disabled=true;
      });
      quizFb.innerHTML = T[lang].fbCorrect;
    } else {
      btn.classList.add('wrong');
      quizFb.innerHTML = c.k==='A' ? T[lang].fbWrongA : T[lang].fbWrongC;
    }
  }

  // ============ badge ============
  function badgeEarned(){ try{ return localStorage.getItem('mg.badge.life-support')==='1'; }catch(e){ return false; } }
  function renderBadge(){
    const earned = badgeEarned();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  // ============ static text ============
  function renderStatic(){
    const t=T[lang];
    $('title').textContent = t.title;
    $('titleEn').textContent = t.titleEn;
    $('langBtn').textContent = t.lang;
    $('back').textContent = t.back;
    $('hook').innerHTML = t.hook;
    $('facts').innerHTML = t.facts;
    budLabel.textContent = t.budLabel;
    resetBtn.textContent = t.reset;
    $('quizQ').innerHTML = t.quizQ;
    $('quizSub').textContent = t.quizSub;
    // slider names + need hints
    RES.forEach(r=>{
      const nm = slidersEl.querySelector(`[data-nm="${r.key}"]`); if(nm) nm.textContent=t.names[r.key];
      if(r.need>0){ const nd = slidersEl.querySelector(`[data-need="${r.key}"]`); if(nd) nd.textContent=t.needTxt(r.need); }
    });
    document.documentElement.lang = lang;
  }

  // ============ events ============
  goBtn.addEventListener('click', startMission);
  resetBtn.addEventListener('click', reset);
  $('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic(); renderAlloc(); renderBadge(); buildQuiz(); draw();
  });
  window.addEventListener('resize', resize);

  // ============ init ============
  buildSliders();
  buildQuiz();
  renderStatic();
  renderAlloc();
  renderBadge();
  resize();
})();
</script>
</body>
</html>
