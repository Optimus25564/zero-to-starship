<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>太空曲棍球 · Space Hockey</title>
<link rel="stylesheet" href="../common.css">
<style>
  .dpad{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:8px; max-width:260px; margin:0 auto}
  .dpad button{min-width:0; padding:16px 0; font-size:22px}
  .dpad .lbl{display:grid; place-items:center; font-size:11px; color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">太空曲棍球</h1><span class="en" id="titleEn">Space Hockey</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="spd">0.0</span><span class="unit">px/s</span>
      <span class="chip" id="fuelChip">⛽ 12</span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="fuelLbl">燃料 Fuel</span><span id="fuelVal">12 / 12</span></div>
        <div class="mbar"><div class="mfill" id="fuelFill" style="width:100%"></div></div>
      </div>
    </div>

    <div class="dpad">
      <div class="lbl"></div><button data-d="up" id="btnUp">↑</button><div class="lbl"></div>
      <button data-d="left" id="btnLeft">←</button>
      <div class="lbl" id="thrustLbl">推</div>
      <button data-d="right" id="btnRight">→</button>
      <div class="lbl"></div><button data-d="down" id="btnDown">↓</button><div class="lbl"></div>
    </div>
    <div class="buttons" style="margin-top:12px">
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  const T={
    zh:{
      title:'太空曲棍球', titleEn:'Space Hockey', lang:'EN', back:'← 目录',
      hook:'马斯克：太空没有摩擦。喷一下，货箱就<b>永远</b>滑下去。想停？想拐弯？只能往<b>反方向再喷一下</b>——刹车也烧燃料。用方向键把货箱送进对面的绿色球门。',
      analogy:(fuel)=>`每喷一下用 1 格燃料，货箱速度<b>永远不会自己减</b>。还剩 <b>${fuel}</b> 次机会。想停就往反方向喷。`,
      fuelLbl:'燃料 Fuel', thrust:'推', reset:'重来',
      badgeLocked:'徽章未解锁：让货箱穿过绿色球门，即可获得「惯性驾驶员」。',
      badgeEarned:'已获得徽章「惯性驾驶员」——太空里喷一下就永远滑，刹车得自己往反方向喷。',
      win:{tag:'进门！🥅', t:'干净利落！你靠喷气加速，又靠<b>反方向喷气</b>刹住、对准，穿过了球门。<small> 太空里没有摩擦帮你停——每一次减速、拐弯都要烧燃料。</small>'},
      crash:{tag:'撞墙了', t:'货箱一头撞在墙上！你忘了——太空里它<b>不会自己停</b>。<b>又一份数据。</b><small> 早点往反方向喷一下就能刹住。</small>'},
      over:{tag:'冲过头了', t:'冲过头了！太空里<b>没有刹车</b>，除非你自己喷。<b>又一份数据。</b><small> 下次到门口前先往反方向点一下减速。</small>'},
      empty:{tag:'没油了', t:'燃料用光，货箱还在飘……你刹不住也拐不了了。<b>又一份数据。</b><small> 每一次喷气都珍贵——省着点，够用就好。</small>'}
    },
    en:{
      title:'Space Hockey', titleEn:'太空曲棍球', lang:'中', back:'← Menu',
      hook:'Musk: space has no friction. One puff and the cargo box drifts <b>forever</b>. Want to stop or turn? You must <b>puff the other way</b> — braking burns fuel too. Steer the box into the green goal across the rink.',
      analogy:(fuel)=>`Each puff costs 1 fuel, and the box <b>never slows on its own</b>. <b>${fuel}</b> puffs left. To stop, thrust the opposite way.`,
      fuelLbl:'Fuel', thrust:'push', reset:'Reset',
      badgeLocked:'Badge locked: send the box through the green goal to earn "Inertia Driver".',
      badgeEarned:'Badge earned: "Inertia Driver" — one puff drifts forever; to brake you thrust the other way.',
      win:{tag:'Goal! 🥅', t:'Clean run! You sped up with puffs, then <b>puffed backward</b> to slow and line up, and slid through.<small> No friction to stop you — every slow-down and turn burns fuel.</small>'},
      crash:{tag:'Hit the wall', t:'The box slammed into the wall! You forgot — in space it <b>won\'t stop by itself</b>. <b>Another data point.</b><small> A backward puff earlier would\'ve braked it.</small>'},
      over:{tag:'Overshot', t:'Overshot! In space there are <b>no brakes</b> unless you make them. <b>Another data point.</b><small> Tap the opposite way before the goal next time.</small>'},
      empty:{tag:'Out of fuel', t:'Fuel gone and the box is still drifting… you can\'t brake or turn. <b>Another data point.</b><small> Every puff is precious — spend only what you need.</small>'}
    }
  };
  let lang='zh';

  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const verdictEl=document.getElementById('verdict');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');
  const spdEl=document.getElementById('spd'), fuelChip=document.getElementById('fuelChip');
  const analogyEl=document.getElementById('analogy');
  const fuelFill=document.getElementById('fuelFill'), fuelVal=document.getElementById('fuelVal');
  const resetBtn=document.getElementById('resetBtn');
  const dBtns={up:document.getElementById('btnUp'),down:document.getElementById('btnDown'),left:document.getElementById('btnLeft'),right:document.getElementById('btnRight')};

  const FUEL0=12, IMPULSE=55, BOX=22;
  let W=0,H=0,dpr=1; const stars=[];
  // gate on right wall
  let gateY0=0,gateY1=0;

  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<60;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+0.2,a:Math.random()*0.5+0.15}); }
    gateY0=H*0.38; gateY1=H*0.62;
    draw();
  }

  // ---------- state ----------
  let x=0,y=0,vx=0,vy=0,fuel=FUEL0,outcome=null,running=false,trail=[],puffs=[];
  const M=20; // box "mass" (kg) — shown for flavour; impulse gives deltaV = IMPULSE/M
  function reset(){
    x=W*0.16; y=H*0.5; vx=0; vy=0; fuel=FUEL0; outcome=null; trail=[]; puffs=[];
    for(const k in dBtns) dBtns[k].disabled=false;
    if(!running){ running=true; requestAnimationFrame(loop); }
    hideVerdict(); renderReadout(); draw();
  }

  const dir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  function thrust(d){
    if(outcome||fuel<=0) return;
    const [dx,dy]=dir[d];
    vx += dx*IMPULSE; vy += dy*IMPULSE;   // real impulse: velocity persists exactly
    fuel--;
    // exhaust puff opposite the thrust
    for(let i=0;i<8;i++) puffs.push({x:x-dx*BOX, y:y-dy*BOX, vx:-dx*120+(Math.random()-0.5)*60, vy:-dy*120+(Math.random()-0.5)*60, life:1});
    renderReadout();
  }

  let lastT=0;
  function loop(now){
    if(!lastT) lastT=now;
    const dt=Math.min(0.03,(now-lastT)/1000); lastT=now;
    if(!outcome){
      x+=vx*dt; y+=vy*dt;                  // frictionless — velocity unchanged
      trail.push({x,y}); if(trail.length>60) trail.shift();
      for(const p of puffs){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.8; }
      puffs=puffs.filter(p=>p.life>0);
      // gate: pass through right edge within gate band
      if(x+BOX/2>=W-6){
        if(y>gateY0 && y<gateY1) settle('win');
        else settle('over');
      }
      // walls (non-gate) => crash
      else if(x-BOX/2<=4 || y-BOX/2<=4 || y+BOX/2>=H-4) settle('crash');
      // drifting with no fuel and no way to reach — declare empty if basically stopped or drifting away
      else if(fuel<=0 && Math.hypot(vx,vy)<3) settle('empty');
    }
    draw();
    if(running) requestAnimationFrame(loop);
  }

  function settle(o){
    outcome=o;
    for(const k in dBtns) dBtns[k].disabled=true;
    if(o==='win'){ try{ localStorage.setItem('mg.badge.space-hockey','1'); }catch(e){} }
    draw(); showVerdict(o); renderBadge();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#cfe0ff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // rink walls
    ctx.strokeStyle='#26304a'; ctx.lineWidth=4; ctx.strokeRect(6,6,W-12,H-12);
    // goal on right wall (gap) — green posts
    ctx.strokeStyle='#0a1a2e'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(W-6,gateY0); ctx.lineTo(W-6,gateY1); ctx.stroke();
    ctx.strokeStyle='#57d38c'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(W-14,gateY0); ctx.lineTo(W-6,gateY0); ctx.moveTo(W-14,gateY1); ctx.lineTo(W-6,gateY1); ctx.stroke();
    ctx.fillStyle='rgba(87,211,140,.12)'; ctx.fillRect(W-30,gateY0,24,gateY1-gateY0);
    ctx.font='11px sans-serif'; ctx.fillStyle='#9fe6bf'; ctx.textAlign='center';
    ctx.save(); ctx.translate(W-20,(gateY0+gateY1)/2); ctx.rotate(Math.PI/2); ctx.fillText(lang==='zh'?'球门':'GOAL',0,0); ctx.restore();
    // trail
    if(trail.length>1){ ctx.strokeStyle='rgba(74,163,255,.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(trail[0].x,trail[0].y); for(const p of trail) ctx.lineTo(p.x,p.y); ctx.stroke(); }
    // puffs
    for(const p of puffs){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='#ffd27f'; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // cargo box
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle=outcome==='win'?'#57d38c':'#c7ccd3';
    ctx.strokeStyle='#2b303a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(-BOX/2,-BOX/2,BOX,BOX,4); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#8a929e'; ctx.beginPath(); ctx.moveTo(-BOX/2,-BOX/6); ctx.lineTo(BOX/2,-BOX/6); ctx.moveTo(0,-BOX/2); ctx.lineTo(0,BOX/2); ctx.stroke();
    ctx.restore();
    // velocity arrow
    const sp=Math.hypot(vx,vy);
    if(sp>2 && !outcome){
      const L=Math.min(50,sp*0.5); const ux=vx/sp,uy=vy/sp;
      ctx.strokeStyle='rgba(74,163,255,.9)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+ux*L,y+uy*L); ctx.stroke();
    }
  }

  function renderReadout(){
    spdEl.textContent=Math.hypot(vx,vy).toFixed(0);
    fuelChip.textContent='⛽ '+fuel;
    analogyEl.innerHTML=T[lang].analogy(fuel);
    fuelFill.style.width=(fuel/FUEL0*100)+'%';
    fuelFill.className='mfill '+(fuel<=3?'bad':'');
    fuelVal.textContent=fuel+' / '+FUEL0;
  }
  function showVerdict(o){
    const vd=T[lang][o]; const cls=o==='win'?'ok':'bad';
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }
  function renderBadge(){
    const earned=(()=>{ try{ return localStorage.getItem('mg.badge.space-hockey')==='1'; }catch(e){ return false; } })();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.getElementById('fuelLbl').textContent=t.fuelLbl;
    document.getElementById('thrustLbl').textContent=t.thrust;
    resetBtn.textContent=t.reset;
    document.documentElement.lang=lang;
  }

  for(const k in dBtns) dBtns[k].addEventListener('click',()=>thrust(k));
  resetBtn.addEventListener('click',reset);
  document.getElementById('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh'; renderStatic(); renderReadout(); if(outcome) showVerdict(outcome); renderBadge(); draw();
  });
  window.addEventListener('resize',resize);

  renderStatic(); renderBadge(); resize(); reset();
})();
</script>
</body>
</html>
