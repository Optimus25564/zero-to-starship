<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>燃料试验场 · Propellant Lab</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific only: segmented mode toggle + meter niceties common.css doesn't cover */
  .seg{display:flex; gap:10px; margin-bottom:12px}
  .seg button{font-size:15px}
  .rule{color:var(--muted); font-size:13px; line-height:1.5; margin:2px 0 12px; min-height:20px}
  .rule b{color:var(--ink); font-weight:600}
  .musk{font-size:13px; line-height:1.5; margin:12px 0 0; padding:8px 12px; border-radius:10px;
        border-left:3px solid var(--flame); background:rgba(255,140,66,.06); color:var(--muted)}
  .musk b{color:var(--flame2); font-weight:600}
  .meter .mlabel .dv{color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600}
  .swatch{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">燃料试验场</h1><span class="en" id="titleEn">Propellant Lab</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="seg buttons">
      <button class="fire"  id="modeMass">同样重量</button>
      <button class="ghost" id="modeVol">同样大小油箱</button>
    </div>
    <div class="rule" id="rule"></div>

    <div class="buttons">
      <button class="fire" id="raceBtn">🚀 发射！</button>
    </div>

    <div class="analogy" id="analogy" style="margin-top:12px"></div>
    <div class="meters" id="meters"></div>

    <div class="musk" id="musk"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  "use strict";
  const g = 9.81;

  // ---------- constants (verified numerically) ----------
  // Same-mass mode: identical mass ratio for all -> Isp decides -> LH2 wins.
  const RATIO_SAME = 3.5;
  // Same-volume mode: identical tank volume + identical dry mass ->
  //   propellant mass = bulk_density * V -> denser packs more -> Kerosene wins.
  const TANK_V = 1000;   // L (bulk propellant volume)
  const DRY    = 75;     // kg dry mass (same for every rocket)
  const SCALE_MAX = 10000; // m/s -> full canvas height
  const V_ORBIT   = 9400;  // m/s to LEO (kid reference)

  // bulk densities kg/L (LOX+fuel mixed), Isp in s
  const FUELS = [
    { id:'solid', Isp:250, rho:1.70, color:'#c7ccd3' },
    { id:'kero',  Isp:300, rho:1.03, color:'#ff8c42' },
    { id:'meth',  Isp:330, rho:0.42, color:'#4aa3ff' },
    { id:'lh2',   Isp:450, rho:0.36, color:'#57d38c' },
  ];

  function computeDv(mode){
    return FUELS.map(f => {
      let dv, ratio;
      if(mode === 'mass'){
        ratio = RATIO_SAME;
        dv = f.Isp * g * Math.log(ratio);
      } else {
        const m0 = DRY + f.rho * TANK_V, m1 = DRY;
        ratio = m0/m1;
        dv = f.Isp * g * Math.log(ratio);
      }
      return { ...f, dv, ratio };
    });
  }

  // ---------- i18n ----------
  const T = {
    zh: {
      title:'燃料试验场', titleEn:'Propellant Lab', lang:'EN', back:'← 目录',
      hook:'马斯克：燃料的灵魂是<b>喷气速度——比冲 Isp</b>。但高分燃料总有大麻烦。四枚一样的火箭，四种燃料，谁飞得最高？',
      modeMass:'同样重量', modeVol:'同样大小油箱',
      race:'🚀 发射！', racing:'点火中…',
      ruleMass:'规则：每枚火箭<b>装一样重</b>的燃料。比的就是纯比冲 Isp——喷得越快，Δv 越大。',
      ruleVol:'规则：每枚火箭用<b>一样大的油箱</b>。密度大的燃料，同样体积能多塞进不少重量。',
      analogy:'Δv 是火箭的"总本领"。<b>到近地轨道 ≈ 9.4 km/s</b>（虚线）。',
      orbit:'近地轨道 9.4 km/s',
      names:{ solid:'固体', kero:'液氧煤油', meth:'液氧甲烷', lh2:'液氧液氢' },
      muskStart:'先别看答案。选一种规则，按发射，自己看谁赢。',
      muskMass:'"高分燃料"液氢 Isp 最高。它会赢吗？发射看看。',
      muskVol:'油箱一样大。这回，密度也来搅局了。',
      muskDiscover:'<b>问法变了，答案就变了。先问对问题，再找答案。</b>',
      vWinMass:(w,dv,last)=>`<b>${w}</b> 夺冠！Δv=${dv} m/s。同样重量，比冲 Isp 最高的赢。垫底的是 ${last}——炸了？又一份数据。`,
      vWinVol:(w,dv,last)=>`<b>${w}</b> 反超夺冠！Δv=${dv} m/s。同样油箱，密度大的塞进的燃料更重，答案反转了！垫底 ${last}——炸了？又一份数据。`,
      badgeLocked:'徽章未解锁：两种规则各跑一遍，解锁「推进剂化学家」。',
      badgeHalf:'还差一步：换另一种规则再发射一次。',
      badgeEarned:'已获得徽章「推进剂化学家」——先问对问题，再找答案。',
    },
    en: {
      title:'Propellant Lab', titleEn:'燃料试验场', lang:'中', back:'← Menu',
      hook:"Musk: a fuel's soul is its <b>exhaust speed — specific impulse, Isp</b>. But top-scoring fuels always hide a catch. Four identical rockets, four fuels — who flies highest?",
      modeMass:'Same mass', modeVol:'Same tank size',
      race:'🚀 LAUNCH!', racing:'Igniting…',
      ruleMass:'Rule: every rocket carries the <b>same weight</b> of fuel. Pure Isp decides — faster exhaust, bigger Δv.',
      ruleVol:'Rule: every rocket has the <b>same-size tank</b>. A denser fuel packs far more mass into that volume.',
      analogy:'Δv is a rocket\'s total "oomph". <b>Reaching LEO ≈ 9.4 km/s</b> (dashed line).',
      orbit:'Low Earth orbit 9.4 km/s',
      names:{ solid:'Solid', kero:'LOX/Kerosene', meth:'LOX/Methane', lh2:'LOX/Hydrogen' },
      muskStart:'Don\'t peek at the answer. Pick a rule, hit launch, watch who wins.',
      muskMass:'Hydrogen has the highest Isp. Will it win? Launch and see.',
      muskVol:'Tanks are the same size. Now density joins the race.',
      muskDiscover:'<b>Change the question, change the answer. Ask the right question first.</b>',
      vWinMass:(w,dv,last)=>`<b>${w}</b> wins! Δv=${dv} m/s. Same mass, so the highest Isp takes it. Last place: ${last} — Boom? Another data point.`,
      vWinVol:(w,dv,last)=>`<b>${w}</b> takes the lead and wins! Δv=${dv} m/s. Same tank, and the denser fuel packs more mass — the answer flipped! Last: ${last} — Boom? Another data point.`,
      badgeLocked:'Badge locked: run BOTH rules once to earn "Propellant Chemist".',
      badgeHalf:'One to go: switch the rule and launch once more.',
      badgeEarned:'Badge earned: "Propellant Chemist" — ask the right question first.',
    }
  };
  let lang = 'zh';

  // ---------- storage ----------
  const KEY = 'fuelTest.v1';
  const store = load();
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  // ---------- DOM ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const verdictEl = document.getElementById('verdict');
  const modeMassBtn = document.getElementById('modeMass');
  const modeVolBtn  = document.getElementById('modeVol');
  const raceBtn = document.getElementById('raceBtn');
  const ruleEl = document.getElementById('rule');
  const analogyEl = document.getElementById('analogy');
  const metersEl = document.getElementById('meters');
  const muskEl = document.getElementById('musk');
  const badgeEl = document.getElementById('badge');
  const badgeText = document.getElementById('badgeText');

  // ---------- state ----------
  let mode = 'mass';
  let data = computeDv(mode);          // current fuel dv data
  let raceP = 0;                       // 0..1 eased progress driving heights/bars
  let racing = false, finished = false;
  let raceStart = 0;
  const RACE_MS = 3600;
  const stars = [];

  // ---------- canvas sizing (DPR-aware, from newton-cannon) ----------
  let W=0, H=0, dpr=1;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){
      for(let i=0;i<150;i++) stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.2, a:Math.random()*0.6+0.2});
    }
    draw();
  }

  function smooth(p){ return p*p*(3-2*p); } // smoothstep ease

  // ---------- geometry ----------
  function geo(){
    const marginX = W*0.05;
    const laneW = (W - 2*marginX)/4;
    const groundY = H*0.90;
    const topY = H*0.07;
    return { marginX, laneW, groundY, topY, usable: groundY - topY,
             cx:(i)=> marginX + laneW*(i+0.5) };
  }

  // ---------- drawing ----------
  function draw(){
    ctx.clearRect(0,0,W,H);
    const gm = geo();
    // stars
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(s.x*W, s.y*gm.groundY, s.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha=1;

    // orbit reference line
    const orbY = gm.groundY - (V_ORBIT/SCALE_MAX)*gm.usable;
    ctx.strokeStyle='rgba(74,163,255,.55)'; ctx.setLineDash([6,6]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,orbY); ctx.lineTo(W,orbY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(150,190,240,.9)'; ctx.font=`${Math.max(10,W*0.022)}px -apple-system,sans-serif`;
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('🛰 '+T[lang].orbit, gm.marginX+2, orbY-4);

    // ground
    ctx.fillStyle='#0a1120';
    ctx.fillRect(0, gm.groundY, W, H-gm.groundY);
    ctx.strokeStyle='rgba(120,140,170,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,gm.groundY); ctx.lineTo(W,gm.groundY); ctx.stroke();

    // find winner (max dv) for crown after finish
    let winIdx = 0;
    for(let i=1;i<data.length;i++) if(data[i].dv > data[winIdx].dv) winIdx=i;

    // rockets
    for(let i=0;i<data.length;i++){
      const f = data[i];
      const cx = gm.cx(i);
      const h  = (f.dv/SCALE_MAX)*gm.usable*raceP;
      const baseY = gm.groundY - h;
      drawRocket(cx, baseY, gm.laneW, f, i, winIdx);

      // label above rocket: name + live dv
      const fs = Math.max(9, W*0.021);
      ctx.font = `700 ${fs}px -apple-system,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      const rh = gm.laneW*0.62; // rocket total height
      ctx.fillStyle = f.color;
      ctx.fillText(T[lang].names[f.id], cx, baseY - rh - fs - 2);
      ctx.fillStyle = '#e6ebf2';
      ctx.fillText(Math.round(f.dv*raceP) + ' m/s', cx, baseY - rh - 2);
    }
  }

  function drawRocket(cx, baseY, laneW, f, i, winIdx){
    const bw = laneW*0.24;        // body width
    const bh = laneW*0.40;        // body height
    const noseH = laneW*0.18;
    const topY = baseY - bh - noseH; // nose tip
    const t = performance.now()*0.02;

    // exhaust flame (while rising)
    if(racing || (!finished && raceP>0)){
      const flick = 0.7 + 0.3*Math.sin(t*3 + i);
      const fl = laneW*0.22*flick;
      const grad = ctx.createLinearGradient(0, baseY, 0, baseY+fl);
      grad.addColorStop(0,'#fff'); grad.addColorStop(0.4,'#ffd27f'); grad.addColorStop(1,'rgba(255,90,20,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(cx-bw*0.4, baseY);
      ctx.lineTo(cx+bw*0.4, baseY);
      ctx.lineTo(cx, baseY+fl);
      ctx.closePath(); ctx.fill();
    }

    // fins
    ctx.fillStyle = shade(f.color,-0.35);
    ctx.beginPath();
    ctx.moveTo(cx-bw/2, baseY-bh*0.05);
    ctx.lineTo(cx-bw/2-bw*0.4, baseY);
    ctx.lineTo(cx-bw/2, baseY-bh*0.35);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+bw/2, baseY-bh*0.05);
    ctx.lineTo(cx+bw/2+bw*0.4, baseY);
    ctx.lineTo(cx+bw/2, baseY-bh*0.35);
    ctx.closePath(); ctx.fill();

    // body
    const bodyTop = baseY - bh;
    ctx.fillStyle = f.color;
    roundRect(cx-bw/2, bodyTop, bw, bh, bw*0.28); ctx.fill();
    // body shading
    ctx.fillStyle='rgba(255,255,255,.15)';
    roundRect(cx-bw/2, bodyTop, bw*0.4, bh, bw*0.28); ctx.fill();

    // nose cone
    ctx.fillStyle = shade(f.color,0.25);
    ctx.beginPath();
    ctx.moveTo(cx-bw/2, bodyTop);
    ctx.lineTo(cx+bw/2, bodyTop);
    ctx.lineTo(cx, topY);
    ctx.closePath(); ctx.fill();

    // window
    ctx.fillStyle='#0a1120';
    ctx.beginPath(); ctx.arc(cx, bodyTop+bh*0.32, bw*0.16, 0, 7); ctx.fill();
    ctx.fillStyle='rgba(120,180,255,.8)';
    ctx.beginPath(); ctx.arc(cx, bodyTop+bh*0.32, bw*0.10, 0, 7); ctx.fill();

    // winner crown after finish
    if(finished && i===winIdx){
      const fs = Math.max(12, laneW*0.34);
      ctx.font=`${fs}px -apple-system,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText('👑', cx, topY - laneW*0.02);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function shade(hex, amt){
    // amt in [-1,1]; lighten(+)/darken(-)
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, gg=(n>>8)&255, b=n&255;
    const f = amt<0 ? (1+amt) : 1;
    const add = amt>0 ? amt*255 : 0;
    r=Math.round(r*f+add); gg=Math.round(gg*f+add); b=Math.round(b*f+add);
    r=Math.min(255,r); gg=Math.min(255,gg); b=Math.min(255,b);
    return `rgb(${r},${gg},${b})`;
  }

  // ---------- race animation ----------
  function race(){
    if(racing) return;
    hideVerdict();
    racing = true; finished = false; raceP = 0;
    raceBtn.disabled = true; modeMassBtn.disabled = true; modeVolBtn.disabled = true;
    raceBtn.textContent = T[lang].racing;
    raceStart = performance.now();
    requestAnimationFrame(tick);
  }
  function tick(now){
    const p = Math.min(1, (now - raceStart)/RACE_MS);
    raceP = smooth(p);
    renderMeters();
    draw();
    if(p < 1){ requestAnimationFrame(tick); }
    else { finishRace(); }
  }
  function finishRace(){
    racing = false; finished = true; raceP = 1;
    raceBtn.disabled = false; modeMassBtn.disabled = false; modeVolBtn.disabled = false;
    raceBtn.textContent = T[lang].race;
    renderMeters(); draw();
    showVerdict();
    // progress + badge
    if(mode==='mass') store.ranMass = true; else store.ranVol = true;
    if(store.ranMass && store.ranVol && !store.earned){
      store.earned = true;
      try{ localStorage.setItem('mg.badge.fuel-test','1'); }catch(e){}
    }
    save();
    renderBadge();
    // discovery once both modes have been run
    if(store.ranMass && store.ranVol){ muskEl.innerHTML = T[lang].muskDiscover; }
    else { muskEl.innerHTML = mode==='mass' ? T[lang].muskMass : T[lang].muskVol; }
  }

  // ---------- verdict ----------
  function showVerdict(){
    const t = T[lang];
    const sorted = [...data].sort((a,b)=>b.dv-a.dv);
    const win = sorted[0], last = sorted[sorted.length-1];
    const wName = t.names[win.id], lName = t.names[last.id];
    const wDv = Math.round(win.dv);
    const txt = mode==='mass' ? t.vWinMass(wName,wDv,lName) : t.vWinVol(wName,wDv,lName);
    verdictEl.className = 'verdict show ok';
    verdictEl.innerHTML = `<span class="tag">${t.names[win.id]} 👑</span>${txt}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ---------- meters (Δv bars) ----------
  function buildMeters(){
    metersEl.innerHTML = '';
    data.forEach(f => {
      const m = document.createElement('div'); m.className='meter';
      m.innerHTML = `<div class="mlabel">
          <span><span class="swatch" style="background:${f.color}"></span>${T[lang].names[f.id]}</span>
          <span class="dv" data-id="${f.id}">0 m/s</span></div>
        <div class="mbar"><div class="mfill" data-id="${f.id}" style="background:linear-gradient(90deg, ${shade(f.color,-0.25)}, ${f.color})"></div></div>`;
      metersEl.appendChild(m);
    });
  }
  function renderMeters(){
    data.forEach(f => {
      const fill = metersEl.querySelector(`.mfill[data-id="${f.id}"]`);
      const lab  = metersEl.querySelector(`.dv[data-id="${f.id}"]`);
      const cur = f.dv*raceP;
      if(fill) fill.style.width = ((cur/SCALE_MAX)*100).toFixed(1)+'%';
      if(lab)  lab.textContent = Math.round(cur)+' m/s';
    });
  }

  // ---------- mode switching ----------
  function setMode(m){
    if(racing) return;
    mode = m;
    data = computeDv(mode);
    raceP = 0; finished = false;
    modeMassBtn.className = m==='mass' ? 'fire' : 'ghost';
    modeVolBtn.className  = m==='vol'  ? 'fire' : 'ghost';
    ruleEl.innerHTML = m==='mass' ? T[lang].ruleMass : T[lang].ruleVol;
    if(store.ranMass && store.ranVol) muskEl.innerHTML = T[lang].muskDiscover;
    else muskEl.innerHTML = m==='mass' ? T[lang].muskMass : T[lang].muskVol;
    buildMeters(); renderMeters(); hideVerdict(); draw();
  }

  // ---------- badge ----------
  function renderBadge(){
    const t = T[lang];
    badgeEl.className = 'badge' + (store.earned ? ' earned' : '');
    if(store.earned) badgeText.textContent = t.badgeEarned;
    else if(store.ranMass || store.ranVol) badgeText.textContent = t.badgeHalf;
    else badgeText.textContent = t.badgeLocked;
  }

  // ---------- static text / language ----------
  function renderStatic(){
    const t = T[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('titleEn').textContent = t.titleEn;
    document.getElementById('back').textContent = t.back;
    document.getElementById('langBtn').textContent = t.lang;
    document.getElementById('hook').innerHTML = t.hook;
    modeMassBtn.textContent = t.modeMass;
    modeVolBtn.textContent  = t.modeVol;
    raceBtn.textContent = racing ? t.racing : t.race;
    analogyEl.innerHTML = t.analogy;
    ruleEl.innerHTML = mode==='mass' ? t.ruleMass : t.ruleVol;
    document.documentElement.lang = lang;
  }

  // ---------- events ----------
  modeMassBtn.addEventListener('click', ()=>setMode('mass'));
  modeVolBtn.addEventListener('click', ()=>setMode('vol'));
  raceBtn.addEventListener('click', race);
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic(); buildMeters(); renderMeters(); renderBadge();
    if(finished) showVerdict();
    draw();
  });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic();
  setMode('mass');
  muskEl.innerHTML = T[lang].muskStart;
  renderBadge();
  resize();
})();
</script>
</body>
</html>
