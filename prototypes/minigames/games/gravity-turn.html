<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>重力转弯 · Gravity Turn</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific bits common.css doesn't cover */
  .hud{position:absolute; left:12px; top:12px; font-size:12px; color:var(--muted);
       background:rgba(8,12,22,.5); border:1px solid var(--line); border-radius:10px; padding:7px 10px; line-height:1.5;
       backdrop-filter:blur(4px); pointer-events:none}
  .hud b{color:var(--flame2); font-variant-numeric:tabular-nums}
  .hud .up{color:var(--blue)}
  .legend{position:absolute; right:12px; top:12px; font-size:11px; color:var(--muted);
          background:rgba(8,12,22,.5); border:1px solid var(--line); border-radius:10px; padding:6px 9px; line-height:1.6;
          pointer-events:none}
  .legend .dash{display:inline-block; width:16px; border-top:2px dashed var(--flame2); vertical-align:middle; margin-right:5px}
  .legend .ring{display:inline-block; width:11px; height:11px; border:2px solid #fff; border-radius:50%; vertical-align:middle; margin-right:5px; opacity:.85}
  .rec{color:var(--blue)!important}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">重力转弯</h1><span class="en" id="titleEn">Gravity Turn</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud"></div>
    <div class="legend" id="legend"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="spd">0.0</span><span class="unit" id="spdUnit">km/s 横向</span>
      <span class="chip" id="tgtChip"></span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="sliderrow">
      <label><span id="pitchLabel">倾角</span> <b><span id="pitchVal">0</span>°</b></label>
      <div class="sliderwrap">
        <input type="range" id="slider" min="0" max="90" step="1" value="0" />
        <div class="ticks" id="ticks"></div>
      </div>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">发射！</button>
      <button class="ghost" id="retryBtn">重来</button>
    </div>
  </div>

  <div class="panel hidden" id="quizPanel">
    <p class="q" id="quizQ"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ================= physics constants (scaled sim, honest relationships) =================
  const G = 9.8;          // gravity (down)
  const ATHRUST = 26;     // thrust accel magnitude
  const RHO0 = 1.0;       // sea-level air density
  const HSCALE = 30;      // atmosphere scale height (density halves as you climb)
  const KDRAG = 0.0016;   // drag coefficient (drag ~ rho * v^2)
  const TBURN = 6.5;      // seconds of fuel (watchable ascent)
  const DT = 0.02;        // integration step (sim seconds)
  const PITCH_CAP = 88;   // ideal program lays over to ~88 deg
  const PITCH_T1 = 0.7;   // ideal stays vertical this long (clear thick low air)
  const QBREAK = 850;     // dynamic pressure that tears the rocket apart
  // world -> screen framing (fixed camera, equal x/y scale so the arc shape is honest)
  const WX0=-14, WX1=196, WY0=0, WY1=300;

  function rho(y){ return RHO0 * Math.exp(-Math.max(0,y)/HSCALE); }
  // pitch measured from VERTICAL: 0 = straight up, 90 = flat/horizontal
  function idealPitchRad(t){
    if(t < PITCH_T1) return 0;
    const f = Math.min(1, (t - PITCH_T1)/(TBURN - PITCH_T1));
    const s = f*f*(3-2*f);              // smoothstep ease-over
    return PITCH_CAP * s * Math.PI/180;
  }
  // one integration step; mutates state s={x,y,vx,vy}; returns dynamic pressure q
  function step(s, thRad, thrustOn){
    const sp = Math.hypot(s.vx, s.vy);
    const r = rho(s.y);
    const q = 0.5 * r * sp * sp;
    let ax = thrustOn ? ATHRUST*Math.sin(thRad) : 0;
    let ay = (thrustOn ? ATHRUST*Math.cos(thRad) : 0) - G;
    if(sp > 1e-6){ const d = KDRAG*r*sp; ax -= d*s.vx; ay -= d*s.vy; }
    s.vx += ax*DT; s.vy += ay*DT;
    s.x  += s.vx*DT; s.y += s.vy*DT;
    return q;
  }

  // ---- precompute the IDEAL gravity-turn curve (same integrator) ----
  const ideal = (function(){
    const pts=[], pitch=[]; let s={x:0,y:0,vx:0,vy:0}, t=0, apo=0;
    while(t < TBURN){
      const th = idealPitchRad(t);
      pitch.push(th);
      step(s, th, true);
      pts.push([s.x, s.y]);
      if(s.y>apo) apo=s.y;
      t += DT;
    }
    return { pts, pitch, vx:s.vx, vy:s.vy, apo };
  })();
  const TARGET_VX = ideal.vx;                 // orbital horizontal speed (raw)
  const ORBIT_VX  = 0.5 * TARGET_VX;          // enough sideways speed to make orbit
  const SPD_DISP  = 7.8 / TARGET_VX;          // raw vx -> km/s so target reads 7.8
  const ALT_DISP  = 150 / ideal.apo;          // raw altitude -> km (ideal apo ~150 km)

  // ================= i18n =================
  const T = {
    zh:{
      title:'重力转弯', titleEn:'Gravity Turn', lang:'EN', back:'← 目录',
      hook:'马斯克：<b>入轨不是往上飞，是往旁边飞得够快</b>。所以火箭起飞后慢慢侧身、<b>越飞越躺平</b>。转动倾角，让火箭贴着虚线弯道飞——把速度从"往上"扭成"往旁边"。',
      fire:'发射！', retry:'重来', flying:'飞行中…',
      pitchLabel:'倾角（0°竖直 · 90°躺平）', rec:'建议',
      spdUnit:'km/s 横向', tgt:'目标 7.8',
      analogyReady:'把倾角从 0° 慢慢加大，跟住蓝色圆环。<b>横向速度</b>才是入轨的关键。',
      analogyFly:(h,up,alt)=>`横向 <b>${h}</b> · 纵向 <span style="color:var(--blue)">${up}</span> · 高度 ${alt} km`,
      hud:(h,up,alt,q)=>`横向 <b>${h}</b> km/s<br>纵向 <span class="up">${up}</span> km/s<br>高度 ${alt} km<br>气动压 ${q}`,
      legendDash:'理想弯道', legendRing:'跟这个飞', legendRec:'建议倾角',
      badgeLocked:'徽章未解锁：贴着弯道成功入轨，即可获得「入轨舵手」。',
      badgeEarned:'已获得徽章「入轨舵手」——入轨=横向飞得够快，永远掉不下来。',
      stars:'贴合度',
      v:{
        vertical:{tag:'掉回来了', t:'<b>飞得高≠入轨，横向速度才算数！</b><small> 只往上飞，你永远没有横向速度，燃料一空就直直掉回来。</small>', meme:'炸了？又一份数据。'},
        early:{tag:'过热解体', t:'<b>太早躺平，稠密大气里横冲——过热解体。</b><small> 低空空气又稠又厚，横冲让气动压爆表，火箭被撕开了。</small>', meme:'炸了？又一份数据。'},
        orbit:{tag:'入轨成功 🛰️', t:'<b>贴着弯道，完美入轨！</b><small> 横向速度够快，你再也掉不下来了——这就是轨道。</small>'}
      },
      quizQ:'为什么不干脆一路往上飞到太空，再拐弯？',
      choices:[
        {k:'A', txt:'更省事，先上去再说', cls:'wrong'},
        {k:'B', txt:'只往上飞永远没有横向速度，会掉回来', cls:'correct'},
        {k:'C', txt:'先飞很高再一次拐平——能入轨，但要多烧燃料把速度扭过来', cls:'half'}
      ],
      fb:{
        A:'<b>不行。</b>到了太空只要横向速度不够，一样直直掉回地面。入轨靠的是<b>横向速度</b>，不是高度。',
        B:'<b>对！</b>轨道 = 横着飞得够快，快到"下落的弯度"正好等于地球的弯度。所以火箭起飞后要慢慢躺平，把推力用来加横向速度。',
        C:'<b>不算错，但有代价。</b>能入轨，可你把速度先全砸在"往上"，之后还得费力扭成横向——浪费燃料。<b>重力转弯</b>让重力帮你顺势拐弯，最省。'
      }
    },
    en:{
      title:'Gravity Turn', titleEn:'重力转弯', lang:'中', back:'← Menu',
      hook:'Musk: <b>orbit isn\'t about flying up — it\'s about flying sideways fast enough</b>. So a rocket leans over after liftoff and <b>gets flatter and flatter</b>. Turn the pitch to hug the dashed curve — trading "up" speed for "sideways" speed.',
      fire:'LAUNCH!', retry:'Retry', flying:'Flying…',
      pitchLabel:'Pitch (0° up · 90° flat)', rec:'aim',
      spdUnit:'km/s sideways', tgt:'target 7.8',
      analogyReady:'Slowly raise the pitch from 0° and chase the blue ring. <b>Sideways speed</b> is what gets you to orbit.',
      analogyFly:(h,up,alt)=>`sideways <b>${h}</b> · up <span style="color:var(--blue)">${up}</span> · alt ${alt} km`,
      hud:(h,up,alt,q)=>`sideways <b>${h}</b> km/s<br>up <span class="up">${up}</span> km/s<br>alt ${alt} km<br>air load ${q}`,
      legendDash:'ideal curve', legendRing:'chase this', legendRec:'aim pitch',
      badgeLocked:'Badge locked: hug the curve into orbit to earn "Ascent Helmsman".',
      badgeEarned:'Badge earned: "Ascent Helmsman" — orbit = flying sideways too fast to ever fall.',
      stars:'tracking',
      v:{
        vertical:{tag:'Fell back', t:'<b>Going high isn\'t orbit — sideways speed is what counts!</b><small> Fly straight up and you never build sideways speed — fuel runs out and you drop straight back.</small>', meme:'Boom? Another data point.'},
        early:{tag:'Tore apart', t:'<b>Pitched over too early — tore apart in thick air.</b><small> Low air is dense; charging sideways through it spiked the air load and ripped the rocket apart.</small>', meme:'Boom? Another data point.'},
        orbit:{tag:'In orbit 🛰️', t:'<b>Hugged the curve — clean orbit insertion!</b><small> Fast enough sideways that you never fall back down. That\'s an orbit.</small>'}
      },
      quizQ:'Why not just fly straight up into space, then turn?',
      choices:[
        {k:'A', txt:'Easier — get up there first', cls:'wrong'},
        {k:'B', txt:'Straight up never builds sideways speed, so you fall back', cls:'correct'},
        {k:'C', txt:'Coast up high then turn flat in one go — works, but burns extra fuel to swing the speed sideways', cls:'half'}
      ],
      fb:{
        A:'<b>Nope.</b> In space with no sideways speed you still drop straight down. Orbit is about <b>sideways speed</b>, not height.',
        B:'<b>Yes!</b> An orbit means flying sideways so fast your fall curves exactly like Earth. So the rocket leans over and spends thrust on sideways speed.',
        C:'<b>Not wrong, but it costs.</b> You can reach orbit, but dumping all your speed "up" first means wrestling it sideways later — wasteful. A <b>gravity turn</b> lets gravity ease you over for free.'
      }
    }
  };
  let lang = 'zh';

  // ================= DOM =================
  const $ = id => document.getElementById(id);
  const canvas=$('c'), ctx=canvas.getContext('2d');
  const slider=$('slider'), pitchVal=$('pitchVal'), pitchLabelEl=$('pitchLabel');
  const spdEl=$('spd'), spdUnitEl=$('spdUnit'), tgtChip=$('tgtChip'), analogyEl=$('analogy');
  const hudEl=$('hud'), legendEl=$('legend'), verdictEl=$('verdict');
  const fireBtn=$('fireBtn'), retryBtn=$('retryBtn');
  const badgeEl=$('badge'), badgeText=$('badgeText');
  const quizPanel=$('quizPanel'), quizQ=$('quizQ'), choicesEl=$('choices'), feedbackEl=$('feedback');

  // ================= canvas sizing =================
  let W=0,H=0,dpr=1,scale=1,padX=0,padY=0;
  const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const pad=14;
    scale=Math.min((W-2*pad)/(WX1-WX0),(H-2*pad)/(WY1-WY0));
    const leftover=W-(WX1-WX0)*scale;
    padX=leftover*0.18;
    padY=pad;
    if(stars.length===0){
      for(let i=0;i<150;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,a:Math.random()*0.7+0.2});
    }
    draw();
  }
  const sx = wx => padX + (wx-WX0)*scale;
  const sy = wy => H - padY - (wy-WY0)*scale;

  // ================= game state =================
  let state='ready';           // ready | flying | falling | orbiting | exploding
  let s={x:0,y:0,vx:0,vy:0};    // live rocket physics
  let simT=0, acc=0, lastTs=0;
  let trail=[];                 // actual path [x,y]
  let devSum=0, devN=0, brokeQ=0;
  let outcome=null, stars3=0;
  let shake=0, boom=null;       // explosion {x,y,t}
  let orbitT=0;                 // flourish timer
  let curPitchRad=0;            // for idle nose rotation

  function resetRocket(){
    state='ready'; s={x:0,y:0,vx:0,vy:0}; simT=0; acc=0;
    trail=[]; devSum=0; devN=0; brokeQ=0; outcome=null; stars3=0;
    shake=0; boom=null; orbitT=0;
    curPitchRad=(+slider.value)*Math.PI/180;
    hideVerdict();
    quizPanel.classList.add('hidden');
    fireBtn.disabled=false; retryBtn.disabled=false;
    fireBtn.textContent=T[lang].fire;
    renderReadout();
    draw();
  }

  // nearest distance from (x,y) to the ideal polyline (point-sampled, dense enough)
  function devTo(x,y){
    let best=Infinity;
    const p=ideal.pts;
    for(let i=0;i<p.length;i+=1){
      const dx=x-p[i][0], dy=y-p[i][1];
      const d=dx*dx+dy*dy;
      if(d<best) best=d;
    }
    return Math.sqrt(best);
  }
  function recPitchRad(){
    if(state==='flying'){
      const i=Math.min(ideal.pitch.length-1, Math.floor(simT/DT));
      return ideal.pitch[i];
    }
    return curPitchRad;
  }

  // ================= main loop =================
  function frame(ts){
    if(!lastTs) lastTs=ts;
    let dtReal=(ts-lastTs)/1000; lastTs=ts;
    if(dtReal>0.1) dtReal=0.1;

    if(state==='flying'){
      acc+=dtReal;
      while(acc>=DT && state==='flying'){
        const q=step(s, curPitchRad, true);
        acc-=DT; simT+=DT;
        trail.push([s.x,s.y]);
        const d=devTo(s.x,s.y); devSum+=d; devN++;
        if(q>QBREAK){ brokeQ=q; outcome='early'; explode(); break; }   // torn apart by air load
        if(s.y<=0 && simT>0.15){ outcome='early'; s.y=0; explode(); break; } // laid over too early, never climbed out of thick air
        if(simT>=TBURN){ burnout(); break; }
      }
    } else if(state==='falling'){
      acc+=dtReal*3.5;                       // speed up the fall-back flourish (verdict already shown)
      while(acc>=DT && state==='falling'){
        step(s,0,false); acc-=DT; simT+=DT;
        trail.push([s.x,s.y]);
        if(s.y<=0){ s.y=0; explode(); break; }
      }
    } else if(state==='orbiting'){
      orbitT+=dtReal;
      acc+=dtReal;
      while(acc>=DT){ step(s,0,false); acc-=DT; } // gentle coast for the flourish
    } else if(state==='exploding'){
      if(boom) boom.t+=dtReal;
    }
    if(shake>0) shake=Math.max(0,shake-dtReal*3);

    draw();
    updateReadout();
    requestAnimationFrame(frame);
  }

  function burnout(){
    if(s.vx>=ORBIT_VX){
      outcome='orbit';
      const avg=devN?devSum/devN:999;
      stars3 = avg<18 ? 3 : avg<38 ? 2 : 1;
      state='orbiting';
      finishOrbit();
    } else {
      outcome='vertical';
      state='falling';
      fireBtn.disabled=false;
      showVerdict();                          // tell the kid right away; the fall plays out behind it
    }
  }
  function explode(){
    if(!outcome) outcome='early';
    boom={x:s.x,y:Math.max(0,s.y),t:0}; shake=1; state='exploding';
    fireBtn.disabled=false;
    showVerdict();
  }
  function finishOrbit(){
    try{ localStorage.setItem('mg.badge.gravity-turn','1'); }catch(e){}
    fireBtn.disabled=false;
    showVerdict();
    renderBadge();
  }

  // ================= drawing =================
  function draw(){
    const ox=(Math.random()-0.5)*shake*10, oy=(Math.random()-0.5)*shake*10;
    ctx.save(); ctx.translate(ox,oy);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawSky();
    drawGround();
    drawIdealCurve();
    drawGhostRing();
    drawTrail();
    if(state==='exploding') drawBoom();
    else drawRocket();
    ctx.restore();
  }

  function drawSky(){
    // vertical gradient: ground haze -> deep space (higher = darker)
    const g=ctx.createLinearGradient(0,H,0,0);
    g.addColorStop(0,'#0a1a33'); g.addColorStop(0.45,'#071224'); g.addColorStop(1,'#03040a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // stars fade in with altitude (upper part of frame)
    for(const st of stars){
      const yy=st.y*H;
      const fade=Math.min(1,(H-yy)/(H*0.9));
      ctx.globalAlpha=st.a*fade;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(st.x*W,yy,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    // thick-air band near the ground (where drag/heat bites) — subtle
    const ay=sy(HSCALE*1.6);
    const air=ctx.createLinearGradient(0,H,0,ay);
    air.addColorStop(0,'rgba(74,163,255,.16)'); air.addColorStop(1,'rgba(74,163,255,0)');
    ctx.fillStyle=air; ctx.fillRect(0,ay,W,H-ay);
  }
  function drawGround(){
    const gy=sy(0);
    ctx.fillStyle='#101827';
    ctx.fillRect(0,gy,W,H-gy);
    ctx.strokeStyle='rgba(139,160,180,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    // launch pad
    const px=sx(0);
    ctx.fillStyle='#3a4356';
    ctx.fillRect(px-11,gy-6,22,6);
    ctx.fillStyle='#2a3242';
    ctx.fillRect(px-3,gy-13,6,7);
  }
  function drawIdealCurve(){
    ctx.strokeStyle='rgba(255,210,127,.8)'; ctx.lineWidth=2; ctx.setLineDash([7,7]); ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(sx(ideal.pts[0][0]), sy(ideal.pts[0][1]));
    for(let i=1;i<ideal.pts.length;i+=1) ctx.lineTo(sx(ideal.pts[i][0]), sy(ideal.pts[i][1]));
    ctx.stroke(); ctx.setLineDash([]);
    // little "orbit" hint arrow at the flat end
    const last=ideal.pts[ideal.pts.length-1];
    const lx=sx(last[0]), ly=sy(last[1]);
    ctx.fillStyle='rgba(255,210,127,.9)';
    ctx.beginPath(); ctx.moveTo(lx+10,ly); ctx.lineTo(lx,ly-5); ctx.lineTo(lx,ly+5); ctx.fill();
  }
  function drawGhostRing(){
    if(state==='orbiting'||state==='exploding') return;
    let idx;
    if(state==='flying') idx=Math.min(ideal.pts.length-1, Math.floor(simT/DT));
    else idx=0;
    const p=ideal.pts[idx];
    const rx=sx(p[0]), ry=sy(p[1]);
    const pulse=1+0.18*Math.sin(Date.now()/220);
    ctx.strokeStyle='rgba(74,163,255,.95)'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(rx,ry,9*pulse,0,7); ctx.stroke();
    ctx.fillStyle='rgba(74,163,255,.9)';
    ctx.beginPath(); ctx.arc(rx,ry,2.4,0,7); ctx.fill();
  }
  function drawTrail(){
    if(trail.length<2) return;
    ctx.strokeStyle=outcome==='orbit'?'#57d38c':(outcome==='early'?'#ff6a6a':'#ff8c42');
    ctx.globalAlpha=0.95; ctx.lineWidth=2.6; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(sx(trail[0][0]), sy(trail[0][1]));
    for(let i=1;i<trail.length;i+=1) ctx.lineTo(sx(trail[i][0]), sy(trail[i][1]));
    ctx.stroke(); ctx.globalAlpha=1;
  }
  function drawRocket(){
    if(state==='falling'||state==='flying'||state==='ready'||state==='orbiting'){
      const px=sx(s.x), py=sy(s.y);
      // orbit flourish: satellite + glow
      if(state==='orbiting'){
        ctx.save(); ctx.shadowColor='#57d38c'; ctx.shadowBlur=16;
        ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🛰️', px, py);
        ctx.restore();
        // sparkle
        if(Math.sin(orbitT*8)>0){ ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(px+10,py-8,1.6,0,7); ctx.fill(); }
        return;
      }
      // nose angle: while flying use live pitch; while falling point along velocity
      let th=curPitchRad;
      if(state==='falling'){ th=Math.atan2(s.vx,Math.max(0.001,s.vy)); if(s.vy<0) th=Math.PI-Math.atan2(s.vx,-s.vy); }
      const thrustOn=(state==='flying');
      ctx.save(); ctx.translate(px,py); ctx.rotate(th);
      // flame
      if(thrustOn){
        const fl=13+Math.random()*7;
        const fg=ctx.createLinearGradient(0,7,0,7+fl);
        fg.addColorStop(0,'#ffd27f'); fg.addColorStop(0.5,'#ff8c42'); fg.addColorStop(1,'rgba(255,90,90,0)');
        ctx.fillStyle=fg;
        ctx.beginPath(); ctx.moveTo(-3.5,7); ctx.lineTo(3.5,7); ctx.lineTo(0,7+fl); ctx.closePath(); ctx.fill();
      }
      // body
      ctx.fillStyle='#dfe5ee';
      ctx.beginPath();
      ctx.moveTo(0,-14); ctx.lineTo(4,-4); ctx.lineTo(4,8); ctx.lineTo(-4,8); ctx.lineTo(-4,-4); ctx.closePath(); ctx.fill();
      // nose
      ctx.fillStyle='#ff8c42';
      ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(4,-4); ctx.lineTo(-4,-4); ctx.closePath(); ctx.fill();
      // fins
      ctx.fillStyle='#9aa4b4';
      ctx.beginPath(); ctx.moveTo(-4,4); ctx.lineTo(-8,9); ctx.lineTo(-4,9); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(8,9); ctx.lineTo(4,9); ctx.closePath(); ctx.fill();
      // window
      ctx.fillStyle='#4aa3ff'; ctx.beginPath(); ctx.arc(0,-2,1.8,0,7); ctx.fill();
      ctx.restore();

      // recommended-nose ghost (faint dashed line) while steering
      if(state==='flying'||state==='ready'){
        const rth=recPitchRad();
        ctx.save(); ctx.translate(px,py); ctx.rotate(rth);
        ctx.strokeStyle='rgba(74,163,255,.55)'; ctx.setLineDash([3,4]); ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,-30); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
    }
  }
  function drawBoom(){
    if(!boom) return;
    const px=sx(boom.x), py=sy(Math.max(0,boom.y));
    const t=boom.t;
    const R=10+t*130;
    const a=Math.max(0,1-t*1.4);
    const g=ctx.createRadialGradient(px,py,0,px,py,R);
    g.addColorStop(0,`rgba(255,255,255,${a})`);
    g.addColorStop(0.4,`rgba(255,180,90,${a*0.9})`);
    g.addColorStop(0.8,`rgba(255,90,50,${a*0.5})`);
    g.addColorStop(1,'rgba(255,90,50,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,R,0,7); ctx.fill();
  }

  // ================= verdict / readout =================
  function showVerdict(){
    const v=T[lang].v[outcome];
    let cls = outcome==='orbit' ? 'orbit' : (outcome==='early' ? 'impact' : 'impact');
    let html=`<span class="tag">${v.tag}</span>${v.t}`;
    if(outcome==='orbit'){
      const filled='★'.repeat(stars3), empty='☆'.repeat(3-stars3);
      html+=`<div style="margin-top:8px"><span class="stars" style="font-size:18px">${filled}${empty}</span> <small>${T[lang].stars}</small></div>`;
    } else if(v.meme){
      html+=`<div style="margin-top:6px"><small><b style="color:var(--flame2)">${v.meme}</b></small></div>`;
    }
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=html;
    // reveal quiz after any completed flight
    quizPanel.classList.remove('hidden');
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  function updateReadout(){
    const h=(s.vx*SPD_DISP).toFixed(1);
    const up=(s.vy*SPD_DISP).toFixed(1);
    const alt=Math.max(0,Math.round(s.y*ALT_DISP));
    const sp=Math.hypot(s.vx,s.vy), q=Math.round(0.5*rho(s.y)*sp*sp);
    spdEl.textContent=h;
    if(state==='flying'||state==='falling'||state==='orbiting'||state==='exploding'){
      analogyEl.innerHTML=T[lang].analogyFly(h,up,alt);
      hudEl.innerHTML=T[lang].hud(h,up,alt,q);
      hudEl.style.display='';
    }
  }
  function renderReadout(){
    spdEl.textContent=(s.vx*SPD_DISP).toFixed(1);
    spdUnitEl.textContent=T[lang].spdUnit;
    tgtChip.textContent=T[lang].tgt;
    if(state==='ready'){ analogyEl.innerHTML=T[lang].analogyReady; hudEl.style.display='none'; }
    pitchVal.textContent=slider.value;
  }

  function renderBadge(){
    let earned=false; try{ earned=localStorage.getItem('mg.badge.gravity-turn')==='1'; }catch(e){}
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }

  // ================= ticks =================
  function buildTicks(){
    const ticksEl=$('ticks'); ticksEl.innerHTML='';
    [{v:0,l:'0°'},{v:45,l:'45°'},{v:90,l:'90°'}].forEach(tk=>{
      const el=document.createElement('div'); el.className='tick reveal';
      el.style.left=(tk.v/90*100)+'%';
      el.innerHTML='<b>'+tk.l+'</b>';
      ticksEl.appendChild(el);
    });
  }

  // ================= quiz =================
  let answered=false;
  function buildQuiz(){
    choicesEl.innerHTML=''; feedbackEl.textContent=''; answered=false;
    const t=T[lang];
    quizQ.textContent=t.quizQ;
    t.choices.forEach(c=>{
      const b=document.createElement('button');
      b.className='choice';
      b.innerHTML=`<span class="key">${c.k}</span><span>${c.txt}</span>`;
      b.addEventListener('click',()=>onAnswer(c,b));
      choicesEl.appendChild(b);
    });
  }
  function onAnswer(c,btn){
    if(answered) return; answered=true;
    btn.classList.add(c.cls);
    feedbackEl.innerHTML=T[lang].fb[c.k];
    [...choicesEl.children].forEach(ch=>{ if(ch!==btn) ch.classList.add('dim'); });
  }

  // ================= static text =================
  function renderStatic(){
    const t=T[lang];
    $('title').textContent=t.title;
    $('titleEn').textContent=t.titleEn;
    $('langBtn').textContent=t.lang;
    $('back').textContent=t.back;
    $('hook').innerHTML=t.hook;
    fireBtn.textContent=(state==='flying')?t.flying:t.fire;
    retryBtn.textContent=t.retry;
    pitchLabelEl.textContent=t.pitchLabel;
    legendEl.innerHTML=`<span class="dash"></span>${t.legendDash}<br><span class="ring"></span>${t.legendRing}`;
    document.documentElement.lang=lang;
    // rebuild quiz text if present
    buildQuiz();
    renderReadout();
    renderBadge();
  }

  // ================= events =================
  slider.addEventListener('input',()=>{
    pitchVal.textContent=slider.value;
    curPitchRad=(+slider.value)*Math.PI/180;
    if(state==='ready') draw();   // immediate nose rotation before launch
  });
  fireBtn.addEventListener('click',()=>{
    if(state==='flying') return;
    if(state!=='ready') resetRocket();
    curPitchRad=(+slider.value)*Math.PI/180;
    state='flying'; simT=0; acc=0; lastTs=0; trail=[]; devSum=0; devN=0;
    fireBtn.disabled=true; fireBtn.textContent=T[lang].flying;
    hideVerdict();
  });
  retryBtn.addEventListener('click',()=>{ resetRocket(); });
  $('langBtn').addEventListener('click',()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic();
    fireBtn.textContent=(state==='flying')?T[lang].flying:T[lang].fire;
    if(outcome) showVerdict();
    updateReadout();
  });
  window.addEventListener('resize',resize);

  // ================= init =================
  renderStatic();
  buildTicks();
  resetRocket();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
