<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>举重比赛 · TWR Test Bench</title>
<link rel="stylesheet" href="../common.css">
<style>
  .gauge{position:relative; height:16px; border-radius:999px; margin:6px 0 26px; overflow:visible;
         background:linear-gradient(90deg,#b53030 0%,#b53030 33%,#2f9e63 40%,#57d38c 50%,#57d38c 50%,#ffcf5a 60%,#ffcf5a 83%,#ff8c42 100%);}
  .gauge .gzone{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.25)}
  .gauge .gmark{position:absolute; top:-6px; width:4px; height:28px; background:#fff; border-radius:2px;
                box-shadow:0 0 8px rgba(255,255,255,.8); transform:translateX(-2px); transition:left .15s}
  .gauge .glabel{position:absolute; top:20px; font-size:10px; color:var(--muted); transform:translateX(-50%); white-space:nowrap}
  .segpick{display:flex; gap:8px; margin-top:6px}
  .segpick button{flex:1; padding:10px; font-size:14px}
  .segpick button.sel{background:linear-gradient(180deg,#ff9a4d,#e5651a); border-color:#ff9a4d; color:#1a0d02}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">举重比赛</h1><span class="en" id="titleEn">TWR Test Bench</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="unit" id="twrLbl">推重比 TWR</span>
      <span class="big" id="twr">1.2</span>
      <span class="chip" id="twrChip"></span>
    </div>
    <div class="analogy" id="calc"></div>

    <div class="gauge" id="gauge">
      <div class="gmark" id="gmark"></div>
    </div>

    <div class="sliderrow">
      <label id="engLbl"><span>发动机数量 Merlin engines</span><b id="engVal">4 台</b></label>
      <div class="sliderwrap">
        <input type="range" id="engSlider" min="1" max="9" step="1" value="4" />
      </div>
    </div>

    <div class="sliderrow">
      <label id="payLbl"><span>载货重量 Payload</span><b id="payVal"></b></label>
      <div class="segpick" id="payPick">
        <button data-p="0" id="pLight">轻</button>
        <button data-p="1" id="pMed">中</button>
        <button data-p="2" id="pHeavy">重</button>
      </div>
    </div>

    <div class="buttons" style="margin-top:14px">
      <button class="fire" id="launchBtn">点火发射！</button>
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <div class="panel">
    <p class="q" id="q"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- real numbers ----------
  const THRUST_PER=30;              // tf per Merlin
  const BASE=100;                   // t base rocket
  const PAY=[0,50,100];             // t added by light/med/heavy
  const PAYNAME_ZH=['轻(+0吨)','中(+50吨)','重(+100吨)'];
  const PAYNAME_EN=['Light (+0t)','Medium (+50t)','Heavy (+100t)'];
  // gauge maps TWR 0..3 across the bar
  const GMAX=3;

  const T={
    zh:{
      title:'举重比赛', titleEn:'TWR Test Bench', lang:'EN', back:'← 目录',
      hook:'马斯克：推力必须<b>赢过体重</b>才能离地。这个比值叫<b>推重比 TWR = 总推力 ÷ 总重量</b>。为什么不干脆做到 5？玩完你就懂。调发动机和载货，找到刚好起飞的甜区。',
      twrLbl:'推重比 TWR', engLbl:'发动机数量 Merlin engines', payLbl:'载货重量 Payload',
      launch:'点火发射！', reset:'重来',
      eng:(n)=>`${n} 台`,
      calc:(thrust,weight,twr)=>`总推力 = ${n_val(thrust)} 台×30 = <b>${thrust} 吨</b>；总重 = 100 + 货 = <b>${weight} 吨</b>；TWR = ${thrust} ÷ ${weight} = <b>${twr.toFixed(2)}</b>。`,
      chip:(b)=>({stuck:'离不了地',hover:'勉强爬升',perfect:'完美 ✅',fast:'有点猛',toofast:'太猛 ⚠️'})[b],
      badgeLocked:'徽章未解锁：把 TWR 调到 1.2–1.5 完美起飞（或答对下面的题），即可获得「推力调配师」。',
      badgeEarned:'已获得徽章「推力调配师」——TWR 略大于 1 就够飞，太大只会更重更贵、压坏货。',
      v:{
        stuck:{tag:'冒烟不动', t:'推力比体重还小，火箭<b>纹丝不动</b>，只在冒烟。<b>又一份数据。</b><small> 这就成了全世界最贵的烟花。加发动机，或者减货。</small>'},
        hover:{tag:'爬两下就坠回', t:'刚过 1 一点点，火箭慢吞吞往上爬，燃料却<b>全交了"悬停税"</b>，烧光后坠回地面。<b>又一份数据。</b><small> 起飞得干脆，TWR 要到 1.2 以上。</small>'},
        perfect:{tag:'完美升空 🚀', t:'漂亮！TWR 在 <b>1.2–1.5</b> 的甜区，火箭干净利落地离地，货也稳稳的。<small> 推力刚好赢过体重一点点——这才是聪明的设计。</small>'},
        fast:{tag:'升空，但偏猛', t:'飞是飞起来了，但 TWR 偏大，加速太急、也更费发动机。<small> 能用就行，但 1.2–1.5 更省更稳。</small>'},
        toofast:{tag:'蹿太猛', t:'TWR 太大，火箭像窜天猴一样猛蹿——<b>载荷舱里的鸡蛋碎了</b>。<small> 不算"错"，但是糟糕的设计：又重又贵还压坏货。够用就好。</small>'}
      },
      q:'火箭重 100 吨、一台 Merlin 推力 30 吨，<b>至少几台</b>才能起飞？',
      cA:'3 台（90 吨）', cB:'4 台（120 吨）', cC:'9 台（270 吨）',
      fbA:'❌ 90 吨 < 100 吨，推力还没赢过体重，离不了地。',
      fbB:'✅ 对！120 吨 > 100 吨，TWR=1.2，刚好干净起飞。<b>够用就好。</b>',
      fbC:'⚠️ 半分：270 吨当然能飞，但 9 台又重又贵，还把货压坏。<b>够用就好，不是越多越好。</b>'
    },
    en:{
      title:'TWR Test Bench', titleEn:'举重比赛', lang:'中', back:'← Menu',
      hook:'Musk: thrust must <b>beat weight</b> to leave the ground. That ratio is <b>TWR = total thrust ÷ total weight</b>. Why not just make it 5? Play and you\'ll see. Tune engines and payload to find the sweet spot.',
      twrLbl:'TWR', engLbl:'Merlin engines', payLbl:'Payload',
      launch:'Ignite & Launch!', reset:'Reset',
      eng:(n)=>`${n}`,
      calc:(thrust,weight,twr)=>`Thrust = ${n_val(thrust)}×30 = <b>${thrust} t</b>; weight = 100 + payload = <b>${weight} t</b>; TWR = ${thrust} ÷ ${weight} = <b>${twr.toFixed(2)}</b>.`,
      chip:(b)=>({stuck:'Grounded',hover:'Barely climbs',perfect:'Perfect ✅',fast:'A bit hot',toofast:'Too hot ⚠️'})[b],
      badgeLocked:'Badge locked: tune TWR to 1.2–1.5 for a clean launch (or answer the question) to earn "Thrust Tuner".',
      badgeEarned:'Badge earned: "Thrust Tuner" — TWR just over 1 is enough; too much only means heavier, pricier engines and crushed cargo.',
      v:{
        stuck:{tag:'Just smoke', t:'Thrust is smaller than weight — the rocket <b>doesn\'t budge</b>, just smokes. <b>Another data point.</b><small> The world\'s most expensive firework. Add engines, or cut payload.</small>'},
        hover:{tag:'Climbs then falls back', t:'Barely over 1 — it crawls up, but fuel goes to a <b>"hover tax"</b> and it falls back once empty. <b>Another data point.</b><small> Get TWR above 1.2 for a crisp liftoff.</small>'},
        perfect:{tag:'Clean liftoff 🚀', t:'Beautiful! TWR is in the <b>1.2–1.5</b> sweet spot — clean liftoff, cargo safe.<small> Thrust beats weight by just enough. That\'s smart design.</small>'},
        fast:{tag:'Flies, but hot', t:'It flew, but TWR is high — harsh acceleration and pricier engines.<small> It works, but 1.2–1.5 is cheaper and gentler.</small>'},
        toofast:{tag:'Shot up too hard', t:'TWR way too high — it rockets up like a bottle rocket and <b>the eggs in the payload bay shattered</b>.<small> Not "wrong", but bad design: heavier, pricier, and it crushed the cargo. Enough is enough.</small>'}
      },
      q:'A rocket weighs 100 t, one Merlin gives 30 t of thrust. <b>How many at minimum</b> to lift off?',
      cA:'3 engines (90 t)', cB:'4 engines (120 t)', cC:'9 engines (270 t)',
      fbA:'❌ 90 t < 100 t — thrust doesn\'t beat weight, it stays grounded.',
      fbB:'✅ Right! 120 t > 100 t, TWR=1.2 — a clean liftoff with margin. <b>Just enough.</b>',
      fbC:'⚠️ Half credit: 270 t flies of course, but 9 engines are heavy, costly, and crush the cargo. <b>Enough is enough — more isn\'t better.</b>'
    }
  };
  let lang='zh';
  let engCountRef=4;
  function n_val(){ return engCountRef; }

  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const verdictEl=document.getElementById('verdict');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');
  const twrEl=document.getElementById('twr'), twrChip=document.getElementById('twrChip'), calcEl=document.getElementById('calc');
  const engSlider=document.getElementById('engSlider'), engVal=document.getElementById('engVal'), payVal=document.getElementById('payVal');
  const gmark=document.getElementById('gmark');
  const launchBtn=document.getElementById('launchBtn'), resetBtn=document.getElementById('resetBtn');
  const choicesEl=document.getElementById('choices'), feedbackEl=document.getElementById('feedback');
  const pBtns={0:document.getElementById('pLight'),1:document.getElementById('pMed'),2:document.getElementById('pHeavy')};

  let W=0,H=0,dpr=1; const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random()*0.7,r:Math.random()*1.2+0.2,a:Math.random()*0.6+0.2}); }
    draw();
  }

  // ---------- state ----------
  let engN=4, payI=0, answered=false;
  let rocketY=0, rocketV=0, launching=false, band='perfect', flame=0, shake=0, smoke=[], anim=null;

  function totals(){
    const thrust=engN*THRUST_PER;
    const weight=BASE+PAY[payI];
    const twr=thrust/weight;
    return {thrust,weight,twr};
  }
  function bandOf(twr){
    if(twr<1.0) return 'stuck';
    if(twr<1.2) return 'hover';
    if(twr<=1.5) return 'perfect';
    if(twr<=2.5) return 'fast';
    return 'toofast';
  }

  function reset(){
    launching=false; rocketY=0; rocketV=0; flame=0; shake=0; smoke=[]; anim=null;
    launchBtn.disabled=false; hideVerdict(); renderReadout(); draw();
  }

  function launch(){
    if(launching) return;
    const {twr}=totals(); band=bandOf(twr);
    launching=true; launchBtn.disabled=true; rocketY=0; rocketV=0; flame=1; shake=0; smoke=[];
    hideVerdict();
    anim={t:0, twr, phase:'burn'};
    requestAnimationFrame(loop);
  }

  let lastT=0;
  function loop(now){
    if(!lastT) lastT=now;
    const dt=Math.min(0.03,(now-lastT)/1000); lastT=now;
    if(launching && anim){
      anim.t+=dt;
      // net accel proportional to (TWR-1)*g, real-ish
      const g=9.8; let a=(anim.twr-1)*g;
      if(band==='stuck'){ a=0; shake=Math.sin(anim.t*30)*2; flame=0.3+0.2*Math.random(); }
      else if(band==='hover'){
        if(anim.t<3.2){ rocketV+=a*8*dt; rocketY+=rocketV*dt; flame=0.8; }
        else { // fuel out -> fall back
          rocketV-=g*20*dt; rocketY+=rocketV*dt; flame=0; if(rocketY<0){rocketY=0; endLaunch();}
        }
      } else {
        rocketV+=a*10*dt; rocketY+=rocketV*dt; flame=0.9+0.1*Math.random();
        if(rocketY> (H*1.1)) endLaunch();
        if(anim.t>4.5 && band!=='stuck') endLaunch();
      }
      if(band==='stuck' && anim.t>2.2) endLaunch();
      // smoke
      if(flame>0.1 && Math.random()<0.6) smoke.push({x:(Math.random()-0.5)*30, y:0, r:6+Math.random()*8, life:1});
      for(const s of smoke){ s.y+=20*dt; s.x*=1.01; s.r+=14*dt; s.life-=dt*0.7; }
      smoke=smoke.filter(s=>s.life>0);
    }
    draw();
    if(launching) requestAnimationFrame(loop);
  }

  function endLaunch(){
    launching=false;
    showVerdict(band);
    if(band==='perfect'){ try{ localStorage.setItem('mg.badge.twr-bench','1'); }catch(e){} }
    renderBadge();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#cfe0ff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ground / pad
    const padY=H*0.86;
    ctx.fillStyle='#0a1a2e'; ctx.fillRect(0,padY,W,H-padY);
    ctx.fillStyle='#2b3346'; ctx.fillRect(W/2-40,padY-6,80,10);
    // smoke
    for(const s of smoke){ ctx.globalAlpha=Math.max(0,s.life)*0.6; ctx.fillStyle='#c7ccd3'; ctx.beginPath(); ctx.arc(W/2+s.x, padY-6 - rocketY*0.0 + s.y, s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // rocket
    const rx=W/2, ry=padY-40 - rocketY;
    // flame
    if(flame>0.05){
      const fl=20+flame*40;
      const grd=ctx.createLinearGradient(0,ry+34,0,ry+34+fl);
      grd.addColorStop(0,'#ffd27f'); grd.addColorStop(0.5,'#ff8c42'); grd.addColorStop(1,'rgba(255,90,90,0)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.moveTo(rx-10,ry+34); ctx.lineTo(rx+10,ry+34); ctx.lineTo(rx,ry+34+fl); ctx.closePath(); ctx.fill();
    }
    // body
    ctx.fillStyle='#e6ebf2';
    ctx.beginPath(); ctx.moveTo(rx-11,ry+34); ctx.lineTo(rx-11,ry-20); ctx.quadraticCurveTo(rx,ry-42,rx+11,ry-20); ctx.lineTo(rx+11,ry+34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4aa3ff'; ctx.fillRect(rx-11,ry+2,22,10);
    // fins
    ctx.fillStyle='#c7ccd3';
    ctx.beginPath(); ctx.moveTo(rx-11,ry+22); ctx.lineTo(rx-20,ry+34); ctx.lineTo(rx-11,ry+34); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx+11,ry+22); ctx.lineTo(rx+20,ry+34); ctx.lineTo(rx+11,ry+34); ctx.fill();
    // engine count dots at base
    ctx.fillStyle='#ff8c42';
    for(let i=0;i<engN;i++){ const dx=-9+ (i%5)*4.5; const dy=ry+30-(Math.floor(i/5))*4; ctx.beginPath(); ctx.arc(rx+dx,dy,1.6,0,7); ctx.fill(); }
    ctx.restore();
  }

  // ---------- gauge ----------
  function buildGauge(){
    const g=document.getElementById('gauge');
    // labels at 1.0, 1.2, 1.5, 2.5
    [[1,'1.0'],[1.2,'1.2'],[1.5,'1.5'],[2.5,'2.5']].forEach(([v,l])=>{
      const z=document.createElement('div'); z.className='gzone'; z.style.left=(v/GMAX*100)+'%'; g.appendChild(z);
      const lb=document.createElement('div'); lb.className='glabel'; lb.style.left=(v/GMAX*100)+'%'; lb.textContent=l; g.appendChild(lb);
    });
  }

  function renderReadout(){
    engCountRef=engN;
    const {thrust,weight,twr}=totals();
    twrEl.textContent=twr.toFixed(2);
    const b=bandOf(twr);
    twrChip.textContent=T[lang].chip(b);
    twrChip.className='chip'+(b==='perfect'?' on':'');
    calcEl.innerHTML=T[lang].calc(thrust,weight,twr);
    engVal.textContent=T[lang].eng(engN);
    payVal.textContent=(lang==='zh'?PAYNAME_ZH:PAYNAME_EN)[payI];
    gmark.style.left=Math.min(100,twr/GMAX*100)+'%';
    for(const k in pBtns) pBtns[k].classList.toggle('sel', +k===payI);
  }
  function showVerdict(b){
    const vd=T[lang].v[b];
    const cls=b==='perfect'?'ok':(b==='toofast'||b==='fast')?'half':'bad';
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }
  function renderBadge(){
    const earned=(()=>{ try{ return localStorage.getItem('mg.badge.twr-bench')==='1'; }catch(e){ return false; } })();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }

  // ---------- quiz ----------
  function buildQuiz(){
    const t=T[lang];
    choicesEl.innerHTML=''; feedbackEl.innerHTML='';
    const opts=[['A',t.cA,'wrong',t.fbA],['B',t.cB,'correct',t.fbB],['C',t.cC,'half',t.fbC]];
    opts.forEach(([k,txt,cls,fb])=>{
      const b=document.createElement('button'); b.className='choice';
      b.innerHTML=`<span class="key">${k}</span><span>${txt}</span>`;
      b.addEventListener('click',()=>answerQuiz(cls,fb));
      choicesEl.appendChild(b);
    });
    document.getElementById('q').innerHTML=t.q;
  }
  function answerQuiz(cls,fb){
    if(answered) return; answered=true;
    const map={correct:0,wrong:0,half:0};
    // reveal all: correct green, wrong red, half yellow
    const kids=[...choicesEl.children];
    kids[0].classList.add('wrong'); kids[1].classList.add('correct'); kids[2].classList.add('half');
    feedbackEl.innerHTML=fb;
    if(cls==='correct'){ try{ localStorage.setItem('mg.badge.twr-bench','1'); }catch(e){} renderBadge(); }
  }

  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.getElementById('twrLbl').textContent=t.twrLbl;
    document.getElementById('engLbl').firstElementChild.textContent=t.engLbl;
    document.getElementById('payLbl').firstElementChild.textContent=t.payLbl;
    pBtns[0].textContent=lang==='zh'?'轻':'Light'; pBtns[1].textContent=lang==='zh'?'中':'Med'; pBtns[2].textContent=lang==='zh'?'重':'Heavy';
    launchBtn.textContent=t.launch; resetBtn.textContent=t.reset;
    buildQuiz();
    if(answered){ // relabel handled by rebuild; re-mark
      const kids=[...choicesEl.children];
      // rebuild loses marks; re-answer visual
    }
    document.documentElement.lang=lang;
  }

  engSlider.addEventListener('input',()=>{ engN=+engSlider.value; renderReadout(); if(!launching) draw(); });
  for(const k in pBtns) pBtns[k].addEventListener('click',()=>{ payI=+k; renderReadout(); if(!launching) draw(); });
  launchBtn.addEventListener('click',launch);
  resetBtn.addEventListener('click',reset);
  document.getElementById('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh';
    const wasAnswered=answered; answered=false;
    renderStatic(); renderReadout(); renderBadge(); draw();
  });
  window.addEventListener('resize',resize);

  buildGauge(); renderStatic(); renderReadout(); renderBadge(); resize(); draw();
})();
</script>
</body>
</html>
