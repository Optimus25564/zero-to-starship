<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>自杀式着陆 · Suicide Burn</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific only (not covered by common.css) */
  .hud{position:absolute; left:10px; top:10px; right:10px; display:flex; gap:8px; pointer-events:none;
       font-variant-numeric:tabular-nums}
  .hud .cell{flex:1; background:rgba(8,12,22,.62); border:1px solid var(--line); border-radius:10px;
             padding:6px 8px; backdrop-filter:blur(4px)}
  .hud .lab{font-size:10px; color:var(--muted); letter-spacing:.5px}
  .hud .val{font-size:17px; font-weight:800; color:var(--flame2)}
  .hud .val small{font-size:11px; color:var(--muted); font-weight:600}
  .hud .val.warn{color:var(--bad)}
  .fuelmini{height:5px; border-radius:999px; background:#1b2338; overflow:hidden; margin-top:4px}
  .fuelmini > i{display:block; height:100%; background:linear-gradient(90deg,var(--flame),var(--flame2))}
  /* lateral thruster buttons (3-star) */
  .lat{display:flex; gap:10px; margin-top:10px}
  .lat button{font-size:20px}
  /* compare bar in the recap */
  .cmp{margin-top:8px}
  .cmp .track{position:relative; height:14px; border-radius:999px; background:#1b2338; overflow:hidden}
  .cmp .band{position:absolute; top:0; bottom:0; background:rgba(87,211,140,.55)}
  .cmp .mark{position:absolute; top:-3px; width:3px; height:20px; background:#fff; box-shadow:0 0 6px #fff}
  .cmp .ends{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:3px}
  .starrow{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:10px}
  .starrow .seg{border:1px solid var(--line); background:var(--panel2); border-radius:999px; padding:5px 12px;
                cursor:pointer; color:var(--muted); font-weight:700}
  .starrow .seg.on{color:#1a0d02; background:linear-gradient(90deg,var(--flame),var(--flame2)); border-color:var(--flame)}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">自杀式着陆</h1><span class="en" id="titleEn">Suicide Burn</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud">
      <div class="cell"><div class="lab" id="labAlt">高度 ALT</div><div class="val" id="vAlt">—</div></div>
      <div class="cell"><div class="lab" id="labSpd">速度 SPD</div><div class="val" id="vSpd">—</div></div>
      <div class="cell"><div class="lab" id="labFuel">燃料 FUEL</div><div class="val" id="vFuel">100<small>%</small></div>
        <div class="fuelmini"><i id="fuelBar" style="width:100%"></i></div></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="starrow">
      <span id="modeLabel">难度</span>
      <span class="seg on" id="seg1">★ 有点火带</span>
      <span class="seg" id="seg3">★★★ 无带 + 侧风</span>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">投放</button>
      <button class="ghost" id="retryBtn">重来</button>
    </div>

    <div class="lat hidden" id="latRow">
      <button id="leftBtn">◀ 左推</button>
      <button id="rightBtn">右推 ▶</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  "use strict";
  // ============================================================
  //  REAL 1D hoverslam physics (numeric integration).
  //  y = altitude (m, up +). vy = vertical velocity (m/s, up +; falling = negative).
  //  Engine, once ignited, fires continuously (thrust accel T) until fuel runs out.
  //  You CANNOT hover because T > g. There is a unique ignition altitude h*
  //  where a single continuous burn brings v -> 0 exactly at the deck:
  //     h* = v_ground^2 / (2T),   v_ground^2 = v0^2 + 2 g H
  //  Ignite too high -> stall in mid-air -> fuel runs out -> free fall -> boom.
  //  Ignite too low  -> still moving fast at the deck -> punch through -> boom.
  // ============================================================
  const g   = 9.8;     // m/s^2
  const T   = 22.0;    // m/s^2  thrust acceleration (TWR ~2.2 -> can't hover)
  const H   = 300;     // m  drop-in altitude
  const V0  = 22;      // m/s  downward speed at drop-in (falling)
  const FUEL0 = 7.0;   // s of burn available
  const SOFT  = 13;    // m/s  legs can absorb up to this at touchdown (~47 km/h)
  const H_VIEW = 330;  // m  altitude mapped across the scene height

  const A = T - g;                          // net upward decel while burning
  const V_GROUND = Math.sqrt(V0*V0 + 2*g*H);// speed if it never burned
  const H_STAR = (V_GROUND*V_GROUND)/(2*T); // ideal single-ignition altitude
  const BAND_LO = (SOFT*SOFT)/(2*T);        // soft window BELOW h*
  const BAND_HI = 3;                         // small visual margin above h*
  const DECK_HALF = 26;                      // m half-width of droneship deck (3-star)

  // ---------- i18n ----------
  const T18 = {
    zh:{
      title:'自杀式着陆', titleEn:'Suicide Burn', lang:'EN', back:'← 目录',
      hook:'马斯克：一级正以每小时几百公里砸向海面。发动机<b>最小推力都比空箭还重</b>——没法悬停，只有<b>一次</b>点火机会。点早了空中刹停、点晚了砸穿甲板。算准高度。',
      mode:'难度', s1:'★ 有点火带', s3:'★★★ 无带 + 侧风',
      drop:'投放', igniteBtn:'点火 🔥', retry:'重来',
      labAlt:'高度 ALT', labSpd:'速度 SPD', labFuel:'燃料 FUEL',
      left:'◀ 左推', right:'右推 ▶',
      badgeLocked:'徽章未解锁：稳稳站上「当然我依然爱你号」，即可获得「回收舰长」。',
      badgeEarned:'已获得徽章「回收舰长」——你算准了那一次点火高度。',
      ship:'当然我依然爱你号',
      ready:'点「投放」松手，一级开始下落。盯着高度，在<b>绿色点火带</b>里按「点火」。',
      ready3:'三星模式：没有点火带，还有侧风。用左右推稳住，再自己算高度。',
      resSuccess:{tag:'稳稳站住 🎉', t:(alt)=>`支腿展开，稳稳落在甲板上！你在 <b>${alt} m</b> 点火，速度几乎归零。<small>这就是自杀式着陆——最小推力也比重量大，所以只能算准高度、一次到位。</small>`},
      resEarly:{tag:'点早了 💥', t:(alt)=>`你在 <b>${alt} m</b> 点火——太高了。箭在半空刹停，可发动机停不下来，燃料烧光后又自由落体砸下来。<br><b>点早了。重力可不等人。</b><small> 炸了？很好，又一份数据。看回放，下次点火高度调低一点。</small>`},
      resLate:{tag:'砸穿甲板 💥', t:(alt,kmh)=>`你在 <b>${alt} m</b> 点火——太晚了，没刹住。触地速度还剩 <b>${kmh} km/h</b>……「当然我依然爱你号」要进厂一个月。<small> 炸了？很好，又一份数据。看回放，下次点火高度调高一点。</small>`},
      resNever:{tag:'忘了点火 💥', t:(kmh)=>`一次火都没点，直接砸下来，<b>${kmh} km/h</b>。<small> 炸了？很好，又一份数据。下次盯着绿色点火带按「点火」。</small>`},
      resOff:{tag:'被吹偏了 💥', t:(alt)=>`点火高度还行（${alt} m），但侧风把你吹出了甲板边缘。<small> 炸了？很好，又一份数据。多用左右推顶住风。</small>`},
      cmpBand:'建议点火带', cmpYou:'你的点火', cmpNone:'没点火',
      windTag:'侧风'
    },
    en:{
      title:'Suicide Burn', titleEn:'自杀式着陆', lang:'中', back:'← Menu',
      hook:"Musk: the booster is slamming down at hundreds of km/h. The engine's <b>minimum thrust outweighs the empty rocket</b> — it can't hover. You get <b>one</b> ignition. Too early: it stalls in the air. Too late: it punches through the deck. Nail the altitude.",
      mode:'Mode', s1:'★ ignition band', s3:'★★★ no band + wind',
      drop:'DROP', igniteBtn:'IGNITE 🔥', retry:'Retry',
      labAlt:'ALT', labSpd:'SPD', labFuel:'FUEL',
      left:'◀ thrust', right:'thrust ▶',
      badgeLocked:'Badge locked: stick the landing on "Of Course I Still Love You" to earn "Landing Captain".',
      badgeEarned:'Badge earned: "Landing Captain" — you nailed the ignition altitude.',
      ship:'Of Course I Still Love You',
      ready:'Tap DROP to release the booster. Watch the altitude and hit IGNITE inside the <b>green band</b>.',
      ready3:'3-star: no band, plus crosswind. Use left/right thrust to hold center, and judge the altitude yourself.',
      resSuccess:{tag:'Stuck the landing 🎉', t:(alt)=>`Legs out, planted on the deck! You ignited at <b>${alt} m</b> and velocity hit almost zero.<small> That's a suicide burn — even minimum thrust beats the weight, so you can't hover; you time one perfect ignition.</small>`},
      resEarly:{tag:'Too early 💥', t:(alt)=>`You ignited at <b>${alt} m</b> — too high. It stalled in mid-air, but the engine can't stop, burned out, and free-fell back down.<br><b>Too early. Gravity doesn't wait.</b><small> Boom? Good — another data point. Watch the replay; ignite a bit lower next time.</small>`},
      resLate:{tag:'Punched the deck 💥', t:(alt,kmh)=>`You ignited at <b>${alt} m</b> — too late to stop. Touchdown speed still <b>${kmh} km/h</b>… "Of Course I Still Love You" needs a month in the shop.<small> Boom? Good — another data point. Ignite a bit higher next time.</small>`},
      resNever:{tag:'Forgot to ignite 💥', t:(kmh)=>`Never lit the engine — straight down at <b>${kmh} km/h</b>.<small> Boom? Good — another data point. Watch the green band and hit IGNITE.</small>`},
      resOff:{tag:'Blown off 💥', t:(alt)=>`Ignition altitude was fine (${alt} m), but the crosswind pushed you off the deck edge.<small> Boom? Good — another data point. Lean on the side thrusters against the wind.</small>`},
      cmpBand:'suggested band', cmpYou:'you ignited', cmpNone:'no ignition',
      windTag:'wind'
    }
  };
  let lang = 'zh';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const canvas=$('c'), ctx=canvas.getContext('2d');
  const verdictEl=$('verdict'), badgeEl=$('badge'), badgeText=$('badgeText');
  const fireBtn=$('fireBtn'), retryBtn=$('retryBtn');
  const vAlt=$('vAlt'), vSpd=$('vSpd'), vFuel=$('vFuel'), fuelBar=$('fuelBar');
  const seg1=$('seg1'), seg3=$('seg3'), latRow=$('latRow'), leftBtn=$('leftBtn'), rightBtn=$('rightBtn');

  // ---------- persisted badge ----------
  let earned = false;
  try{ earned = localStorage.getItem('mg.badge.suicide-burn')==='1'; }catch(e){}

  // ---------- canvas sizing ----------
  let W=0,H2=0,dpr=1; const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H2=rect.height;
    canvas.width=W*dpr; canvas.height=H2*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){ for(let i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random()*0.7,r:Math.random()*1.2+0.2,a:Math.random()*0.6+0.2}); }
    draw();
  }

  // ---------- scene geometry ----------
  // altitude 0..H_VIEW mapped to a vertical band; deck sits at y=0.
  function groundPx(){ return H2*0.90; }             // deck top on screen
  function pxPerM(){ return (groundPx()-H2*0.06)/H_VIEW; }
  function altToPy(y){ return groundPx() - y*pxPerM(); }
  const BOOSTER_M = 40;                                // drawn height in meters
  function xToPx(x){ return W/2 + x*pxPerM(); }        // lateral (3-star)

  // ---------- state ----------
  let mode = 1;                 // 1 or 3 stars
  let state = 'ready';          // ready | live | done
  let y, vy, x, vx, fuel, engineOn, ignitionAlt, stalled, windAcc, userThrust, result;
  let lastT = 0, shake = 0, puffs = [];

  function reset(keepMode){
    state='ready';
    y=H; vy=-V0; x=0; vx=0; fuel=FUEL0; engineOn=false; ignitionAlt=null; stalled=false; result=null;
    userThrust=0; puffs=[]; shake=0;
    // wind for 3-star: a steady breeze + slight bias, randomized per drop
    windAcc = mode===3 ? (Math.random()<0.5?-1:1)*(2.2+Math.random()*1.6) : 0;
    fireBtn.textContent = T18[lang].drop; fireBtn.className='fire'; fireBtn.disabled=false;
    hideVerdict();
    updateHUD();
    draw();
  }

  // ---------- physics ----------
  function integrate(h){
    let a = -g;
    if(engineOn && fuel>0){ a += T; fuel -= h; if(fuel<0) fuel=0; }
    vy += a*h;
    y  += vy*h;
    if(engineOn && vy>=0 && y>3) stalled=true;   // stopped / rising while still airborne
    if(mode===3){
      const ax = windAcc + userThrust*14;        // side thrust accel
      vx += ax*h;
      x  += vx*h;
    }
  }
  function timeScaleAt(){
    let ts = 0.72;
    const d = Math.abs(y - H_STAR);
    if(mode===1 && d<70){ ts = 0.10 + (0.72-0.10)*(d/70); }   // bullet-time near the band (star 1)
    if(mode===3 && y<120){ ts = Math.max(0.16, 0.16 + (0.6)*((y-0)/120)); } // slow near ground
    if(engineOn) ts = Math.min(ts, 0.34);                     // keep the landing burn watchable
    return ts;
  }

  function tick(now){
    if(!lastT) lastT=now;
    let dtReal = Math.min(0.05,(now-lastT)/1000); lastT=now;
    if(state==='live'){
      let simT = dtReal*timeScaleAt();
      while(simT>0 && state==='live'){
        const h=Math.min(0.004,simT); integrate(h); simT-=h;
        if(engineOn && fuel<=0){ engineOn=false; }
        if(y<=0){ y=0; touchdown(); break; }
      }
      // engine plume puffs
      if(engineOn && Math.random()<0.6) spawnPuff();
      updateHUD();
    }
    for(const p of puffs){ p.life-=dtReal; p.r+=p.gr*dtReal; }
    puffs=puffs.filter(p=>p.life>0);
    if(shake>0) shake=Math.max(0,shake-dtReal*2.4);
    draw();
    requestAnimationFrame(tick);
  }

  function spawnPuff(){
    const py=altToPy(y), px=xToPx(x);
    puffs.push({x:px+(Math.random()-0.5)*8, y:py+BOOSTER_M*pxPerM()+4, r:3+Math.random()*3,
                gr:26, life:0.5+Math.random()*0.3});
  }

  function touchdown(){
    state='done';
    const kmh = Math.round(Math.abs(vy)*3.6);
    const alt = ignitionAlt==null ? null : Math.round(ignitionAlt);
    const off = mode===3 && Math.abs(x)>DECK_HALF;
    if(ignitionAlt==null){ result={k:'never',kmh}; boom(); }
    else if(off){ result={k:'off',alt}; boom(); }
    else if(Math.abs(vy)<=SOFT && !stalled){ result={k:'ok',alt}; land(); }
    else if(stalled){ result={k:'early',alt}; boom(); }
    else { result={k:'late',alt,kmh}; boom(); }
    fireBtn.disabled=true;
    showVerdict();
    if(result.k==='ok'){
      earned=true;
      try{ localStorage.setItem('mg.badge.suicide-burn','1'); }catch(e){}
      renderBadge();
    }
  }
  function land(){ // gentle dust
    for(let i=0;i<10;i++){ const ang=Math.PI+ (Math.random()-0.5)*1.2;
      puffs.push({x:xToPx(x)+Math.cos(ang)*14, y:groundPx()-2, r:3, gr:30, life:0.7+Math.random()*0.4}); }
  }
  function boom(){
    shake=1;
    const py=altToPy(y), px=xToPx(x);
    for(let i=0;i<26;i++){ const a=Math.random()*7, sp=30+Math.random()*90;
      puffs.push({x:px, y:py, r:4+Math.random()*6, gr:sp, life:0.6+Math.random()*0.5, boom:true, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp}); }
  }

  // ---------- ignition ----------
  function drop(){
    if(state!=='ready') return;
    state='live'; lastT=0;
    fireBtn.textContent = T18[lang].igniteBtn; fireBtn.className='fire';
  }
  function ignite(){
    if(state!=='live' || engineOn || ignitionAlt!=null) return;
    engineOn=true; ignitionAlt=y;
    fireBtn.disabled=true;
    shake=Math.max(shake,0.4);
  }
  function onFire(){
    if(state==='ready') drop();
    else if(state==='live') ignite();
  }

  // ---------- drawing ----------
  function draw(){
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*10*shake,(Math.random()-0.5)*10*shake); }
    ctx.clearRect(-20,-20,W+40,H2+40);
    // sky
    const sky=ctx.createLinearGradient(0,0,0,groundPx());
    sky.addColorStop(0,'#05070f'); sky.addColorStop(0.55,'#0a1326'); sky.addColorStop(1,'#12243f');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundPx());
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H2,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ignition band (star 1)
    if(mode===1){
      const yTop=altToPy(H_STAR+BAND_HI), yBot=altToPy(H_STAR-BAND_LO);
      ctx.fillStyle='rgba(87,211,140,.16)'; ctx.fillRect(0,yTop,W,yBot-yTop);
      ctx.strokeStyle='rgba(87,211,140,.6)'; ctx.setLineDash([7,6]); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(0,yTop); ctx.lineTo(W,yTop); ctx.moveTo(0,yBot); ctx.lineTo(W,yBot); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(87,211,140,.9)'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
      ctx.fillText('点火带 / ignition band', 8, yTop-5);
    }
    drawOcean();
    drawShip();
    if(state!=='done' || (result&&result.k==='ok')) drawBooster();
    drawPuffs();
    // wind arrow (3-star)
    if(mode===3 && state!=='done'){
      const dir=windAcc>0?1:-1, wx=W-46, wy=44;
      ctx.strokeStyle='rgba(74,163,255,.8)'; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(wx-dir*16,wy); ctx.lineTo(wx+dir*16,wy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx+dir*16,wy); ctx.lineTo(wx+dir*8,wy-5); ctx.lineTo(wx+dir*8,wy+5); ctx.closePath();
      ctx.fillStyle='rgba(74,163,255,.8)'; ctx.fill();
      ctx.fillStyle='rgba(74,163,255,.9)'; ctx.font='10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(T18[lang].windTag, wx, wy-10);
    }
    ctx.restore();
  }
  function drawOcean(){
    const gy=groundPx();
    const oc=ctx.createLinearGradient(0,gy,0,H2);
    oc.addColorStop(0,'#12243f'); oc.addColorStop(1,'#081627');
    ctx.fillStyle=oc; ctx.fillRect(0,gy,W,H2-gy);
    ctx.strokeStyle='rgba(74,163,255,.18)'; ctx.lineWidth=1;
    for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(0,gy+i*7); ctx.lineTo(W,gy+i*7); ctx.stroke(); }
  }
  function drawShip(){
    const gy=groundPx(), cxs=W/2, halfPx=DECK_HALF*pxPerM();
    const dw=Math.max(halfPx*2, W*0.5), dh=Math.max(12, H2*0.03);
    // barge
    ctx.fillStyle='#20252e'; ctx.fillRect(cxs-dw/2, gy, dw, dh);
    ctx.fillStyle='#2b3440'; ctx.fillRect(cxs-dw/2, gy, dw, 3);
    // hazard stripes edges
    ctx.fillStyle='#3a4250';
    ctx.fillRect(cxs-dw/2, gy, 8, dh); ctx.fillRect(cxs+dw/2-8, gy, 8, dh);
    // landing X
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cxs-12,gy+3); ctx.lineTo(cxs+12,gy+3); ctx.moveTo(cxs+12-24,gy+3);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cxs-10,gy+2); ctx.lineTo(cxs+10,gy+2); ctx.stroke();
    // draw a circle+X target
    ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(cxs,gy+3,10,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cxs-7,gy-4); ctx.lineTo(cxs+7,gy+9); ctx.moveTo(cxs+7,gy-4); ctx.lineTo(cxs-7,gy+9); ctx.stroke();
    // ship name
    ctx.fillStyle='rgba(139,160,180,.85)'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(T18[lang].ship, cxs, gy+dh-3);
  }
  function drawBooster(){
    const w = 15, py=altToPy(y), px=xToPx(x);
    const hpx=BOOSTER_M*pxPerM(), top=py, bot=py+hpx;
    ctx.save(); ctx.translate(px,0);
    // engine flame (down) while burning
    if(engineOn && fuel>0){
      const fl=18+Math.random()*10;
      const fg=ctx.createLinearGradient(0,bot,0,bot+fl);
      fg.addColorStop(0,'#fff'); fg.addColorStop(0.4,'#ffd27f'); fg.addColorStop(1,'rgba(255,140,66,0)');
      ctx.fillStyle=fg; ctx.beginPath();
      ctx.moveTo(-6,bot); ctx.lineTo(6,bot); ctx.lineTo(0,bot+fl); ctx.closePath(); ctx.fill();
    }
    // body
    ctx.fillStyle='#d7dbe2'; ctx.fillRect(-w/2, top, w, hpx);
    ctx.fillStyle='#b8bec8'; ctx.fillRect(-w/2, top, 3, hpx);
    // interstage / top (black)
    ctx.fillStyle='#1a1d24'; ctx.fillRect(-w/2, top, w, hpx*0.16);
    // grid fins (deployed) near top
    ctx.fillStyle='#8a909c';
    ctx.fillRect(-w/2-5, top+hpx*0.2, 5, 7); ctx.fillRect(w/2, top+hpx*0.2, 5, 7);
    // landing legs: fold out on success touchdown
    const legOut = (state==='done' && result && result.k==='ok') ? 1 : (engineOn?0.25:0);
    if(legOut>0){
      ctx.strokeStyle='#9aa1ad'; ctx.lineWidth=2.5;
      const lx=w/2, ly=bot, len=10+legOut*8;
      ctx.beginPath(); ctx.moveTo(-lx,ly-2); ctx.lineTo(-lx-len,ly+len*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx,ly-2);  ctx.lineTo(lx+len,ly+len*0.7);  ctx.stroke();
    }
    ctx.restore();
  }
  function drawPuffs(){
    for(const p of puffs){
      if(p.boom){ p.x+=p.vx*0.016; p.y+=p.vy*0.016; }
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
      ctx.fillStyle=p.boom?(Math.random()<0.5?'#ffd27f':'#ff8c42'):'rgba(210,220,230,0.7)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // ---------- HUD ----------
  function updateHUD(){
    vAlt.innerHTML = Math.max(0,Math.round(y)) + '<small> m</small>';
    const kmh=Math.round(Math.abs(vy)*3.6);
    vSpd.innerHTML = kmh + '<small> km/h</small>';
    vSpd.className = 'val' + (kmh>SOFT*3.6 && y<H_STAR*0.7 ? ' warn':'');
    const pct=Math.round(fuel/FUEL0*100);
    vFuel.innerHTML = pct + '<small>%</small>';
    fuelBar.style.width = pct+'%';
  }

  // ---------- verdict + compare bar ----------
  function showVerdict(){
    const t=T18[lang]; let cls, tag, body;
    if(result.k==='ok'){ cls='ok'; tag=t.resSuccess.tag; body=t.resSuccess.t(result.alt); }
    else if(result.k==='early'){ cls='bad'; tag=t.resEarly.tag; body=t.resEarly.t(result.alt); }
    else if(result.k==='late'){ cls='bad'; tag=t.resLate.tag; body=t.resLate.t(result.alt,result.kmh); }
    else if(result.k==='never'){ cls='bad'; tag=t.resNever.tag; body=t.resNever.t(result.kmh); }
    else { cls='bad'; tag=t.resOff.tag; body=t.resOff.t(result.alt); }
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML = `<span class="tag">${tag}</span>${body}` + compareBar();
  }
  function compareBar(){
    const t=T18[lang];
    const lo=Math.max(0,H_STAR-BAND_LO), hi=H_STAR+BAND_HI, span=H_VIEW;
    const bandL=(lo/span)*100, bandW=((hi-lo)/span)*100;
    const you = ignitionAlt==null ? null : (Math.min(ignitionAlt,span)/span)*100;
    return `<div class="cmp"><div class="track">
      <div class="band" style="left:${bandL}%;width:${Math.max(1,bandW)}%"></div>
      ${you==null?'':`<div class="mark" style="left:${you}%"></div>`}
    </div><div class="ends"><span>0 m</span><span style="color:var(--ok)">${t.cmpBand} ≈ ${Math.round(H_STAR)} m</span>
      <span>${you==null?t.cmpNone:t.cmpYou+' '+Math.round(ignitionAlt)+' m'}</span><span>${H_VIEW} m</span></div></div>`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ---------- badge ----------
  function renderBadge(){
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T18[lang].badgeEarned : T18[lang].badgeLocked;
  }

  // ---------- lang / static ----------
  function renderStatic(){
    const t=T18[lang];
    $('title').textContent=t.title; $('titleEn').textContent=t.titleEn;
    $('langBtn').textContent=t.lang; $('back').textContent=t.back;
    $('hook').innerHTML=t.hook;
    $('modeLabel').textContent=t.mode; seg1.textContent=t.s1; seg3.textContent=t.s3;
    $('labAlt').textContent=t.labAlt; $('labSpd').textContent=t.labSpd; $('labFuel').textContent=t.labFuel;
    leftBtn.textContent=t.left; rightBtn.textContent=t.right; retryBtn.textContent=t.retry;
    if(state==='ready') fireBtn.textContent=t.drop;
    else if(state==='live' && !engineOn) fireBtn.textContent=t.igniteBtn;
    document.documentElement.lang=lang;
    renderBadge();
    if(state==='done') showVerdict();
  }

  // ---------- events ----------
  fireBtn.addEventListener('click', onFire);
  retryBtn.addEventListener('click', ()=>reset());
  seg1.addEventListener('click', ()=>{ if(mode===1)return; mode=1; seg1.classList.add('on'); seg3.classList.remove('on'); latRow.classList.add('hidden'); reset(); });
  seg3.addEventListener('click', ()=>{ if(mode===3)return; mode=3; seg3.classList.add('on'); seg1.classList.remove('on'); latRow.classList.remove('hidden'); reset(); });
  function holdBtn(btn,dir){
    const on=e=>{ e.preventDefault(); userThrust=dir; };
    const off=e=>{ e.preventDefault(); if(userThrust===dir) userThrust=0; };
    btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off);
    btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off);
  }
  holdBtn(leftBtn,-1); holdBtn(rightBtn,1);
  // spacebar = fire (desktop convenience)
  window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); onFire(); } });
  $('langBtn').addEventListener('click', ()=>{ lang=lang==='zh'?'en':'zh'; renderStatic(); updateHUD(); draw(); });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic();
  reset();
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
