<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>回收四部曲 · Recovery Sequence</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific bits common.css doesn't cover */
  .dots{display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap}
  .dot{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
       border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:var(--panel2)}
  .dot .n{width:18px; height:18px; border-radius:50%; background:#20283e; display:grid; place-items:center;
          font-size:11px; font-weight:700; color:var(--muted)}
  .dot.active{border-color:var(--flame); color:var(--flame2)}
  .dot.active .n{background:var(--flame); color:#1a0d02}
  .dot.done{border-color:var(--ok); color:var(--ink)}
  .dot.done .n{background:var(--ok); color:#04140a}
  .card.fact{margin-top:12px; border-color:var(--ok); background:rgba(87,211,140,.08)}
  .card.fact h3{color:var(--ok)}
  .card.fact .lbl{font-size:11px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase}
  .feedback .meme{display:block; margin-top:6px; color:var(--flame2); font-weight:600}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">回收四部曲</h1><span class="en" id="titleEn">Recovery Sequence</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="dots" id="dots"></div>
    <p class="q" id="q"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="card fact hidden" id="fact"></div>
    <div class="buttons" id="endBtns" style="display:none">
      <button class="ghost" id="restart"></button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ================= i18n =================
  const T = {

      qLabel:'第 {n} 步 · 下一步做什么？',

      restart:'再飞一次',

      winBody:'稳稳落在无人船上——腿撑住、扬起一阵尘土，<b>不是爆炸</b>。这一级还能再飞。',

          fact:{title:'为什么现在掉头？', body:'掉头要在高空、空气稀薄的时候做，这样几乎不费力气就能把火箭转过身来。'},
          options:[
            {id:'boostback', label:'调头点火（Boostback）：掉转方向，朝发射场点火'},

            parachute:'降落伞？这可是几十吨的钢铁，不是圣诞礼物。伞根本拉不住它。',

        },
        { correct:'entry',
          q:'火箭已经掉头，正朝地面加速下落，前面就是浓浓的大气层。',
          ok:'对！先刹一脚，别让空气把它烧了。',
          fact:{title:'为什么再入前先点火？', body:'再入大气层前先点火减速——不然又快又猛的空气摩擦会把火箭烧坏，就像一颗流星。'},
          options:[

          wrong:{
            fins:'太早了！这么快还在真空边上，栅格舵没多少空气可抓，先减速要紧。',
            nothing:'什么都不做？以这个速度冲进大气层，摩擦生热会把它烧成一颗流星。',
            parachute:'又是降落伞？速度太快，伞一张开就会被撕碎。'

        { correct:'fins',
          q:'再入点火完成，火箭穿过大气层往下掉，需要精准对准无人船。',
          ok:'对！钛合金栅格舵伸出来掌舵。',
          fact:{title:'栅格舵的小历史', body:'栅格舵最早用铝做，早期任务里被气动加热烧坏过；后来改成钛合金，能扛高温、还不用隔热罩。'},
          options:[
            {id:'fins',      label:'张开栅格舵（Grid fins）：用它掌舵、滑向落点'},
            {id:'landing',   label:'现在就点火着陆'},
            {id:'boostback', label:'再来一次调头点火'},
            {id:'nothing',   label:'什么都不做，直直往下掉'}
          ],
          wrong:{
            landing:'太早了！这么高就点火，燃料会提前烧光，最后一段反而没得用。先用栅格舵滑准。',
            boostback:'已经掉过头啦，再调一次只会把方向搞乱。',
            nothing:'什么都不做？没有栅格舵掌舵，风一吹它就偏出无人船，掉进海里。'
          }
        },
        { correct:'landing',
          q:'火箭对准了无人船，离甲板越来越近。这是最后一步。',
          ok:'对！算准高度，最后一下点火刹停。',
          fact:{title:'为什么不能悬停？', body:'发动机最小推力都比空火箭还猛，所以它没法悬停——只能算准高度，快到地面才点火，一次刹停。这招叫「自杀式着陆 / hoverslam」。'},
          options:[
            {id:'landing',   label:'着陆点火（Landing burn）：算准高度，快到甲板才点火，一次刹停'},
            {id:'parachute', label:'打开降落伞软着陆'},
            {id:'freefall',  label:'关掉发动机，自由落体'},
            {id:'nothing',   label:'什么都不做，赌它自己停下'}
          ],
          wrong:{
            parachute:'降落伞第三次登场——还是不行。它太重太快，只有发动机能稳稳刹住。',
            freefall:'关发动机自由落体？那它会像一块几十吨的铁砸在甲板上。',
            nothing:'什么都不做？火箭可不会自己停下——牛顿第一定律了解一下。'
          }
        }
      ]
    },
    en: {
      title:'Recovery Sequence', titleEn:'回收四部曲', lang:'中', back:'← Menu',
      hook:'Musk: The old way — after launch the first stage <b>splashed into the sea, scrapped</b>. Like blowing up your taxi after the ride. It has to <b>fly itself home</b>.',
      qLabel:'Step {n} · What\'s the next step?',
      meme:'Boom? Another data point.',
      restart:'Fly again',
      factLabel:'Fun fact',
      badgeLocked:'Badge locked: complete the recovery sequence in order to earn "Recovery Navigator".',
      badgeEarned:'Badge earned: "Recovery Navigator" — boostback → entry → grid fins → landing, all in order.',
      winTag:'Recovered 🚀',
      winBody:'Locked onto the droneship — legs down, a puff of dust, <b>no boom</b>. This booster flies again.',
      dotNames:['Boostback','Entry','Grid fins','Landing'],
      steps:[
        { correct:'boostback',
          q:'The booster just separated from the upper stage and is still coasting up high.',
          ok:'Yes! High up where the air is thin is the easy place to flip.',
          fact:{title:'Why turn around now?', body:'You flip high up where the air is thin — up there it takes almost no effort to spin the booster around.'},
          options:[
            {id:'boostback', label:'Boostback burn: flip around and fire back toward the launch site'},
            {id:'parachute', label:'Pop a parachute and drift down'},
            {id:'payload',   label:'Open the payload bay and release the satellite'},
            {id:'nothing',   label:'Do nothing, let it fall on its own'}
          ],
          wrong:{
            parachute:'A parachute? This is tens of tons of steel, not a Christmas gift — a chute can\'t hold it.',
            payload:'The payload rides on the upper stage, not this one. This booster is empty — nothing to release.',
            nothing:'Do nothing? It\'ll sail right past the launch site with all that sideways speed and splash into the sea.'
          }
        },
        { correct:'entry',
          q:'The booster has flipped and is falling back, speeding toward the thick atmosphere ahead.',
          ok:'Right! Tap the brakes so the air doesn\'t cook it.',
          fact:{title:'Why burn before re-entry?', body:'Firing to slow down first keeps the booster from burning up — plow in too fast and air friction would roast it like a meteor.'},
          options:[
            {id:'entry',     label:'Entry burn: fire the engines to slow down before hitting the thick air'},
            {id:'fins',      label:'Deploy the grid fins right now'},
            {id:'nothing',   label:'Do nothing, let it plow into the atmosphere'},
            {id:'parachute', label:'Pop a parachute to slow down'}
          ],
          wrong:{
            fins:'Too early! It\'s still near-vacuum and going way too fast — the fins have almost no air to grab yet. Slow down first.',
            nothing:'Do nothing? At this speed the air friction would turn it into a shooting star.',
            parachute:'The parachute again? At this speed it\'d be shredded the instant it opened.'
          }
        },
        { correct:'fins',
          q:'Entry burn done. The booster is dropping through the air and needs to aim precisely at the droneship.',
          ok:'Yes! The titanium grid fins swing out to steer.',
          fact:{title:'A bit of grid-fin history', body:'The grid fins were aluminum at first and overheated — some caught fire on early flights. SpaceX switched to titanium, which takes the heat with no heat shield needed.'},
          options:[
            {id:'fins',      label:'Deploy grid fins: steer and glide toward the target'},
            {id:'landing',   label:'Fire the landing burn right now'},
            {id:'boostback', label:'Do another boostback burn'},
            {id:'nothing',   label:'Do nothing, just drop straight down'}
          ],
          wrong:{
            landing:'Too soon! Burn this high and you\'ll run the tank dry before the ground. Steer with the fins first.',
            boostback:'You already flipped around — flipping again just scrambles your heading.',
            nothing:'Do nothing? With no fins to steer, a gust nudges it off the droneship and into the ocean.'
          }
        },
        { correct:'landing',
          q:'Lined up over the droneship, deck coming up fast. This is the final step.',
          ok:'Yes! Time the height and brake in one shot.',
          fact:{title:'Why can\'t it hover?', body:'Even at lowest throttle the engine pushes harder than the empty booster weighs, so it can\'t hover. It must time the height and fire late, stopping right at the deck — a "hoverslam" (suicide burn).'},
          options:[
            {id:'landing',   label:'Landing burn: time it right, fire just before the deck and stop in one go'},
            {id:'parachute', label:'Pop a parachute for a soft landing'},
            {id:'freefall',  label:'Cut the engines and free-fall'},
            {id:'nothing',   label:'Do nothing, hope it stops itself'}
          ],
          wrong:{
            parachute:'The parachute, take three — still no. Too heavy, too fast; only the engine can brake it cleanly.',
            freefall:'Cut engines and free-fall? It\'ll hit the deck like tens of tons of dropped iron.',
            nothing:'Do nothing? A booster won\'t stop on its own — meet Newton\'s first law.'
          }
        }
      ]
    }
  };
  let lang = 'zh';

  // ================= DOM =================
  const canvas   = document.getElementById('c');
  const ctx      = canvas.getContext('2d');
  const dotsEl   = document.getElementById('dots');
  const qEl      = document.getElementById('q');
  const choicesEl= document.getElementById('choices');
  const feedbackEl=document.getElementById('feedback');
  const factEl   = document.getElementById('fact');
  const endBtns  = document.getElementById('endBtns');
  const restartBtn=document.getElementById('restart');
  const verdictEl= document.getElementById('verdict');
  const badgeEl  = document.getElementById('badge');
  const badgeText= document.getElementById('badgeText');

  // ================= badge =================
  const GAME_ID = 'recovery-steps';
  function isEarned(){ try{ return localStorage.getItem('mg.badge.'+GAME_ID)==='1'; }catch(e){ return false; } }
  function earnBadge(){ try{ localStorage.setItem('mg.badge.'+GAME_ID,'1'); }catch(e){} }

  // ================= canvas sizing =================
  let W=0,H=0,dpr=1, BW=0,BH=0, padX=0, deckTopY=0, waterY=0;
  const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    BH=H*0.155; BW=BH*0.20;
    padX=W*0.5; deckTopY=H*0.80; waterY=H*0.85;
    if(stars.length===0){
      for(let i=0;i<130;i++) stars.push({x:Math.random(), y:Math.random()*0.78, r:Math.random()*1.2+0.2,
        a:Math.random()*0.6+0.25, ph:Math.random()*6.28});
    }
  }

  // ================= booster + scene state =================
  const boo={ bx:0, by:0, angle:0, flame:0, finExt:0, legExt:0 };
  const dust=[];
  function initScene(){
    boo.bx=W*0.70; boo.by=H*0.20; boo.angle=0.42; boo.flame=0; boo.finExt=0; boo.legExt=0;
    dust.length=0;
  }

  // ================= tween engine (draw loop is separate) =================
  const easeInOut=t=> t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const easeOut  =t=> 1-(1-t)*(1-t);
  const easeIn   =t=> t*t;
  function tween(obj, target, dur, ease){
    ease=ease||easeInOut;
    return new Promise(res=>{
      const start={}; for(const k in target) start[k]=obj[k];
      const t0=performance.now();
      function frame(now){
        let p=Math.min(1,(now-t0)/dur); const e=ease(p);
        for(const k in target) obj[k]=start[k]+(target[k]-start[k])*e;
        if(p<1) requestAnimationFrame(frame); else res();
      }
      requestAnimationFrame(frame);
    });
  }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function spawnDust(x,y){
    for(let i=0;i<34;i++){
      const a=(Math.random()*Math.PI) - Math.PI; // spread sideways/up
      const sp=1+Math.random()*2.6;
      dust.push({ x, y, vx:Math.cos(a)*sp*(Math.random()<.5?-1:1)*1.4, vy:-Math.abs(Math.sin(a))*sp*0.7-0.3,
        life:0, max:40+Math.random()*40, r:BW*(0.5+Math.random()*1.3) });
    }
  }
  function updateDust(){
    for(let i=dust.length-1;i>=0;i--){
      const d=dust[i]; d.life++; d.x+=d.vx; d.y+=d.vy; d.vy+=0.06; d.vx*=0.98;
      if(d.life>d.max) dust.splice(i,1);
    }
  }

  // ================= step animations (watchable, eased) =================
  async function runBoostback(){
    await tween(boo,{flame:1},400,easeOut);
    await tween(boo,{angle:-0.46},1800,easeInOut);           // flip / turn around
    await tween(boo,{bx:padX, by:H*0.34},2200,easeInOut);    // burn back over the pad
    await tween(boo,{flame:0},500,easeIn);
    await Promise.all([ tween(boo,{angle:0},1200,easeInOut), tween(boo,{by:H*0.36},1400,easeIn) ]);
  }
  async function runEntry(){
    await tween(boo,{flame:0.95},400,easeOut);
    await tween(boo,{by:H*0.58},3000,easeInOut);             // slow decel through upper air
    await tween(boo,{flame:0},500,easeIn);
  }
  async function runFins(){
    await Promise.all([
      tween(boo,{finExt:1},1500,easeOut),                    // titanium fins swing out
      (async()=>{ await tween(boo,{by:H*0.66},1300,easeInOut);
                  await tween(boo,{angle:0.05},600,easeInOut);
                  await tween(boo,{angle:0, by:H*0.72},1100,easeInOut); })()
    ]);
  }
  async function runLanding(){
    await tween(boo,{flame:1},400,easeOut);
    await Promise.all([
      tween(boo,{by:deckTopY},3200,easeOut),
      (async()=>{ await wait(700); await tween(boo,{legExt:1},1400,easeOut); })()
    ]);
    spawnDust(boo.bx, deckTopY);
    await tween(boo,{flame:0},500,easeIn);
    await tween(boo,{by:deckTopY+H*0.006},220,easeOut);      // tiny settle
    await tween(boo,{by:deckTopY},220,easeOut);
  }
  const RUN=[runBoostback,runEntry,runFins,runLanding];

  // ================= game state =================
  const state={ stepIdx:0, phase:'await', wrongId:null, feedbackKind:null,
                order:[], factStep:-1, done:false };
  function shuffle(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function goToStep(i){
    state.stepIdx=i; state.phase='await'; state.wrongId=null; state.feedbackKind=null;
    if(!state.order[i]) state.order[i]=shuffle(T.zh.steps[i].options.length);
    renderPanel();
  }

  async function onChoice(id){
    if(state.phase!=='await') return;
    const s=T[lang].steps[state.stepIdx];
    if(id===s.correct){
      state.phase='anim'; state.wrongId=null; state.feedbackKind='ok'; state.factStep=state.stepIdx;
      renderPanel();
      await RUN[state.stepIdx]();
      if(state.stepIdx<3){ goToStep(state.stepIdx+1); }
      else finish();
    } else {
      state.wrongId=id; state.feedbackKind='wrong';
      renderPanel();
    }
  }

  function finish(){
    state.phase='done'; state.done=true;
    earnBadge();
    showVerdict();
    endBtns.style.display='';
    renderPanel(); renderBadge();
  }

  function restart(){
    state.stepIdx=0; state.phase='await'; state.wrongId=null; state.feedbackKind=null;
    state.factStep=-1; state.done=false; state.order=[];
    endBtns.style.display='none';
    verdictEl.className='verdict';
    initScene();
    goToStep(0);
  }

  // ================= rendering =================
  function renderDots(){
    const t=T[lang]; dotsEl.innerHTML='';
    for(let i=0;i<4;i++){
      const el=document.createElement('div'); el.className='dot';
      if(state.done || i<state.stepIdx || (i===state.stepIdx && state.phase!=='await')) el.classList.add('done');
      else if(i===state.stepIdx) el.classList.add('active');
      el.innerHTML='<span class="n">'+(i+1)+'</span>'+t.dotNames[i];
      dotsEl.appendChild(el);
    }
  }

  function renderChoices(){
    const s=T[lang].steps[state.stepIdx];
    const order=state.order[state.stepIdx]||shuffle(s.options.length);
    choicesEl.innerHTML='';
    const keys=['A','B','C','D'];
    order.forEach((origIdx,pos)=>{
      const opt=s.options[origIdx];
      const b=document.createElement('button');
      b.className='choice'; b.type='button';
      const decided = state.phase!=='await';
      if(decided && opt.id===s.correct) b.classList.add('correct');
      if(opt.id===state.wrongId) b.classList.add('wrong');
      if(decided) b.disabled=true;
      b.innerHTML='<span class="key">'+keys[pos]+'</span><span>'+opt.label+'</span>';
      b.addEventListener('click', ()=>onChoice(opt.id));
      choicesEl.appendChild(b);
    });
  }

  function renderFeedback(){
    const t=T[lang], s=T[lang].steps[state.stepIdx];
    if(state.feedbackKind==='wrong' && state.wrongId){
      feedbackEl.innerHTML='<b>'+s.wrong[state.wrongId]+'</b><span class="meme">'+t.meme+'</span>';
    } else if(state.feedbackKind==='ok'){
      feedbackEl.innerHTML='<b>'+s.ok+'</b>';
    } else if(state.done){
      feedbackEl.innerHTML='';
    } else {
      feedbackEl.innerHTML='';
    }
  }

  function renderFact(){
    const t=T[lang];
    if(state.factStep>=0){
      const f=T[lang].steps[state.factStep].fact;
      factEl.className='card fact';
      factEl.innerHTML='<div class="lbl">'+t.factLabel+'</div><h3>'+f.title+'</h3>'+f.body;
    } else {
      factEl.className='card fact hidden'; factEl.innerHTML='';
    }
  }

  function renderPanel(){
    const t=T[lang];
    const s=T[lang].steps[state.stepIdx];
    qEl.innerHTML = '<b>'+t.qLabel.replace('{n}', state.stepIdx+1)+'</b><br>'+s.q;
    renderDots();
    renderChoices();
    renderFeedback();
    renderFact();
    restartBtn.textContent=t.restart;
  }

  function showVerdict(){
    const t=T[lang];
    verdictEl.className='verdict show ok';
    verdictEl.innerHTML='<span class="tag">'+t.winTag+'</span>'+t.winBody;
  }

  function renderBadge(){
    const earned=isEarned();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  function renderHeader(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.documentElement.lang=lang;
  }

  function renderAll(){
    renderHeader();
    renderPanel();
    renderBadge();
    if(state.done) showVerdict();
  }

  // ================= draw loop =================
  let perf=0;
  function drawSky(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#04060e');
    g.addColorStop(0.45,'#081026');
    g.addColorStop(0.72,'#123454');
    g.addColorStop(0.82,'#1d4a6e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  function drawStars(){
    for(const s of stars){
      const a=s.a*(0.55+0.45*Math.sin(perf/700+s.ph));
      ctx.globalAlpha=Math.max(0,a); ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function drawOcean(){
    const g=ctx.createLinearGradient(0,waterY,0,H);
    g.addColorStop(0,'#0e3352'); g.addColorStop(1,'#061626');
    ctx.fillStyle=g; ctx.fillRect(0,waterY,W,H-waterY);
    ctx.strokeStyle='rgba(120,180,220,.18)'; ctx.lineWidth=1.5;
    for(let k=0;k<3;k++){
      const yy=waterY+8+k*10;
      ctx.beginPath();
      for(let x=0;x<=W;x+=8){ const y=yy+Math.sin(x/26+perf/900+k)*2.2; if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.stroke();
    }
  }
  function drawShip(){
    const dw=W*0.42, dh=H*0.05, x=padX-dw/2, y=deckTopY;
    ctx.fillStyle='#181d26'; ctx.fillRect(x-6,y+dh,dw+12,H-(y+dh));
    ctx.fillStyle='#3a3f48'; ctx.fillRect(x,y,dw,dh);
    ctx.fillStyle='#c9a227';
    for(let i=0;i<dw;i+=16){ ctx.fillRect(x+i,y,8,4); ctx.fillRect(x+i,y+dh-4,8,4); }
    const cy=y+dh*0.55, rr=dw*0.15;
    ctx.strokeStyle='#e6ebf2'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(padX,cy,rr,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(padX-rr*0.66,cy-rr*0.66); ctx.lineTo(padX+rr*0.66,cy+rr*0.66);
    ctx.moveTo(padX+rr*0.66,cy-rr*0.66); ctx.lineTo(padX-rr*0.66,cy+rr*0.66);
    ctx.stroke();
  }
  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function drawFlame(f){
    const L=BH*0.9*f*(0.75+Math.random()*0.28), w=BW*0.85;
    const g=ctx.createLinearGradient(0,0,0,L);
    g.addColorStop(0,'rgba(255,214,130,0.95)');
    g.addColorStop(0.5,'rgba(255,140,66,0.9)');
    g.addColorStop(1,'rgba(255,90,30,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(-w,0); ctx.quadraticCurveTo(-w*0.3,L*0.6,0,L);
    ctx.quadraticCurveTo(w*0.3,L*0.6,w,0); ctx.closePath(); ctx.fill();
    const L2=L*0.55, w2=w*0.5;
    ctx.fillStyle='rgba(255,255,225,0.92)';
    ctx.beginPath(); ctx.moveTo(-w2,0); ctx.quadraticCurveTo(0,L2*0.7,0,L2); ctx.quadraticCurveTo(0,L2*0.7,w2,0); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.globalAlpha=0.45*f; ctx.shadowColor='#ff8c42'; ctx.shadowBlur=20;
    ctx.fillStyle='rgba(255,140,66,0.4)'; ctx.beginPath(); ctx.arc(0,L*0.2,w*1.1,0,7); ctx.fill(); ctx.restore();
  }
  function drawLegs(f){
    const w=BW,h=BH, hy=-h*0.16;
    for(const s of [-1,1]){
      const hx=s*w*0.45;
      const sfx=s*w*0.5, sfy=-h*0.5;                 // stowed (along body)
      const dfx=s*(w*0.5+h*0.34), dfy=h*0.03;        // deployed (out & down)
      const fx=sfx+(dfx-sfx)*f, fy=sfy+(dfy-sfy)*f;
      ctx.strokeStyle='#3a4150'; ctx.lineWidth=Math.max(3,w*0.30); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(fx,fy); ctx.stroke();
      if(f>0.35){ ctx.fillStyle='#2a3040'; ctx.beginPath(); ctx.arc(fx,fy,w*0.34,0,7); ctx.fill(); }
    }
  }
  function drawFins(f){
    const w=BW,h=BH, y=-h*0.80, out=w*1.1*f+w*0.12, fh=h*0.09;
    for(const s of [-1,1]){
      const x0=s*w/2;
      const rx=s<0?x0-out:x0;
      ctx.fillStyle='#9aa0aa'; ctx.fillRect(rx,y-fh/2,out,fh);
      ctx.strokeStyle='rgba(35,40,52,0.75)'; ctx.lineWidth=1;
      for(let i=1;i<4;i++){ const xx=x0+s*out*i/4; ctx.beginPath(); ctx.moveTo(xx,y-fh/2); ctx.lineTo(xx,y+fh/2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(Math.min(x0,rx+ (s<0?0:out)),y); ctx.lineTo(Math.max(x0,rx+out),y); ctx.stroke();
    }
  }
  function drawBody(){
    const w=BW,h=BH;
    const g=ctx.createLinearGradient(-w/2,0,w/2,0);
    g.addColorStop(0,'#eaeef3'); g.addColorStop(0.5,'#c7ccd3'); g.addColorStop(1,'#868d97');
    roundRectPath(-w/2,-h,w,h,w*0.28); ctx.fillStyle=g; ctx.fill();
    // interstage (black composite) at top
    ctx.fillStyle='#171b22'; roundRectPath(-w/2,-h,w,h*0.11,w*0.28); ctx.fill();
    // engine band at bottom
    ctx.fillStyle='#6b7280'; ctx.fillRect(-w/2,-h*0.05,w,h*0.05);
    // logo stripe
    ctx.fillStyle='#2b3450'; ctx.fillRect(-w*0.12,-h*0.55,w*0.24,h*0.02);
  }
  function drawBooster(){
    const bob = state.phase==='await' ? Math.sin(perf/620)*2.4 : 0;
    ctx.save();
    ctx.translate(boo.bx, boo.by+bob);
    ctx.rotate(boo.angle);
    if(boo.flame>0.01) drawFlame(boo.flame);
    drawLegs(boo.legExt);
    drawBody();
    drawFins(boo.finExt);
    ctx.restore();
  }
  function drawDust(){
    for(const d of dust){
      const a=Math.max(0,1-d.life/d.max);
      ctx.globalAlpha=a*0.6; ctx.fillStyle='#c9cdd3';
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawSky(); drawStars(); drawOcean(); drawShip();
    drawBooster(); drawDust();
  }
  function loop(now){ perf=now; updateDust(); draw(); requestAnimationFrame(loop); }

  // ================= events =================
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh'; renderAll();
  });
  restartBtn.addEventListener('click', restart);
  window.addEventListener('resize', resize);

  // ================= init =================
  resize();
  initScene();
  state.order[0]=shuffle(T.zh.steps[0].options.length);
  renderAll();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
