<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>滑板扔球 · Skateboard Throw</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">滑板扔球</h1><span class="en" id="titleEn">Skateboard Throw</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage wide">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="spd">0.0</span><span class="unit" id="spdUnit">m/s（向左）</span>
      <span class="chip" id="ballChip">🎾 ×5</span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="timeLbl">时间 Time</span><span id="timeVal">12.0 s</span></div>
        <div class="mbar"><div class="mfill blue" id="timeFill" style="width:100%"></div></div>
      </div>
    </div>

    <div class="sliderrow">
      <label id="throwLbl"><span>扔球速度 Throw speed</span><b id="throwVal">9 m/s</b></label>
      <div class="sliderwrap">
        <input type="range" id="slider" min="3" max="15" step="1" value="9" />
      </div>
    </div>

    <div class="buttons">
      <button class="fire" id="throwBtn">扔！</button>
      <button class="ghost" id="resetBtn">重来</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- real physics constants ----------
  const PERSON_M = 30;    // kg (a kid on a board)
  const BALL_M   = 2;     // kg per ball
  const BALLS0   = 5;
  const WORLD_W  = 15;    // metres across the ice
  const START_X  = 13.5;  // skater starts near the right
  const FINISH_X = 1.5;   // finish line on the left
  const TIME_LIMIT = 12;  // seconds to cross

  // ---------- i18n ----------
  const T = {
    zh:{
      title:'滑板扔球', titleEn:'Skateboard Throw', lang:'EN', back:'← 目录',
      hook:'马斯克：想往前走？就往<b>反方向</b>扔东西。扔得越重越快，你退得越猛。站在滑冰上（没有摩擦），你手里有 5 个球——把它们扔向右边，看看自己能被"推"多快到左边的终点。',
      spdUnit:'m/s（向左）', throwLbl:'扔球速度 Throw speed', throw:'扔！', reset:'重来',
      timeLbl:'时间 Time',
      analogy:(v,left)=>`火箭就是这么飞的：把燃气使劲往后喷，火箭就往前冲。你现在的退速 <b>${v.toFixed(2)}</b> m/s，还剩 <b>${left}</b> 个球。`,
      ballChip:(n)=>`🎾 ×${n}`,
      badgeLocked:'徽章未解锁：滑过左边的终点线，即可获得「反作用力大师」。',
      badgeEarned:'已获得徽章「反作用力大师」——把球往右扔，人就往左走。这就是反作用力。',
      win:{tag:'冲线成功 🛼', t:'漂亮！你一个球都没碰到终点，却被球"推"过了线。<b>动量守恒</b>：球往右带走的动量，正好等于你往左得到的。<small> 火箭一辈子只会这一招。</small>'},
      slow:{tag:'没到线', t:'没扔够劲，滑不到终点。<b>又一份数据。</b><small> 试试把"扔球速度"调大，或者把 5 个球都用上——扔得越猛，你退得越快。</small>'},
      out:{tag:'球扔光了', t:'5 个球全扔完了，可你退得太慢，时间到还没过线。<b>又一份数据。</b><small> 每个球能给你的速度 = 球重×扔速÷你的体重。想快，就得扔得更猛。</small>'}
    },
    en:{
      title:'Skateboard Throw', titleEn:'滑板扔球', lang:'中', back:'← Menu',
      hook:'Musk: Want to move forward? Throw stuff the <b>other way</b>. Heavier and faster you throw, the harder you kick back. You\'re on frictionless ice with 5 balls — hurl them right, and get pushed to the finish line on the left.',
      spdUnit:'m/s (leftward)', throwLbl:'Throw speed', throw:'Throw!', reset:'Reset',
      timeLbl:'Time',
      analogy:(v,left)=>`This is exactly how rockets fly: blast gas backward, rocket goes forward. Your recoil speed is <b>${v.toFixed(2)}</b> m/s, <b>${left}</b> balls left.`,
      ballChip:(n)=>`🎾 ×${n}`,
      badgeLocked:'Badge locked: slide across the finish line on the left to earn "Reaction Master".',
      badgeEarned:'Badge earned: "Reaction Master" — throw the ball right, you go left. That\'s reaction force.',
      win:{tag:'Crossed! 🛼', t:'Nice! You never touched the line — the balls pushed you across it. <b>Momentum is conserved</b>: the momentum the balls carry right equals what you gain going left.<small> Rockets know only this one trick.</small>'},
      slow:{tag:'Short of the line', t:'Not enough oomph, you didn\'t reach the line. <b>Another data point.</b><small> Turn up the throw speed, or use all 5 balls — throw harder, kick back faster.</small>'},
      out:{tag:'Out of balls', t:'All 5 balls gone, but you were too slow and time ran out. <b>Another data point.</b><small> Speed from each ball = ball mass × throw speed ÷ your mass. Throw harder.</small>'}
    }
  };
  let lang='zh';

  // ---------- DOM ----------
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const slider=document.getElementById('slider');
  const spdEl=document.getElementById('spd'), spdUnitEl=document.getElementById('spdUnit');
  const ballChipEl=document.getElementById('ballChip');
  const analogyEl=document.getElementById('analogy');
  const throwBtn=document.getElementById('throwBtn'), resetBtn=document.getElementById('resetBtn');
  const throwVal=document.getElementById('throwVal');
  const timeFill=document.getElementById('timeFill'), timeVal=document.getElementById('timeVal');
  const verdictEl=document.getElementById('verdict');
  const badgeEl=document.getElementById('badge'), badgeText=document.getElementById('badgeText');

  // ---------- canvas sizing ----------
  let W=0,H=0,dpr=1, groundY=0, mpp=1; // metres->px
  const stars=[];
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    mpp = W / WORLD_W;
    groundY = H*0.72;
    if(stars.length===0){ for(let i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random()*0.6,r:Math.random()*1.2+0.2,a:Math.random()*0.6+0.2}); }
    draw();
  }
  const px=(xm)=> xm*mpp;

  // ---------- state ----------
  let v=0;              // recoil speed (m/s), leftward positive
  let xm=START_X;       // skater position (metres from left)
  let balls=BALLS0;
  let running=false, elapsed=0, lastT=0;
  let outcome=null;     // 'win' | 'slow' | 'out'
  let flying=[];        // thrown balls {x,y,vx,vy,t}
  let recoil=0;         // visual lurch

  function reset(){
    v=0; xm=START_X; balls=BALLS0; running=false; elapsed=0; outcome=null; flying=[]; recoil=0;
    throwBtn.disabled=false;
    hideVerdict(); renderReadout(); draw();
  }

  // ---------- throw ----------
  function doThrow(){
    if(outcome) return;
    if(balls<=0) return;
    const throwSpeed=+slider.value;                 // m/s, ball thrown rightward
    // conservation of momentum: personV gains ballMass*throwSpeed/personMass
    v += BALL_M*throwSpeed/PERSON_M;
    balls--;
    recoil=1;
    // spawn a visual flying ball from the skater's hand, arcing right
    flying.push({x:xm, y:0, vx:throwSpeed, vy:5.5, t:0});
    if(!running){ running=true; lastT=performance.now(); requestAnimationFrame(loop); }
    renderReadout();
  }

  // ---------- main loop ----------
  function loop(now){
    const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
    if(running && !outcome){
      elapsed+=dt;
      xm -= v*dt;                                    // frictionless glide left
      recoil*=Math.pow(0.001,dt);                    // decay lurch
      // update flying balls (simple parabola, just visual)
      for(const b of flying){ b.t+=dt; b.x+=b.vx*dt; b.y+= (b.vy - 4.9*b.t)*dt; }
      flying=flying.filter(b=> b.x<WORLD_W+2 && b.y>-3);
      // outcomes
      if(xm<=FINISH_X){ xm=FINISH_X; finish('win'); }
      else if(elapsed>=TIME_LIMIT){ finish(v<0.05?'slow':(balls<=0?'out':'slow')); }
    }
    draw();
    if(running && !outcome) requestAnimationFrame(loop);
  }

  function finish(o){
    outcome=o; running=false; throwBtn.disabled=true;
    if(o==='win'){ try{ localStorage.setItem('mg.badge.throw-balls','1'); }catch(e){} }
    showVerdict(o); renderBadge();
  }

  // ---------- drawing ----------
  function draw(){
    ctx.clearRect(0,0,W,H);
    // sky
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#cfe0ff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // ice
    const g=ctx.createLinearGradient(0,groundY,0,H);
    g.addColorStop(0,'#183a5a'); g.addColorStop(1,'#0a1a2e');
    ctx.fillStyle=g; ctx.fillRect(0,groundY,W,H-groundY);
    ctx.strokeStyle='rgba(180,220,255,.25)'; ctx.lineWidth=1;
    for(let i=1;i<8;i++){ const y=groundY+(H-groundY)*i/8; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // finish line + flag (left)
    const fx=px(FINISH_X);
    ctx.strokeStyle='#57d38c'; ctx.setLineDash([8,6]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx,groundY-70); ctx.lineTo(fx,groundY+6); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#57d38c'; ctx.beginPath(); ctx.moveTo(fx,groundY-70); ctx.lineTo(fx+26,groundY-62); ctx.lineTo(fx,groundY-54); ctx.fill();
    ctx.font='11px sans-serif'; ctx.fillStyle='#9fe6bf'; ctx.textAlign='left';
    ctx.fillText(lang==='zh'?'终点':'FINISH', fx+4, groundY-40);
    // flying balls
    for(const b of flying){
      const bx=px(b.x), by=groundY-24-b.y*mpp*0.35;
      ctx.fillStyle='#ffd27f'; ctx.beginPath(); ctx.arc(bx,by,6,0,7); ctx.fill();
      ctx.strokeStyle='#c98a2e'; ctx.lineWidth=1; ctx.stroke();
    }
    drawSkater();
  }

  function drawSkater(){
    const bx=px(xm) - recoil*8;   // lurch right a touch when throwing
    const by=groundY-4;
    // skateboard
    ctx.fillStyle='#c7ccd3'; ctx.beginPath(); ctx.roundRect(bx-22,by-6,44,6,3); ctx.fill();
    ctx.fillStyle='#2b303a'; ctx.beginPath(); ctx.arc(bx-14,by+2,4,0,7); ctx.arc(bx+14,by+2,4,0,7); ctx.fill();
    // body
    ctx.strokeStyle='#ff8c42'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by-8); ctx.lineTo(bx,by-34); ctx.stroke();
    // arm reaching right (to throw)
    ctx.beginPath(); ctx.moveTo(bx,by-28); ctx.lineTo(bx+16+recoil*8,by-30-recoil*6); ctx.stroke();
    // legs
    ctx.beginPath(); ctx.moveTo(bx,by-8); ctx.lineTo(bx-10,by-2); ctx.moveTo(bx,by-8); ctx.lineTo(bx+8,by-2); ctx.stroke();
    // head
    ctx.fillStyle='#ffd27f'; ctx.beginPath(); ctx.arc(bx,by-42,9,0,7); ctx.fill();
    // held balls indicator
    for(let i=0;i<balls;i++){ ctx.fillStyle='#ffd27f'; ctx.beginPath(); ctx.arc(bx-16-i*7,by-20,3,0,7); ctx.fill(); }
    // speed arrow (left) when moving
    if(v>0.02){
      ctx.strokeStyle='rgba(74,163,255,.9)'; ctx.lineWidth=3;
      const L=Math.min(60,10+v*40);
      ctx.beginPath(); ctx.moveTo(bx-14,by-50); ctx.lineTo(bx-14-L,by-50); ctx.stroke();
      ctx.fillStyle='rgba(74,163,255,.9)'; ctx.beginPath();
      ctx.moveTo(bx-14-L,by-50); ctx.lineTo(bx-6-L,by-54); ctx.lineTo(bx-6-L,by-46); ctx.fill();
    }
  }

  // ---------- readout / verdict / badge ----------
  function renderReadout(){
    spdEl.textContent=v.toFixed(2);
    spdUnitEl.textContent=T[lang].spdUnit;
    ballChipEl.textContent=T[lang].ballChip(balls);
    throwVal.textContent=slider.value+' m/s';
    analogyEl.innerHTML=T[lang].analogy(v,balls);
    const frac=Math.max(0,(TIME_LIMIT-elapsed)/TIME_LIMIT);
    timeFill.style.width=(frac*100)+'%';
    timeFill.className='mfill '+(frac<0.25?'bad':'blue');
    timeVal.textContent=Math.max(0,(TIME_LIMIT-elapsed)).toFixed(1)+' s';
  }
  function showVerdict(o){
    const vd=T[lang][o]; const cls=o==='win'?'ok':'bad';
    verdictEl.className='verdict show '+cls;
    verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${vd.t}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }
  function renderBadge(){
    const earned=(()=>{ try{ return localStorage.getItem('mg.badge.throw-balls')==='1'; }catch(e){ return false; } })();
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent=earned?T[lang].badgeEarned:T[lang].badgeLocked;
  }

  // ---------- static text ----------
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    document.getElementById('throwLbl').firstElementChild.textContent = lang==='zh'?'扔球速度 Throw speed':'Throw speed';
    document.getElementById('timeLbl').textContent=t.timeLbl;
    throwBtn.textContent=t.throw; resetBtn.textContent=t.reset;
    document.documentElement.lang=lang;
  }

  // ---------- events ----------
  slider.addEventListener('input',()=>{ renderReadout(); });
  throwBtn.addEventListener('click',doThrow);
  resetBtn.addEventListener('click',reset);
  document.getElementById('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh';
    renderStatic(); renderReadout(); if(outcome) showVerdict(outcome); renderBadge();
  });
  window.addEventListener('resize',resize);

  // ---------- init ----------
  renderStatic(); renderReadout(); renderBadge(); resize();
})();
</script>
</body>
</html>
