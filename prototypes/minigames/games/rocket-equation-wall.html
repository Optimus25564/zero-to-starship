<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>撞墙实验 · The Math Wall</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific extras only */
  .musk{max-width:640px; width:100%; margin-top:12px; display:none; gap:12px;
        padding:14px 16px; border-radius:16px; border:1px solid var(--flame);
        background:linear-gradient(180deg,rgba(255,140,66,.14),rgba(255,140,66,.05))}
  .musk.show{display:flex}
  .musk .face{flex:0 0 42px; height:42px; border-radius:50%; font-size:26px; display:grid; place-items:center;
              background:#20283e; border:1px solid var(--line)}
  .musk .say{font-size:14px; line-height:1.5}
  .musk .say b{color:var(--flame2)}
  .teaser{margin-top:10px}
  .teaser a{display:inline-block; text-decoration:none; font-size:13px; font-weight:700; color:#1a0d02;
            background:linear-gradient(180deg,#ff9a4d,#e5651a); border-radius:999px; padding:9px 16px}
  .stars{font-size:14px}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">撞墙实验</h1><span class="en" id="titleEn">The Math Wall</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="dv">0.0</span><span class="unit">km/s</span>
      <span class="chip" id="goalChip"></span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="sliderrow">
      <label><span id="fuelLbl">燃料量</span><b><span id="fuelVal">300</span> t</b></label>
      <div class="sliderwrap">
        <input type="range" id="slider" min="0" max="1500" step="10" value="300" />
      </div>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">发射！</button>
      <button class="ghost" id="resetBtn">重置</button>
    </div>
  </div>

  <div class="musk" id="musk">
    <div class="face">🧑‍🚀</div>
    <div>
      <div class="say" id="muskSay"></div>
      <div class="teaser"><a href="staging.html" id="teaserLink"></a></div>
    </div>
  </div>

  <div class="panel">
    <p class="q" id="qText"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- rocket-equation model (single stage, "unlimited budget") ----------
  const VE   = 3400;     // m/s effective exhaust velocity
  const MPAY = 20;       // tons payload (small but not negligible)
  const KTANK= 0.08;     // tank dry mass = 8% of fuel mass (tanks scale WITH fuel!)
  const GOAL = 9.4;      // km/s to reach orbit
  // Δv(fuel) in km/s.  m0 = payload + fuel + tank ; m1 = payload + tank
  function dvOf(fuel){
    const m0 = MPAY + fuel + KTANK*fuel;
    const m1 = MPAY + KTANK*fuel;
    return VE*Math.log(m0/m1)/1000;
  }
  const CAP = VE*Math.log((1+KTANK)/KTANK)/1000; // asymptote as fuel→∞ ≈ 8.85 km/s < 9.4

  const MAX_PLOT_FUEL = 2500;   // chart x-axis (past the slider, to show the plateau)
  const MAX_PLOT_DV   = 10;     // chart y-axis km/s

  // ---------- i18n ----------
  const T = {
    zh:{
      title:'撞墙实验', titleEn:'The Math Wall', lang:'EN', back:'← 目录',
      hook:'马斯克：今天你会撞上火箭工程<b>最硬的一堵墙</b>。给你无限预算，就一节火箭。目标——冲到入轨速度 <b>9.4 km/s</b>。先自己去撞，撞完我再解释。',
      fuel:'燃料量', fire:'发射！', reset:'重置',
      goalChip:'目标 9.4 km/s',
      analogy:(dv)=>`现在的最终速度 <b>${dv.toFixed(1)}</b> km/s。入轨要 <b>9.4</b>（约等于 30 倍步枪子弹，北京到上海只要 2 分钟）。`,
      axisFuel:'燃料 (吨)', axisDv:'最终速度 (km/s)', wallLabel:'← 这堵墙', orbitLine:'入轨线 9.4',
      curveLabel:'燃料–速度曲线',
      muskSay:'停。看这条<b>趴下的曲线</b>——这堵墙叫<b>数学</b>。明天车间见，我带了个新工具。',
      teaser:'下一关：甩掉包袱（分级）→',
      qText:'燃料从 100 吨加到 200 吨，最终速度会——',
      choices:[
        {k:'A', txt:'翻倍', correct:false},
        {k:'B', txt:'只增加一小截', correct:true},
      ],
      fbWrong:'不对。你看曲线——它越来越平。',
      fbRight:(a,b)=>`对！100 吨 → <b>${a.toFixed(1)}</b>，200 吨 → <b>${b.toFixed(1)}</b>，只多了一小截。新加的燃料还要花力气运<b>旧燃料</b>——这就是对数的残酷。`,
      badgeLocked:'徽章未解锁：亲自撞两次这堵墙，即可获得「撞墙勇士」。',
      badgeEarned:'已获得徽章「撞墙勇士」——你亲手证明了：一节火箭，加再多燃料也翻不过 9.4。',
      v:{
        far:{tag:'砸回海里', t:'推力用光，火箭划个弧就砸回海里，离 9.4 还差得远。'},
        mid:{tag:'越加越吃力', t:'曲线开始趴下了——多加的燃料只换来一点点速度，还是够不着 9.4。'},
        near:{tag:'撞上天花板', t:'燃料快加满了，可曲线彻底躺平，就是撞不破 9.4 那道天花板。'},
        meme:'<br><small>炸了？又一份数据。 / Boom? Another data point.</small>'
      }
    },
    en:{
      title:'The Math Wall', titleEn:'撞墙实验', lang:'中', back:'← Menu',
      hook:"Musk: today you'll hit <b>the hardest wall in rocketry</b>. Unlimited budget, one single-stage rocket. Goal — reach orbital speed <b>9.4 km/s</b>. Go crash into it first; I'll explain after.",
      fuel:'Fuel', fire:'LAUNCH!', reset:'Reset',
      goalChip:'Goal 9.4 km/s',
      analogy:(dv)=>`Final speed now <b>${dv.toFixed(1)}</b> km/s. Orbit needs <b>9.4</b> (≈ 30× a rifle bullet; Beijing→Shanghai in 2 min).`,
      axisFuel:'Fuel (tons)', axisDv:'Final speed (km/s)', wallLabel:'← the wall', orbitLine:'orbit line 9.4',
      curveLabel:'fuel–speed curve',
      muskSay:'Stop. Look at that <b>curve flattening out</b> — this wall is called <b>MATH</b>. See you at the workshop tomorrow; I\'m bringing a new tool.',
      teaser:'Next: Drop the Deadweight (staging) →',
      qText:'Add fuel from 100 tons to 200 tons — the final speed will…',
      choices:[
        {k:'A', txt:'Double', correct:false},
        {k:'B', txt:'Only rise a little', correct:true},
      ],
      fbWrong:'Nope. Look at the curve — it keeps flattening.',
      fbRight:(a,b)=>`Right! 100 t → <b>${a.toFixed(1)}</b>, 200 t → <b>${b.toFixed(1)}</b> — just a little more. The new fuel has to carry the <b>old fuel</b> too. That\'s the cruelty of the logarithm.`,
      badgeLocked:'Badge locked: crash into this wall yourself twice to earn "Wall Crasher".',
      badgeEarned:'Badge earned: "Wall Crasher" — you proved it by hand: one stage can never clear 9.4, no matter the fuel.',
      v:{
        far:{tag:'Fell to the sea', t:'Thrust runs out, the rocket arcs back into the sea — nowhere near 9.4.'},
        mid:{tag:'Diminishing returns', t:'The curve is bending over — extra fuel buys tiny extra speed. Still short of 9.4.'},
        near:{tag:'Hit the ceiling', t:'Tanks almost full, but the curve is dead flat. It just can\'t break the 9.4 ceiling.'},
        meme:'<br><small>炸了？又一份数据。 / Boom? Another data point.</small>'
      }
    }
  };
  let lang='zh';

  // ---------- DOM ----------
  const $=id=>document.getElementById(id);
  const canvas=$('c'), ctx=canvas.getContext('2d');
  const slider=$('slider'), dvEl=$('dv'), fuelVal=$('fuelVal'), analogyEl=$('analogy');
  const fireBtn=$('fireBtn'), resetBtn=$('resetBtn'), verdictEl=$('verdict');
  const muskEl=$('musk'), badgeEl=$('badge'), badgeText=$('badgeText');

  // ---------- state ----------
  let fuel=300, attempts=0, earned=false, anim=null, quizDone=false;
  try{ earned = localStorage.getItem('mg.badge.rocket-equation-wall')==='1'; }catch(e){}

  // ---------- canvas sizing ----------
  let W=0,H=0,dpr=1, PL={l:46,r:16,t:26,b:36};
  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=rect.width; H=rect.height;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  const px=f=>PL.l + (f/MAX_PLOT_FUEL)*(W-PL.l-PL.r);
  const py=dv=>PL.t + (1-dv/MAX_PLOT_DV)*(H-PL.t-PL.b);

  // ---------- drawing ----------
  function draw(){
    const t=T[lang];
    ctx.clearRect(0,0,W,H);
    // frame bg
    const x0=PL.l, y0=PL.t, x1=W-PL.r, y1=H-PL.b;
    // grid
    ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
    for(let g=0;g<=MAX_PLOT_DV;g+=2){ const y=py(g); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); }
    // axes
    ctx.strokeStyle='rgba(160,190,230,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); ctx.lineTo(x1,y1); ctx.stroke();
    // y ticks
    ctx.fillStyle='var(--muted)'; ctx.fillStyle='#8ba0b4'; ctx.font='10px -apple-system,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let g=0;g<=MAX_PLOT_DV;g+=2){ ctx.fillText(String(g), x0-6, py(g)); }
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(let f=0;f<=MAX_PLOT_FUEL;f+=500){ ctx.fillText(String(f), px(f), y1+5); }
    // axis labels
    ctx.textAlign='center'; ctx.fillStyle='#8ba0b4'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText(t.axisFuel, (x0+x1)/2, H-14);
    ctx.save(); ctx.translate(12,(y0+y1)/2); ctx.rotate(-Math.PI/2); ctx.fillText(t.axisDv,0,0); ctx.restore();

    // shaded "wall" gap between curve-cap and goal line
    ctx.fillStyle='rgba(255,90,90,.08)';
    ctx.beginPath();
    ctx.moveTo(x0, py(GOAL));
    ctx.lineTo(x1, py(GOAL));
    for(let f=MAX_PLOT_FUEL; f>=0; f-=40){ ctx.lineTo(px(f), py(dvOf(f))); }
    ctx.closePath(); ctx.fill();

    // goal line 9.4 (red dashed)
    ctx.strokeStyle='#ff6a6a'; ctx.setLineDash([6,5]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x0,py(GOAL)); ctx.lineTo(x1,py(GOAL)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ff9b9b'; ctx.font='bold 11px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(t.orbitLine, x0+6, py(GOAL)-3);

    // the fuel-speed curve (flame), flattening
    ctx.strokeStyle='#ff8c42'; ctx.lineWidth=2.6; ctx.lineJoin='round';
    ctx.beginPath();
    for(let f=0;f<=MAX_PLOT_FUEL;f+=20){ const X=px(f),Y=py(dvOf(f)); f===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y); }
    ctx.stroke();
    // "the wall" label near flat part
    ctx.fillStyle='#ffd27f'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(t.wallLabel, px(MAX_PLOT_FUEL*0.62)+4, py(dvOf(MAX_PLOT_FUEL*0.62))-14);

    // current fuel marker on curve
    const curDv=dvOf(fuel);
    const mx=px(fuel), myOnCurve=py(curDv);
    ctx.strokeStyle='rgba(255,210,127,.5)'; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(mx,y1); ctx.lineTo(mx,myOnCurve); ctx.stroke(); ctx.setLineDash([]);

    // the rocket: rises from x-axis at current fuel up to its Δv height, bonks the curve ceiling
    const p = anim ? anim.p : 1;
    const ry = y1 + (myOnCurve - y1)*p;
    drawRocket(mx, ry, anim && anim.phase==='boom' ? anim.boom : 0);

    // dot on curve
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mx,myOnCurve,4,0,7); ctx.fill();
    ctx.fillStyle='#ffd27f'; ctx.font='bold 12px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(curDv.toFixed(1), mx, myOnCurve-8);
  }

  function drawRocket(x,y,boom){
    if(boom>0){
      // cartoon splash/puff
      const R=6+boom*46;
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-boom);
      const g=ctx.createRadialGradient(x,y,2,x,y,R);
      g.addColorStop(0,'#fff'); g.addColorStop(.4,'#ffd27f'); g.addColorStop(.8,'#ff8c42'); g.addColorStop(1,'rgba(255,140,66,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(x,y);
    // flame while rising
    if(anim && anim.phase==='up'){
      ctx.fillStyle='#ff8c42'; ctx.globalAlpha=.9;
      ctx.beginPath(); ctx.moveTo(-4,10); ctx.lineTo(4,10); ctx.lineTo(0,10+12+Math.random()*8); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }
    // body
    ctx.fillStyle='#e6ebf2';
    ctx.beginPath();
    ctx.moveTo(0,-14); ctx.lineTo(5,-4); ctx.lineTo(5,10); ctx.lineTo(-5,10); ctx.lineTo(-5,-4); ctx.closePath(); ctx.fill();
    // nose
    ctx.fillStyle='#ff8c42'; ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(5,-4); ctx.lineTo(-5,-4); ctx.closePath(); ctx.fill();
    // fins
    ctx.fillStyle='#8ba0b4';
    ctx.beginPath(); ctx.moveTo(-5,10); ctx.lineTo(-9,14); ctx.lineTo(-5,4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,10); ctx.lineTo(9,14); ctx.lineTo(5,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- launch animation ----------
  function fire(){
    if(anim) return;
    hideVerdict();
    const dv=dvOf(fuel);
    anim={p:0, phase:'up', boom:0};
    fireBtn.disabled=true; slider.disabled=true;
    const T_UP=140; // frames ~2.3s
    let f=0;
    function step(){
      if(!anim) return;
      if(anim.phase==='up'){
        f++;
        const k=Math.min(1,f/T_UP);
        anim.p = 1-Math.pow(1-k,2); // easeOut
        draw();
        if(k>=1){ anim.phase='hold'; anim.hold=0; }
        requestAnimationFrame(step);
      } else if(anim.phase==='hold'){
        anim.hold++; draw();
        if(anim.hold>28){ anim.phase='boom'; }
        requestAnimationFrame(step);
      } else { // boom + fall
        anim.boom+=0.045;
        anim.p=Math.max(0, anim.p-0.02); // slump back toward pad
        draw();
        if(anim.boom>=1){ finish(dv); } else requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }
  function finish(dv){
    anim=null; draw();
    fireBtn.disabled=false; slider.disabled=false;
    attempts++;
    showVerdict(dv);
    if(attempts>=2){ awardWall(); }
  }

  function showVerdict(dv){
    const V=T[lang].v;
    let base = dv<6 ? V.far : dv<8 ? V.mid : V.near;
    verdictEl.className='verdict show bad';
    verdictEl.innerHTML=`<span class="tag">${base.tag}</span>${base.t}${V.meme}`;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  function awardWall(){
    if(!earned){ earned=true; try{ localStorage.setItem('mg.badge.rocket-equation-wall','1'); }catch(e){} }
    muskEl.classList.add('show');
    renderBadge();
  }

  // ---------- readouts ----------
  function renderReadout(){
    const dv=dvOf(fuel);
    dvEl.textContent=dv.toFixed(1);
    dvEl.style.color = dv>=GOAL ? '#57d38c' : '#ffd27f';
    fuelVal.textContent=fuel;
    analogyEl.innerHTML=T[lang].analogy(dv);
  }
  function renderBadge(){
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  // ---------- quiz ----------
  function renderQuiz(){
    const t=T[lang];
    $('qText').textContent=t.qText;
    const box=$('choices'); box.innerHTML='';
    t.choices.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='choice';
      b.innerHTML=`<span class="key">${c.k}</span><span>${c.txt}</span>`;
      b.addEventListener('click',()=>pickQuiz(i));
      box.appendChild(b);
    });
    $('feedback').innerHTML = quizDone ? quizFb() : '';
  }
  let quizPick=-1;
  function quizFb(){
    const t=T[lang];
    if(quizPick<0) return '';
    return t.choices[quizPick].correct ? t.fbRight(dvOf(100),dvOf(200)) : t.fbWrong;
  }
  function pickQuiz(i){
    quizDone=true; quizPick=i;
    const t=T[lang]; const btns=$('choices').children;
    [...btns].forEach((b,j)=>{
      b.classList.toggle('correct', t.choices[j].correct);
      if(j===i && !t.choices[j].correct) b.classList.add('wrong');
    });
    $('feedback').innerHTML=quizFb();
  }

  // ---------- static text ----------
  function renderStatic(){
    const t=T[lang];
    $('title').textContent=t.title; $('titleEn').textContent=t.titleEn;
    $('langBtn').textContent=t.lang; $('back').textContent=t.back;
    $('hook').innerHTML=t.hook;
    $('fuelLbl').textContent=t.fuel; $('fireBtn').textContent=t.fire; $('resetBtn').textContent=t.reset;
    $('goalChip').textContent=t.goalChip;
    $('muskSay').innerHTML=t.muskSay;
    $('teaserLink').textContent=t.teaser;
    document.documentElement.lang=lang;
    renderQuiz();
  }

  // ---------- events ----------
  slider.addEventListener('input',()=>{ fuel=+slider.value; renderReadout(); if(!anim) draw(); });
  fireBtn.addEventListener('click',fire);
  resetBtn.addEventListener('click',()=>{ fuel=300; slider.value=300; renderReadout(); hideVerdict(); draw(); });
  $('langBtn').addEventListener('click',()=>{ lang=lang==='zh'?'en':'zh'; renderStatic(); renderReadout(); renderBadge(); draw(); });
  window.addEventListener('resize',resize);

  // ---------- init ----------
  renderStatic(); renderReadout(); renderBadge();
  if(earned) muskEl.classList.add('show');
  resize();
})();
</script>
</body>
</html>
