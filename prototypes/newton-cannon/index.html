<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>牛顿大炮 · Newton's Cannon</title>
<style>
  :root{
    --bg:#05070f; --panel:#0d1220; --panel2:#131a2c;
    --ink:#e6ebf2; --muted:#8ba0b4; --line:#26304a;
    --flame:#ff8c42; --flame2:#ffd27f; --ok:#57d38c; --bad:#ff5a5a; --blue:#4aa3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #0b1226 0%, var(--bg) 60%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    padding:14px 14px 40px;
  }
  header{width:100%; max-width:860px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
  h1{font-size:20px; margin:0; letter-spacing:.5px}
  h1 .en{color:var(--muted); font-weight:500; font-size:13px; margin-left:8px}
  .hook{max-width:860px; width:100%; color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 12px;
        border-left:3px solid var(--flame); padding:6px 0 6px 12px; background:rgba(255,140,66,.06); border-radius:0 8px 8px 0}
  .hook b{color:var(--flame2); font-weight:600}
  .stage{position:relative; width:100%; max-width:640px; aspect-ratio:1/1;
         border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#03040a;
         box-shadow:0 12px 40px rgba(0,0,0,.5)}
  canvas{display:block; width:100%; height:100%}
  .verdict{position:absolute; left:12px; right:12px; bottom:12px; padding:12px 14px; border-radius:12px;
           background:rgba(8,12,22,.86); border:1px solid var(--line); backdrop-filter:blur(6px);
           font-size:14px; line-height:1.45; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none}
  .verdict.show{opacity:1; transform:none}
  .verdict .tag{display:inline-block; font-weight:700; margin-right:8px; padding:2px 8px; border-radius:999px; font-size:12px}
  .verdict.impact .tag{background:rgba(255,90,90,.18); color:#ff9b9b}
  .verdict.orbit .tag{background:rgba(87,211,140,.18); color:var(--ok)}
  .verdict.escape .tag{background:rgba(74,163,255,.18); color:var(--blue)}
  .verdict small{color:var(--muted)}

  .panel{width:100%; max-width:640px; margin-top:14px; background:var(--panel); border:1px solid var(--line);
         border-radius:16px; padding:16px}
  .readout{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px}
  .readout .big{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--flame2)}
  .readout .unit{font-size:16px; color:var(--muted)}
  .readout .cosmic{font-size:12px; padding:3px 8px; border-radius:999px; background:var(--panel2); color:var(--muted)}
  .readout .cosmic.on{color:#fff; background:linear-gradient(90deg,var(--flame),#c85a1e)}
  .analogy{color:var(--muted); font-size:12px; min-height:16px; margin-bottom:12px}
  .analogy b{color:var(--ink); font-weight:600}

  .sliderwrap{position:relative; padding:6px 2px 22px}
  input[type=range]{ -webkit-appearance:none; width:100%; height:8px; border-radius:999px; outline:none;
    background:linear-gradient(90deg, #2a3350 0%, #2a3350 100%);}
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--flame) 70%); border:2px solid #fff;
    box-shadow:0 0 12px rgba(255,140,66,.8); cursor:pointer}
  .ticks{position:absolute; left:2px; right:2px; top:14px; height:14px; pointer-events:none}
  .tick{position:absolute; top:0; width:2px; height:12px; background:var(--muted); opacity:.7; transform:translateX(-1px)}
  .tick b{position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--muted);
          white-space:nowrap; opacity:0; transition:.3s}
  .tick.reveal b{opacity:1; color:var(--flame2)}

  .buttons{display:flex; gap:10px; margin-top:6px}
  button{flex:1; font-size:16px; font-weight:700; padding:14px; border-radius:12px; border:1px solid var(--line);
         background:var(--panel2); color:var(--ink); cursor:pointer; transition:.15s}
  button:active{transform:translateY(1px)}
  button.fire{background:linear-gradient(180deg,#ff9a4d,#e5651a); border-color:#ff9a4d; color:#1a0d02; flex:2}
  button.fire:disabled{opacity:.5; cursor:default}
  button.ghost{flex:1}

  .badge{margin-top:14px; max-width:640px; width:100%; display:flex; align-items:center; gap:12px;
         padding:12px 14px; border-radius:14px; border:1px dashed var(--line); color:var(--muted); font-size:13px}
  .badge.earned{border:1px solid var(--ok); background:rgba(87,211,140,.08); color:var(--ink)}
  .badge .medal{font-size:26px; filter:grayscale(1) opacity(.5)}
  .badge.earned .medal{filter:none}
  .langtoggle{font-size:12px; color:var(--muted); cursor:pointer; user-select:none; border:1px solid var(--line);
              padding:5px 10px; border-radius:999px; background:var(--panel)}
  .egg{margin-top:12px; font-size:11px; color:var(--muted)}
  .egg input{width:110px; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
             border-radius:8px; padding:5px 8px; font-size:12px}
</style>
</head>
<body>
  <header>
    <h1 id="title">牛顿大炮 <span class="en" id="titleEn">Newton's Cannon</span></h1>
    <span class="langtoggle" id="langBtn">EN</span>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="readout">
      <span class="big" id="spd">7.9</span><span class="unit">km/s</span>
      <span class="cosmic" id="cosmic"></span>
    </div>
    <div class="analogy" id="analogy"></div>

    <div class="sliderwrap">
      <input type="range" id="slider" min="0" max="18" step="0.1" value="7.9" />
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="buttons">
      <button class="fire" id="fireBtn">发射！</button>
      <button class="ghost" id="clearBtn">清除轨迹</button>
    </div>

    <div class="egg" id="egg"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- physics constants (real Earth) ----------
  const R  = 6371;        // km, Earth radius
  const MU = 398600;      // km^3/s^2, GM
  const V_CIRC = Math.sqrt(MU / R);      // 7.905 km/s (first cosmic velocity)
  const V_ESC  = Math.sqrt(2 * MU / R);  // 11.180 km/s (second cosmic velocity)
  const V_THIRD = 16.7;                  // labelled third-cosmic threshold (solar escape flavour)

  // ---------- i18n ----------
  const T = {
    zh: {
      title:'牛顿大炮', titleEn:"Newton's Cannon", lang:'EN',
      hook:'马斯克：300 多年前牛顿就想过——山顶架一门炮，水平开火。炮弹越快，落点越远。快到某个程度，炮弹<b>下坠的弯度正好等于地球表面的弯度</b>，它就永远掉不到地上了。这就是<b>轨道</b>。你来试试，需要多快？',
      fire:'发射！', clear:'清除轨迹',
      analogy:(v)=>`参照：民航客机约 0.25、步枪子弹约 1、国际空间站约 7.7 km/s。你现在选的是 <b>${v.toFixed(1)}</b>。`,
      cosmicNone:'', cosmic1:'第一宇宙速度', cosmic2:'第二宇宙速度', cosmic3:'第三宇宙速度',
      egg:'悄悄话：在框里输入一个速度试试 →',
      badgeLocked:'徽章未解锁：成功入轨一次，即可获得「轨道设计师」。',
      badgeEarned:'已获得徽章「轨道设计师」——轨道 = 永远掉不到地上的下落。',
      v:{
        impactSlow:{tag:'砸回地面', t:'太慢了！炮弹划个弧就砸回地上。<small> 横着飞得不够快，地面来不及在它脚下"躲开"。</small>'},
        impactNear:{tag:'差一点点', t:'绕了大半圈，还是掉下来了！<small> 就差一口气——横向速度还不够，轨道最低点擦到了地面。</small>'},
        orbitCircle:{tag:'入轨成功 🛰️', t:'完美！几乎正圆的轨道，你发射了一颗<b>星链卫星</b>！<small> 它一直在"下落"，只是横着飞得太快，永远掉不到地上。</small>'},
        orbitEllipse:{tag:'椭圆轨道 🛰️', t:'入轨了！这是一条椭圆轨道，越快越扁。<small> 最高点高度约 {apo} km。这也是轨道，恭喜。</small>'},
        escape2:{tag:'逃逸！', t:'太快了，地球拉不住它——它<b>去月球串门</b>了。<small> 你越过了第二宇宙速度（11.2 km/s）。</small>'},
        escape3:{tag:'飞出太阳系', t:'连太阳都快留不住它！<small> 这就是第三宇宙速度（16.7 km/s）的地盘——像旅行者号一样，一去不回。</small>'},
        light:{tag:'物理定律：不行', t:'想超光速？<b>物理定律第一个不答应。</b><small> 光速约 299792 km/s，任何有质量的东西都追不上它。</small>'}
      }
    },
    en: {
      title:"Newton's Cannon", titleEn:'牛顿大炮', lang:'中',
      hook:"Musk: 300+ years ago Newton imagined a cannon on a mountaintop firing sideways. The faster the ball, the farther it lands. Fast enough, and <b>its fall curves exactly like Earth's surface</b> — so it never hits the ground. That's an <b>orbit</b>. How fast do you need?",
      fire:'FIRE!', clear:'Clear trails',
      analogy:(v)=>`For scale: airliner ≈ 0.25, rifle bullet ≈ 1, ISS ≈ 7.7 km/s. You picked <b>${v.toFixed(1)}</b>.`,
      cosmicNone:'', cosmic1:'1st cosmic velocity', cosmic2:'2nd cosmic velocity', cosmic3:'3rd cosmic velocity',
      egg:'Psst — type a speed in the box →',
      badgeLocked:'Badge locked: reach orbit once to earn "Orbit Designer".',
      badgeEarned:'Badge earned: "Orbit Designer" — an orbit is a fall that never lands.',
      v:{
        impactSlow:{tag:'Crashed', t:'Too slow! The ball arcs and slams back down.<small> Not enough sideways speed — the ground can\'t curve away under it fast enough.</small>'},
        impactNear:{tag:'So close', t:'Almost all the way around — then it fell!<small> Just short: its lowest point grazed the surface.</small>'},
        orbitCircle:{tag:'In orbit 🛰️', t:'Perfect — a nearly circular orbit. You launched a <b>Starlink satellite</b>!<small> It\'s always falling, just moving sideways too fast to ever land.</small>'},
        orbitEllipse:{tag:'Elliptical orbit 🛰️', t:'You made orbit! An ellipse — the faster you go, the more stretched it gets.<small> Apogee ≈ {apo} km. Still an orbit. Nice.</small>'},
        escape2:{tag:'Escaped!', t:'Too fast — Earth can\'t hold it. It\'s <b>off to visit the Moon</b>.<small> You crossed escape velocity (11.2 km/s).</small>'},
        escape3:{tag:'Leaving the Solar System', t:'Even the Sun can barely hold it!<small> That\'s 3rd-cosmic-velocity territory (16.7 km/s) — like Voyager, never coming back.</small>'},
        light:{tag:'Physics says no', t:'Faster than light? <b>The laws of physics say no.</b><small> Light is ~299,792 km/s; nothing with mass can catch it.</small>'}
      }
    }
  };
  let lang = 'zh';

  // ---------- DOM ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');
  const spdEl = document.getElementById('spd');
  const cosmicEl = document.getElementById('cosmic');
  const analogyEl = document.getElementById('analogy');
  const fireBtn = document.getElementById('fireBtn');
  const clearBtn = document.getElementById('clearBtn');
  const verdictEl = document.getElementById('verdict');
  const badgeEl = document.getElementById('badge');
  const badgeText = document.getElementById('badgeText');
  const ticksEl = document.getElementById('ticks');
  const eggEl = document.getElementById('egg');

  // ---------- storage (tiny demo of badge/save) ----------
  const KEY = 'newtonCannon.v1';
  const store = load();
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  // ---------- canvas sizing ----------
  let W=0, H=0, cx=0, cy=0, scale=1, earthPx=0, dpr=1;
  const stars = [];
  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2;
    earthPx = Math.min(W,H) * 0.23;
    scale = earthPx / R;   // px per km
    if(stars.length===0){
      for(let i=0;i<160;i++) stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.2, a:Math.random()*0.7+0.2});
    }
    draw();
  }

  // physics km -> screen px
  const sx = (x)=> cx + x*scale;
  const sy = (y)=> cy - y*scale;

  // ---------- simulation (velocity Verlet, real 2-body) ----------
  function accel(x,y){ const r=Math.hypot(x,y); const k=-MU/(r*r*r); return [k*x, k*y]; }

  // Newton's cannon sits on a mountain tall enough to clear the atmosphere,
  // so "sea level" (R) is the ground it can crash into. Launching from R0 makes
  // the taught number 7.9 km/s a clean orbit while the gravity model stays real.
  const R0 = R + 80;
  function simulate(v0){
    const pts=[];
    let x=0, y=R0, vx=v0, vy=0;             // launch from mountaintop, firing sideways (+x)
    let [ax,ay] = accel(x,y);
    const bound = v0 < V_ESC - 1e-6 && v0 > 0;
    const dt = 1.5, maxSteps = 20000, stopR = 16*R;
    let closeT = Infinity;
    if(bound){ const a = MU/(2*MU/R0 - v0*v0); const Torb = 2*Math.PI*Math.sqrt(a*a*a/MU); closeT = 1.05*Torb; }
    let t=0, apo=R;
    for(let i=0;i<maxSteps;i++){
      pts.push([x,y]);
      x += vx*dt + 0.5*ax*dt*dt;
      y += vy*dt + 0.5*ay*dt*dt;
      const [nax,nay] = accel(x,y);
      vx += 0.5*(ax+nax)*dt; vy += 0.5*(ay+nay)*dt;
      ax=nax; ay=nay; t+=dt;
      const r = Math.hypot(x,y);
      if(r>apo) apo=r;
      if(r < R-1 && i>3){ pts.push([x,y]); return {pts, outcome:'impact', apo}; }
      if(r > stopR){ pts.push([x,y]); return {pts, outcome:'escape', apo}; }
      if(t >= closeT){ return {pts, outcome:'orbit', apo}; }
    }
    return {pts, outcome: bound?'orbit':'escape', apo};
  }

  // ---------- state ----------
  let v = 7.9;
  let history = [];      // faint ghost trails {pts, outcome}
  let anim = null;       // current flight animation

  // ---------- drawing ----------
  function drawEarth(){
    // atmosphere glow
    const atmo = ctx.createRadialGradient(cx,cy,earthPx*0.9, cx,cy,earthPx*1.35);
    atmo.addColorStop(0,'rgba(74,163,255,.35)');
    atmo.addColorStop(1,'rgba(74,163,255,0)');
    ctx.fillStyle=atmo; ctx.beginPath(); ctx.arc(cx,cy,earthPx*1.35,0,7); ctx.fill();
    // ocean
    const oc = ctx.createRadialGradient(cx-earthPx*0.3,cy-earthPx*0.35,earthPx*0.2, cx,cy,earthPx);
    oc.addColorStop(0,'#3f86c9'); oc.addColorStop(0.6,'#1f5590'); oc.addColorStop(1,'#0a2444');
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,earthPx,0,7); ctx.closePath(); ctx.clip();
    ctx.fillStyle=oc; ctx.fillRect(cx-earthPx,cy-earthPx,earthPx*2,earthPx*2);
    // continents (suggested blobs)
    ctx.fillStyle='rgba(70,150,92,.85)';
    const blobs=[[-.2,-.35,.5,.35],[.25,-.05,.45,.4],[-.35,.25,.4,.3],[.1,.4,.35,.25]];
    for(const [bx,by,bw,bh] of blobs){
      ctx.beginPath();
      ctx.ellipse(cx+bx*earthPx, cy+by*earthPx, bw*earthPx*0.5, bh*earthPx*0.5, bx, 0,7);
      ctx.fill();
    }
    ctx.restore();
    // rim
    ctx.strokeStyle='rgba(160,200,255,.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,earthPx,0,7); ctx.stroke();
  }

  function drawCannon(){
    const bx = sx(0), by = sy(R);
    // mountain
    ctx.fillStyle='#5a616e';
    ctx.beginPath(); ctx.moveTo(bx-18,by+2); ctx.lineTo(bx+18,by+2); ctx.lineTo(bx+6,by-14); ctx.lineTo(bx-6,by-14); ctx.closePath(); ctx.fill();
    // barrel pointing +x (right)
    ctx.strokeStyle='#c7ccd3'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by-10); ctx.lineTo(bx+26,by-10); ctx.stroke();
    ctx.strokeStyle='#2b303a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx,by-10); ctx.lineTo(bx+26,by-10); ctx.stroke();
    // aim hint (dashed) when idle
    if(!anim){
      ctx.strokeStyle='rgba(255,140,66,.5)'; ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(bx+28,by-10); ctx.lineTo(bx+70,by-10); ctx.stroke();
      ctx.setLineDash([]);
      // arrow head
      ctx.fillStyle='rgba(255,140,66,.6)';
      ctx.beginPath(); ctx.moveTo(bx+78,by-10); ctx.lineTo(bx+68,by-14); ctx.lineTo(bx+68,by-6); ctx.fill();
    }
  }

  function outcomeColor(o){ return o==='orbit'?'#57d38c': o==='escape'?'#4aa3ff':'#ff6a6a'; }

  function drawTrail(pts, upto, color, alpha, width){
    if(pts.length<2) return;
    ctx.strokeStyle=color; ctx.globalAlpha=alpha; ctx.lineWidth=width; ctx.lineJoin='round';
    ctx.beginPath();
    const n = Math.min(upto, pts.length);
    ctx.moveTo(sx(pts[0][0]), sy(pts[0][1]));
    for(let i=1;i<n;i++) ctx.lineTo(sx(pts[i][0]), sy(pts[i][1]));
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // stars
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    drawEarth();
    // ghost trails
    for(const h of history){ drawTrail(h.pts, h.pts.length, outcomeColor(h.outcome), 0.16, 1.4); }
    // live flight
    if(anim){
      drawTrail(anim.pts, anim.idx, '#ff8c42', 0.95, 2.6);
      const p = anim.pts[Math.min(anim.idx, anim.pts.length-1)];
      const px=sx(p[0]), py=sy(p[1]);
      ctx.save(); ctx.shadowColor='#ff8c42'; ctx.shadowBlur=14;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,4.5,0,7); ctx.fill(); ctx.restore();
    }
    drawCannon();
  }

  // ---------- flight animation ----------
  function fire(){
    if(anim) return;
    hideVerdict();
    const res = simulate(v);
    anim = { pts: res.pts, idx: 0, outcome: res.outcome, apo: res.apo };
    fireBtn.disabled = true;
    const stepPerFrame = Math.max(2, Math.floor(res.pts.length / 260)); // ~4-5s
    function tick(){
      if(!anim) return;
      anim.idx += stepPerFrame;
      draw();
      if(anim.idx < anim.pts.length){ requestAnimationFrame(tick); }
      else { finishFlight(res); }
    }
    requestAnimationFrame(tick);
  }

  function finishFlight(res){
    history.push({pts:res.pts, outcome:res.outcome});
    if(history.length>6) history.shift();
    const done = anim; anim = null; draw();
    fireBtn.disabled = false;
    showVerdict(res);
    // badge on first successful orbit
    if(res.outcome==='orbit' && !store.orbited){ store.orbited=true; save(); }
    renderBadge();
  }

  // ---------- verdict text ----------
  function pickVerdict(res){
    const V = T[lang].v;
    if(v >= 250000) return {...V.light, cls:'escape'};
    if(res.outcome==='impact'){
      return (v > V_CIRC*0.9) ? {...V.impactNear, cls:'impact'} : {...V.impactSlow, cls:'impact'};
    }
    if(res.outcome==='orbit'){
      if(Math.abs(v - V_CIRC) <= 0.25) return {...V.orbitCircle, cls:'orbit'};
      const apoAlt = Math.max(0, Math.round(res.apo - R));
      return {tag:V.orbitEllipse.tag, t:V.orbitEllipse.t.replace('{apo}', apoAlt.toLocaleString()), cls:'orbit'};
    }
    // escape
    if(v >= V_THIRD) return {...V.escape3, cls:'escape'};
    return {...V.escape2, cls:'escape'};
  }
  function showVerdict(res){
    const vd = pickVerdict(res);
    verdictEl.className = 'verdict show ' + vd.cls;
    verdictEl.innerHTML = `<span class="tag">${vd.tag}</span>${vd.t}`;
    // reveal the tick label for the threshold the child just crossed
    revealTicks();
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  // ---------- ticks ----------
  const TICKS = [
    {v:V_CIRC, label:'7.9'},
    {v:V_ESC,  label:'11.2'},
    {v:V_THIRD,label:'16.7'},
  ];
  function buildTicks(){
    ticksEl.innerHTML='';
    const min=+slider.min, max=+slider.max;
    for(const tk of TICKS){
      const el=document.createElement('div'); el.className='tick';
      el.style.left = ((tk.v-min)/(max-min)*100)+'%';
      el.innerHTML = `<b>${tk.label}</b>`;
      el.dataset.v = tk.v;
      ticksEl.appendChild(el);
    }
  }
  function revealTicks(){
    // reveal a tick label once the child has fired at/above it (discovery, not up-front)
    [...ticksEl.children].forEach(el=>{
      if(v >= +el.dataset.v - 0.3) el.classList.add('reveal');
    });
  }

  // ---------- readout ----------
  function cosmicTag(){
    const t=T[lang];
    if(v >= V_THIRD-0.05) return {txt:t.cosmic3, on:true};
    if(v >= V_ESC-0.05)   return {txt:t.cosmic2, on:true};
    if(Math.abs(v-V_CIRC)<=0.25) return {txt:t.cosmic1, on:true};
    return {txt:'', on:false};
  }
  function renderReadout(){
    spdEl.textContent = v.toFixed(1);
    analogyEl.innerHTML = T[lang].analogy(v);
    const c = cosmicTag();
    cosmicEl.textContent = c.txt;
    cosmicEl.className = 'cosmic' + (c.on?' on':'');
    cosmicEl.style.display = c.txt ? '' : 'none';
  }

  function renderBadge(){
    const earned = !!store.orbited;
    badgeEl.className = 'badge' + (earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  // ---------- static text ----------
  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').firstChild.textContent = t.title + ' ';
    document.getElementById('titleEn').textContent = t.titleEn;
    document.getElementById('langBtn').textContent = t.lang;
    document.getElementById('hook').innerHTML = t.hook;
    fireBtn.textContent = t.fire;
    clearBtn.textContent = t.clear;
    eggEl.innerHTML = t.egg + ' <input id="eggIn" type="text" placeholder="km/s" inputmode="decimal">';
    document.getElementById('eggIn').addEventListener('change', onEgg);
    document.documentElement.lang = lang;
  }

  function onEgg(e){
    const val = parseFloat(e.target.value);
    if(!isFinite(val) || val<0) return;
    v = val;
    if(v <= 18) slider.value = String(v);
    renderReadout(); draw();
    if(v > 20){ // beyond slider — straight to verdict (e.g., light-speed egg)
      showVerdict({outcome: v<V_ESC?'orbit':'escape', apo:R, pts:[]});
    }
  }

  // ---------- events ----------
  slider.addEventListener('input', ()=>{ v=+slider.value; renderReadout(); if(!anim) draw(); });
  fireBtn.addEventListener('click', fire);
  clearBtn.addEventListener('click', ()=>{ history=[]; draw(); });
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic(); renderReadout(); renderBadge();
  });
  window.addEventListener('resize', resize);

  // ---------- init ----------
  renderStatic();
  buildTicks();
  renderReadout();
  renderBadge();
  resize();
})();
</script>
</body>
</html>
