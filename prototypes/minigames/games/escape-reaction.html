<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>逃逸反应 · Escape Reflex</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific only: the big red ABORT button + a couple states common.css doesn't cover */
  button.abort{
    flex:2; font-size:22px; letter-spacing:2px; color:#fff;
    background:linear-gradient(180deg,#ff6a6a,#c22020); border-color:#ff8a8a;
    text-shadow:0 1px 2px rgba(0,0,0,.4); min-height:64px;
  }
  button.abort:disabled{opacity:.35}
  button.abort.armed{
    animation:pulseAbort .5s ease-in-out infinite; box-shadow:0 0 0 0 rgba(255,90,90,.7);
  }
  @keyframes pulseAbort{
    0%{box-shadow:0 0 0 0 rgba(255,90,90,.7); transform:scale(1)}
    50%{box-shadow:0 0 0 14px rgba(255,90,90,0); transform:scale(1.03)}
    100%{box-shadow:0 0 0 0 rgba(255,90,90,0); transform:scale(1)}
  }
  .roundlbl{font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:.5px}
  .readout .chip.best{background:linear-gradient(90deg,#2f6fb0,#4aa3ff); color:#fff}
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">逃逸反应</h1><span class="en" id="titleEn">Escape Reflex</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="roundlbl" id="round"></div>
    <div class="readout">
      <span class="big" id="rt">—</span><span class="unit" id="rtUnit">ms</span>
      <span class="chip best" id="best" style="display:none"></span>
    </div>
    <div class="feedback" id="instr"></div>
    <div class="buttons">
      <button class="abort" id="abortBtn">逃逸</button>
      <button class="ghost" id="launchBtn">点火升空</button>
    </div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ================= i18n =================
  const T = {
    zh:{
      title:'逃逸反应', titleEn:'Escape Reflex', lang:'EN', back:'← 目录',
      hook:'马斯克：<b>龙飞船</b>船壁里埋了 <b>8 台 SuperDraco</b>。火箭一出事，0.1 秒点火，把飞船像炮弹一样拽离。<b>报警一响，你只有 1.5 秒</b>——按下逃逸。你行不行？',
      launch:'点火升空', again:'再来一次', next:'下一关', abort:'逃逸',
      round:(n,total)=> n<=2 ? `第 ${n} 关 · ${n===1?'真警报演练':'假警报考验'}` : `随机演练 #${n-2}`,
      best:(ms)=>`最佳 ${ms} ms`,
      instr:{
        ready:'一切正常。准备好就点火升空。',
        climb:'上升中……盯紧仪表，别眨眼。',
        alarm:'⚠ 报警！立刻按逃逸！',
        falseClear:'……仪表恢复正常了。你怎么判断？',
        escape:'逃逸中——SuperDraco 8 台全开！',
        chute:'开伞，减速，海面溅落……'
      },
      v:{
        realOk:{cls:'ok', tag:'逃逸成功 🎉', t:'8 台 SuperDraco 齐喷，飞船像炮弹一样弹离火箭，降落伞打开，稳稳溅落。<b>乘员安全！</b><small>刚才是 <b>真警报</b>。你的反应：{ms} ms。</small>'},
        slow:{cls:'bad', tag:'没赶上', t:'逃逸窗口只有 1.5 秒，你慢了半拍，火箭带着飞船一起没了。<b>炸了？又一份数据。</b><small>再来一次，让手记住那一下。</small>'},
        falseAbort:{cls:'info', tag:'假警报', t:'那其实是 <b>假警报</b>——仪表闪一下就恢复了。但你还是逃了，完全没错。<b>宁可白逃一次，不可赌一次。载人任务里，谨慎永远不丢人。</b><small>你的反应：{ms} ms。</small>'},
        held:{cls:'info', tag:'沉住气 👍', t:'那是 <b>假警报</b>，仪表闪一下就自己恢复了。你看清了、没乱按——好判断。<small>但记住：真拿不准时，逃永远比赌强。</small>'}
      },
      badgeLocked:'徽章未解锁：在真警报里 1.5 秒内按下逃逸，赢得「逃逸反应手」。',
      badgeEarned:'已获得徽章「逃逸反应手」——0.1 秒点火，1.5 秒决断，乘员平安回家。',
      gauge:'仪表', bannerAbort:'报警 · ABORT', altUnit:'km', supd:'SuperDraco ×8',
      earlyHint:'还没报警呢——沉住气。'
    },
    en:{
      title:'Escape Reflex', titleEn:'逃逸反应', lang:'中', back:'← Menu',
      hook:'Musk: <b>Dragon</b> has <b>8 SuperDraco engines</b> built into its wall. If the rocket fails, they light in 0.1 s and yank the capsule away like a cannonball. <b>When the alarm sounds you get 1.5 s</b> — hit ABORT. Fast enough?',
      launch:'LAUNCH', again:'Again', next:'Next', abort:'ABORT',
      round:(n,total)=> n<=2 ? `Round ${n} · ${n===1?'Real-alarm drill':'False-alarm test'}` : `Random drill #${n-2}`,
      best:(ms)=>`best ${ms} ms`,
      instr:{
        ready:'All nominal. Launch when you\'re ready.',
        climb:'Climbing… watch the gauge, don\'t blink.',
        alarm:'⚠ ALARM! Hit ABORT now!',
        falseClear:'…the gauge went back to normal. Your call?',
        escape:'Aborting — all 8 SuperDracos firing!',
        chute:'Chutes out, slowing, splashdown…'
      },
      v:{
        realOk:{cls:'ok', tag:'Abort success 🎉', t:'All 8 SuperDracos fired, the capsule shot off the rocket like a cannonball, chutes opened, clean splashdown. <b>Crew safe!</b><small>That was a <b>real alarm</b>. Your reaction: {ms} ms.</small>'},
        slow:{cls:'bad', tag:'Too slow', t:'The abort window is only 1.5 s — you were a beat late, and the rocket took the capsule with it. <b>Boom? Another data point.</b><small>Run it again, let your hand learn the move.</small>'},
        falseAbort:{cls:'info', tag:'False alarm', t:'That was actually a <b>false alarm</b> — the gauge blipped and recovered. You aborted anyway, and that\'s completely fine. <b>Better to abort for nothing than gamble once. On crewed missions, caution is never shameful.</b><small>Your reaction: {ms} ms.</small>'},
        held:{cls:'info', tag:'Held your nerve 👍', t:'That was a <b>false alarm</b> — the gauge blipped and recovered on its own. You read it and didn\'t panic-press. Good judgment.<small>But remember: when you truly can\'t tell, aborting always beats gambling.</small>'}
      },
      badgeLocked:'Badge locked: hit ABORT within 1.5 s on a real alarm to earn "Abort Reflex".',
      badgeEarned:'Badge earned: "Abort Reflex" — light in 0.1 s, decide in 1.5 s, crew home safe.',
      gauge:'SYS', bannerAbort:'ALARM · ABORT', altUnit:'km', supd:'SuperDraco ×8',
      earlyHint:'No alarm yet — stay cool.'
    }
  };
  let lang = 'zh';

  // ================= DOM =================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const verdictEl = document.getElementById('verdict');
  const roundEl = document.getElementById('round');
  const rtEl = document.getElementById('rt');
  const bestEl = document.getElementById('best');
  const instrEl = document.getElementById('instr');
  const abortBtn = document.getElementById('abortBtn');
  const launchBtn = document.getElementById('launchBtn');
  const badgeEl = document.getElementById('badge');
  const badgeText = document.getElementById('badgeText');

  // ================= storage =================
  const KEY = 'escapeReaction.v1';
  const store = load();
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  // ================= audio (must never throw) =================
  let actx = null;
  function initAudio(){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
    }catch(e){ actx = null; }
  }
  function beep(freq){
    try{
      if(!actx) return;
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='square'; o.frequency.value=freq||880;
      o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.12,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.start(t); o.stop(t+0.3);
    }catch(e){}
  }

  // ================= canvas sizing (DPR-aware, from newton-cannon) =================
  let W=0,H=0,dpr=1;
  const stars=[];
  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(stars.length===0){
      for(let i=0;i<140;i++) stars.push({x:Math.random(), y:Math.random()*0.7, r:Math.random()*1.3+0.2, a:Math.random()*0.6+0.3});
    }
  }

  // ================= game state =================
  // phases: ready | ascent | alarm | ascentFalse | escape | chute | boom | orbit | done
  let phase='ready';
  let mode='real';            // 'real' | 'false'
  let roundIndex=0;           // completed-round counter; determines round type & label
  let ascentElapsed=0;        // seconds since liftoff (advances only while climbing)
  let altKm=0, worldScroll=0;
  let alarmT=0, ascentDur=0, blipReturnT=0;
  let alarmFired=false, alarmPerf=0, armed=false, aborted=false;
  let gaugeAlarm=false;       // gauge is showing red
  let reactionMs=null;
  let phaseT=0;               // sub-timer for escape/chute/boom/orbit
  let shake=0;
  let pendingVerdict=null;    // 'realOk'|'slow'|'falseAbort'|'held'
  let resultShown=false;
  let alarmBeepAcc=0;
  const clouds=[];

  // layout helpers (recomputed per frame from W,H)
  function layout(){
    const bodyH = H*0.24;
    const RY = H*0.50;
    return {
      bodyH, RY,
      bw: bodyH*0.16,
      capW: bodyH*0.16*1.18,
      capH: bodyH*0.30,
      boostH: bodyH*0.70,
      topY: RY - bodyH/2,
      groundY0: RY + bodyH/2
    };
  }

  // ================= flow control =================
  function pickMode(){
    if(roundIndex===0) return 'real';
    if(roundIndex===1) return 'false';
    return Math.random()<0.5 ? 'real' : 'false';
  }
  function startLaunch(){
    initAudio();
    mode = pickMode();
    ascentElapsed=0; altKm=0; worldScroll=0;
    alarmFired=false; alarmPerf=0; armed=false; aborted=false; gaugeAlarm=false;
    reactionMs=null; phaseT=0; shake=0; pendingVerdict=null; resultShown=false; alarmBeepAcc=0;
    if(mode==='real'){
      alarmT = 1.5 + Math.random()*1.9;        // 1.5–3.4 s
      phase='ascent';
    }else{
      alarmT = 1.5 + Math.random()*1.6;        // 1.5–3.1 s
      blipReturnT = alarmT + 0.65;
      ascentDur = alarmT + 3.4;                 // room to decide, then orbit
      phase='ascentFalse';
    }
    hideVerdict();
    rtEl.textContent = '—';
    seedClouds();
    setButtons();
    renderRound();
    setInstr('climb');
  }
  function fireAlarm(){
    alarmFired=true; gaugeAlarm=true; alarmPerf=performance.now();
    armAbort(); beep(920); alarmBeepAcc=0;
    setInstr('alarm');
  }
  function fireBlip(){
    alarmFired=true; gaugeAlarm=true; alarmPerf=performance.now();
    armAbort(); beep(920); alarmBeepAcc=0;
    setInstr('alarm');
  }
  function armAbort(){
    armed=true; abortBtn.disabled=false; abortBtn.classList.add('armed');
  }
  function disarm(){
    armed=false; abortBtn.classList.remove('armed');
  }
  function doAbort(){
    if(!armed || aborted) return;
    aborted=true; disarm();
    reactionMs = Math.round(performance.now() - alarmPerf);
    rtEl.textContent = String(reactionMs);
    pendingVerdict = (mode==='real') ? 'realOk' : 'falseAbort';
    gaugeAlarm=false;
    phase='escape'; phaseT=0;
    setInstr('escape'); setButtons();
    if(mode==='real') recordBest(reactionMs);
  }
  function triggerBoom(){
    disarm(); gaugeAlarm=false;
    pendingVerdict='slow';
    phase='boom'; phaseT=0; shake=1;
    beep(140);
    setButtons();
  }
  function triggerOrbit(){
    disarm(); gaugeAlarm=false;
    pendingVerdict='held';
    phase='orbit'; phaseT=0;
    setButtons();
  }
  function recordBest(ms){
    if(store.best==null || ms<store.best){ store.best=ms; save(); renderBest(); }
  }

  function finishResult(){
    if(resultShown) return;
    resultShown=true;
    phase='done';
    const key = pendingVerdict;
    const vd = T[lang].v[key];
    let txt = vd.t;
    if(reactionMs!=null) txt = txt.replace('{ms}', reactionMs);
    verdictEl.className = 'verdict show ' + vd.cls;
    verdictEl.innerHTML = `<span class="tag">${vd.tag}</span>${txt}`;
    if(key==='realOk'){
      store.earned=true; save();
      try{ localStorage.setItem('mg.badge.escape-reaction','1'); }catch(e){}
      renderBadge();
    }
    instrEl.textContent='';
    roundIndex++;            // advance for next launch
    setButtons();
    renderRound();
  }

  // ================= update loop =================
  let lastTs=0, raf=null;
  function frame(ts){
    if(!lastTs) lastTs=ts;
    let dt=(ts-lastTs)/1000; lastTs=ts;
    if(dt>0.05) dt=0.05;
    update(dt);
    draw();
    raf=requestAnimationFrame(frame);
  }
  function kinematics(dt){
    ascentElapsed += dt;
    altKm = 0.5*1.5*ascentElapsed*ascentElapsed;   // accelerating climb (game units ≈ km)
    const maxScroll = H*1.2;
    worldScroll = Math.min(altKm*(H*0.08), maxScroll);
  }
  function pulseBeep(dt){
    alarmBeepAcc += dt;
    if(alarmBeepAcc>=0.42){ alarmBeepAcc=0; beep(920); }
  }
  function update(dt){
    if(phase==='ascent'){
      kinematics(dt);
      if(!alarmFired && ascentElapsed>=alarmT) fireAlarm();
    }
    else if(phase==='ascentFalse'){
      kinematics(dt);
      if(!alarmFired && ascentElapsed>=alarmT) fireBlip();
      if(alarmFired && gaugeAlarm && ascentElapsed>=blipReturnT){
        gaugeAlarm=false; setInstr('falseClear');
        abortBtn.classList.remove('armed'); // stop the pulse, but ABORT stays available
      }
      if(ascentElapsed>=ascentDur) triggerOrbit();
    }
    else if(phase==='escape'){
      phaseT+=dt;
      if(phaseT>=1.3){ phase='chute'; phaseT=0; setInstr('chute'); }
    }
    else if(phase==='chute'){
      phaseT+=dt;
      if(phaseT>=2.9) finishResult();
    }
    else if(phase==='boom'){
      phaseT+=dt;
      shake = Math.max(0, 1 - phaseT/0.55);
      if(phaseT>=1.5) finishResult();
    }
    else if(phase==='orbit'){
      phaseT+=dt;
      const maxScroll=H*1.2;
      worldScroll = Math.min(worldScroll + dt*H*0.25, maxScroll);
      if(phaseT>=1.4) finishResult();
    }

    // real-alarm window: while climbing after a real alarm, count the 1.5 s
    if(mode==='real' && alarmFired && !aborted && (phase==='ascent')){
      pulseBeep(dt);
      if(performance.now()-alarmPerf > 1500) triggerBoom();
    }
    if(mode==='false' && gaugeAlarm && (phase==='ascentFalse')){
      pulseBeep(dt);
    }
  }

  // ================= drawing =================
  const ease = t => 1-(1-t)*(1-t);
  const easeIn = t => t*t;

  function seedClouds(){
    clouds.length=0;
    for(let i=0;i<5;i++){
      clouds.push({ wy: H*0.15 + Math.random()*H*0.6, x: 0.1+Math.random()*0.8, s: 0.6+Math.random()*0.7 });
    }
  }

  function skyBg(){
    const dark = Math.min(1, worldScroll/(H*1.2));
    const top = mix('#0a1a3a','#03040a', dark);
    const bot = mix('#5aa0e0','#0a1730', dark);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // stars fade in with altitude
    if(dark>0.05){
      for(const s of stars){ ctx.globalAlpha=s.a*dark; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7); ctx.fill(); }
      ctx.globalAlpha=1;
    }
  }
  function mix(a,b,t){
    const pa=hx(a), pb=hx(b);
    const r=Math.round(pa[0]+(pb[0]-pa[0])*t), g=Math.round(pa[1]+(pb[1]-pa[1])*t), bl=Math.round(pa[2]+(pb[2]-pa[2])*t);
    return `rgb(${r},${g},${bl})`;
  }
  function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

  function drawGroundAndClouds(){
    const L=layout();
    const gy = L.groundY0 + worldScroll;
    // clouds (parallax, slower than ground)
    for(const c of clouds){
      const cy = c.wy + worldScroll*0.6;
      if(cy>-40 && cy<H+40) drawCloud(c.x*W, cy, 34*c.s);
    }
    if(gy < H+80){
      // launch pad ground
      ctx.fillStyle='#3a4150';
      ctx.fillRect(0, gy, W, H-gy+80);
      ctx.fillStyle='#2a3040';
      ctx.fillRect(0, gy, W, 6);
      // launch tower (right of rocket)
      const tx = W*0.62;
      ctx.strokeStyle='#6a7080'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(tx, gy); ctx.lineTo(tx, gy-H*0.28); ctx.stroke();
      for(let i=1;i<=5;i++){ const yy=gy-i*(H*0.055);
        ctx.beginPath(); ctx.moveTo(tx, yy); ctx.lineTo(tx-14, yy+8); ctx.stroke(); }
    }
  }
  function drawCloud(x,y,r){
    ctx.fillStyle='rgba(230,240,255,.5)';
    ctx.beginPath();
    ctx.arc(x-r*0.7,y,r*0.7,0,7); ctx.arc(x,y-r*0.3,r*0.9,0,7);
    ctx.arc(x+r*0.8,y,r*0.7,0,7); ctx.arc(x,y+r*0.2,r*0.8,0,7);
    ctx.fill();
  }

  function drawBooster(cx,cy,w,h){
    // body
    ctx.fillStyle='#e8ecf2';
    roundRect(cx-w/2, cy-h/2, w, h, w*0.18); ctx.fill();
    // shading
    ctx.fillStyle='rgba(0,0,0,.12)';
    roundRect(cx+w*0.1, cy-h/2, w*0.4, h, w*0.18); ctx.fill();
    // grid fins / stripe
    ctx.fillStyle='#9aa3b2';
    ctx.fillRect(cx-w/2, cy-h*0.42, w, h*0.05);
    ctx.fillStyle='#1c2740';
    ctx.fillRect(cx-w/2, cy+h*0.30, w, h*0.06);
  }
  function drawCapsule(cx,cy,w,h, showThrusters, flash){
    // Dragon: rounded nose + gumdrop body
    ctx.fillStyle='#f2f4f8';
    ctx.beginPath();
    ctx.moveTo(cx-w/2, cy+h/2);
    ctx.lineTo(cx-w*0.42, cy-h*0.12);
    ctx.quadraticCurveTo(cx, cy-h*0.72, cx+w*0.42, cy-h*0.12);
    ctx.lineTo(cx+w/2, cy+h/2);
    ctx.closePath(); ctx.fill();
    // window
    ctx.fillStyle='#2a4a6a';
    ctx.beginPath(); ctx.arc(cx, cy-h*0.02, w*0.16, 0, 7); ctx.fill();
    // base ring
    ctx.fillStyle='#c7ccd3';
    ctx.fillRect(cx-w/2, cy+h*0.36, w, h*0.14);
    // 8 SuperDraco nacelles (side-view: draw the pods)
    ctx.fillStyle='#8b93a2';
    ctx.fillRect(cx-w*0.5-w*0.10, cy+h*0.12, w*0.10, h*0.30);
    ctx.fillRect(cx+w*0.5, cy+h*0.12, w*0.10, h*0.30);
    if(showThrusters){
      drawSuperDraco(cx-w*0.5-w*0.05, cy+h*0.42, w, flash, -1);
      drawSuperDraco(cx+w*0.5+w*0.05, cy+h*0.42, w, flash, 1);
      // central pull jets too
      drawSuperDraco(cx-w*0.16, cy+h*0.50, w, flash, -0.3);
      drawSuperDraco(cx+w*0.16, cy+h*0.50, w, flash, 0.3);
    }
  }
  function drawSuperDraco(x,y,w,flash,dir){
    const len = w*(1.8+flash*0.9);
    const spread = w*0.5;
    ctx.save();
    ctx.globalAlpha=0.95;
    const g=ctx.createLinearGradient(x,y,x+dir*spread, y+len);
    g.addColorStop(0,'#fff'); g.addColorStop(0.4,'#ffd27f'); g.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(x-w*0.14, y); ctx.lineTo(x+w*0.14, y);
    ctx.lineTo(x+dir*spread+w*0.10, y+len); ctx.lineTo(x+dir*spread-w*0.10, y+len);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawPlume(cx, baseY, w, power){
    const flick = 0.8+Math.random()*0.4;
    const len = w*power*flick;
    const g=ctx.createLinearGradient(cx,baseY,cx,baseY+len);
    g.addColorStop(0,'#fff'); g.addColorStop(0.25,'#ffd27f');
    g.addColorStop(0.6,'#ff8c42'); g.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(cx-w*0.45, baseY);
    ctx.lineTo(cx+w*0.45, baseY);
    ctx.lineTo(cx+w*0.15, baseY+len);
    ctx.quadraticCurveTo(cx, baseY+len*1.25, cx-w*0.15, baseY+len);
    ctx.closePath(); ctx.fill();
    // hot core
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.moveTo(cx-w*0.18, baseY); ctx.lineTo(cx+w*0.18, baseY);
    ctx.lineTo(cx, baseY+len*0.55); ctx.closePath(); ctx.fill();
  }

  function drawRocketFlight(){
    const L=layout();
    const cx=W/2;
    const capBaseW=L.capW, boostW=L.bw;
    let capCY = L.topY + L.capH/2;
    let boostCY = L.topY + L.capH + L.boostH/2;

    if(phase==='escape'){
      const p=easeIn(phaseT/1.3);
      capCY -= p*H*0.95;               // capsule shoots up & away
      boostCY += phaseT*H*0.05;        // booster drifts, thrust cut
    }

    // booster + plume (plume only while engine burning: ascent / orbit)
    const burning = (phase==='ascent'||phase==='ascentFalse'||phase==='orbit'||phase==='boom');
    if(burning && phase!=='boom') drawPlume(cx, boostCY+L.boostH/2, boostW, 4.5);
    drawBooster(cx, boostCY, boostW, L.boostH);

    // capsule (with SuperDraco jets during escape)
    const showThr = phase==='escape';
    const flash = showThr ? (0.6+Math.random()*0.8) : 0;
    if(capCY > -L.capH){
      drawCapsule(cx, capCY, capBaseW, L.capH, showThr, flash);
      if(showThr){
        ctx.fillStyle='#ffd27f'; ctx.font='bold 12px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText(T[lang].supd, cx, capCY - L.capH*0.6);
      }
    }
  }

  function drawExplosion(){
    const L=layout();
    const cx=W/2, cy=L.topY + L.capH + L.boostH*0.5;
    const p=Math.min(1, phaseT/1.2);
    const R=Math.max(4, p*H*0.42);
    // outer orange
    let g=ctx.createRadialGradient(cx,cy,R*0.1,cx,cy,R);
    g.addColorStop(0,'rgba(255,255,255,'+(1-p)+')');
    g.addColorStop(0.35,'rgba(255,200,90,'+(0.9-p*0.7)+')');
    g.addColorStop(0.7,'rgba(255,110,40,'+(0.7-p*0.6)+')');
    g.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    // debris puffs
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2, d=R*0.7*p;
      ctx.fillStyle='rgba(120,120,130,'+(0.5-p*0.5)+')';
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, R*0.14*(1-p*0.4), 0,7); ctx.fill();
    }
  }

  function drawChuteScene(){
    // reframe: ocean + descending capsule under 3 chutes
    const p=Math.min(1, phaseT/2.9);
    // sky already drawn dark-ish; draw ocean
    const oceanY = H*0.74;
    const og=ctx.createLinearGradient(0,oceanY,0,H);
    og.addColorStop(0,'#2f6fb0'); og.addColorStop(1,'#0a2444');
    ctx.fillStyle=og; ctx.fillRect(0,oceanY,W,H-oceanY);
    // gentle waves
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){ const yy=oceanY+8+i*12;
      ctx.beginPath();
      for(let x=0;x<=W;x+=12){ const y=yy+Math.sin((x*0.04)+phaseT*2+i)*2; if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); }

    const cx=W/2;
    const capY = H*0.10 + ease(p)*(oceanY - H*0.16);
    const w=H*0.05, h=H*0.075;
    const splashing = phaseT>2.2;

    // parachute lines + canopies (fade as it nears water)
    const chuteA = Math.max(0, 1-Math.max(0,(phaseT-2.0))/0.8);
    if(chuteA>0.02){
      ctx.globalAlpha=chuteA;
      const offs=[-w*1.3, 0, w*1.3];
      for(const ox of offs){
        const ccx=cx+ox, ccy=capY-h*2.4;
        // lines
        ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(cx-w*0.3,capY-h*0.4); ctx.lineTo(ccx-w*0.7,ccy);
        ctx.moveTo(cx+w*0.3,capY-h*0.4); ctx.lineTo(ccx+w*0.7,ccy); ctx.stroke();
        // canopy (orange/white stripes)
        for(let s=0;s<4;s++){
          ctx.fillStyle = s%2? '#ff8c42':'#f2f4f8';
          ctx.beginPath();
          ctx.moveTo(ccx-w*0.9+s*w*0.45, ccy);
          ctx.arc(ccx, ccy, w*0.9, Math.PI+s*(Math.PI/4), Math.PI+(s+1)*(Math.PI/4), false);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.globalAlpha=1;
    }
    // capsule
    drawCapsule(cx, capY, w, h, false, 0);

    if(splashing){
      const sp=(phaseT-2.2)/0.7;
      ctx.strokeStyle='rgba(255,255,255,'+(0.8-sp*0.8)+')'; ctx.lineWidth=3;
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(cx, oceanY, (i*14+sp*40), Math.PI, 2*Math.PI); ctx.stroke(); }
      if(phaseT>2.6){
        ctx.fillStyle='#fff'; ctx.font='bold 30px -apple-system,sans-serif'; ctx.textAlign='center';
        ctx.fillText('🎉', cx, oceanY-6);
      }
    }
  }

  function drawGauge(){
    // top-left system gauge; light green normally, red flashing on alarm
    const x=12,y=12,w=112,h=40;
    ctx.fillStyle='rgba(8,12,22,.7)';
    roundRect(x,y,w,h,8); ctx.fill();
    ctx.strokeStyle=gaugeAlarm?'#ff5a5a':'#26304a'; ctx.lineWidth=gaugeAlarm?2:1;
    roundRect(x,y,w,h,8); ctx.stroke();
    ctx.fillStyle='#8ba0b4'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText(T[lang].gauge, x+34, y+16);
    // light
    const on = gaugeAlarm ? (Math.sin(performance.now()/70)>0) : true;
    ctx.fillStyle = gaugeAlarm ? (on?'#ff5a5a':'#5a1414') : '#57d38c';
    ctx.beginPath(); ctx.arc(x+18, y+20, 8, 0, 7); ctx.fill();
    // status bar
    ctx.fillStyle = gaugeAlarm ? '#ff9b9b' : '#57d38c';
    ctx.font='bold 12px -apple-system,sans-serif';
    ctx.fillText(gaugeAlarm?'FAULT':'NOMINAL', x+34, y+31);
    // altitude readout top-right
    ctx.fillStyle='#8ba0b4'; ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='right';
    const shownAlt = (phase==='chute') ? 0 : altKm;
    ctx.fillText(shownAlt.toFixed(1)+' '+T[lang].altUnit, W-12, y+22);

    // big center banner when alarming
    if(gaugeAlarm){
      const a=0.5+0.5*Math.sin(performance.now()/90);
      ctx.fillStyle='rgba(255,90,90,'+(0.18+0.18*a)+')';
      ctx.fillRect(0, H*0.10, W, 46);
      ctx.fillStyle='rgba(255,220,220,'+(0.7+0.3*a)+')';
      ctx.font='bold 22px -apple-system,sans-serif'; ctx.textAlign='center';
      ctx.fillText('⚠ '+T[lang].bannerAbort, W/2, H*0.10+30);
    }
  }

  function draw(){
    ctx.save();
    if(shake>0){
      const amp=10*shake;
      ctx.translate((Math.random()-0.5)*amp, (Math.random()-0.5)*amp);
    }
    ctx.clearRect(-20,-20,W+40,H+40);

    if(phase==='chute'){
      // dark space sky for descent
      skyBg();
      drawChuteScene();
    }else{
      skyBg();
      drawGroundAndClouds();
      if(phase==='boom'){ drawRocketFlight(); drawExplosion(); }
      else drawRocketFlight();
    }
    ctx.restore();

    // HUD not shaken (except during boom for drama we let it ride)
    drawGauge();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ================= UI text / buttons =================
  function setInstr(key){ instrEl.textContent = T[lang].instr[key]; }
  function setButtons(){
    const t=T[lang];
    const climbing = (phase==='ascent'||phase==='ascentFalse');
    const busy = climbing || phase==='escape'||phase==='chute'||phase==='boom'||phase==='orbit';
    if(phase==='ready'){
      launchBtn.style.display=''; launchBtn.disabled=false; launchBtn.textContent=t.launch;
      abortBtn.disabled=true; disarm();
    }else if(busy){
      launchBtn.style.display='none';
      abortBtn.disabled = !armed;
    }else{ // done
      launchBtn.style.display=''; launchBtn.disabled=false;
      launchBtn.textContent = (roundIndex<2 ? t.next : t.again);
      abortBtn.disabled=true; disarm();
    }
  }
  function renderRound(){
    roundEl.textContent = T[lang].round(roundIndex+1);
  }
  function renderBest(){
    if(store.best!=null){ bestEl.style.display=''; bestEl.textContent=T[lang].best(store.best); }
    else bestEl.style.display='none';
  }
  function renderBadge(){
    const earned=!!store.earned;
    badgeEl.className='badge'+(earned?' earned':'');
    badgeText.textContent = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }
  function hideVerdict(){ verdictEl.className='verdict'; }

  function renderStatic(){
    const t=T[lang];
    document.getElementById('title').textContent=t.title;
    document.getElementById('titleEn').textContent=t.titleEn;
    document.getElementById('langBtn').textContent=t.lang;
    document.getElementById('back').textContent=t.back;
    document.getElementById('hook').innerHTML=t.hook;
    abortBtn.textContent=t.abort;
    document.documentElement.lang=lang;
    // refresh dynamic labels for current phase
    if(phase==='ready'){ launchBtn.textContent=t.launch; setInstr('ready'); }
    else setButtons();
    renderRound(); renderBest(); renderBadge();
    // re-show verdict text in new language if a result is up
    if(phase==='done' && pendingVerdict){
      const vd=t.v[pendingVerdict];
      let txt=vd.t; if(reactionMs!=null) txt=txt.replace('{ms}',reactionMs);
      verdictEl.className='verdict show '+vd.cls;
      verdictEl.innerHTML=`<span class="tag">${vd.tag}</span>${txt}`;
    }
  }

  // ================= events =================
  abortBtn.addEventListener('click', ()=>{
    if(!armed){
      if(phase==='ascent'||phase==='ascentFalse'){ /* pressed too early */ }
      return;
    }
    doAbort();
  });
  launchBtn.addEventListener('click', ()=>{
    if(phase==='ready' || phase==='done') startLaunch();
  });
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh'?'en':'zh';
    renderStatic();
  });
  window.addEventListener('resize', resize);

  // ================= init =================
  resize();
  renderStatic();
  setInstr('ready');
  setButtons();
  renderBest();
  renderBadge();
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
