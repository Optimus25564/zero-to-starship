<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>材料商店 · Material Shop</title>
<link rel="stylesheet" href="../common.css">
<style>
  /* game-specific: clickable material cards + selected state (common.css has no card-select) */
  .grid.mats{grid-template-columns:repeat(2,1fr)}
  .card.mat{cursor:pointer; transition:.15s; position:relative}
  .card.mat:hover{border-color:#3a4a6a}
  .card.mat.sel{border-color:var(--flame); background:rgba(255,140,66,.10); box-shadow:0 0 0 1px var(--flame) inset}
  .card.mat .attr{display:flex; justify-content:space-between; gap:8px; margin:3px 0; font-size:12px; color:var(--muted)}
  .card.mat .attr .stars{color:var(--flame2)}
  .card.mat .tap{position:absolute; top:10px; right:12px; font-size:11px; color:var(--flame2); opacity:0; transition:.15s}
  .card.mat.sel .tap{opacity:1}
  .shipline{font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5}
  .shipline b{color:var(--flame2); font-weight:700}
  @media(max-width:420px){ .grid.mats{grid-template-columns:1fr} }
</style>
</head>
<body>
  <header>
    <div class="htitle"><h1 id="title">材料商店</h1><span class="en" id="titleEn">Material Shop</span></div>
    <div class="headright">
      <a class="backlink" href="../index.html" id="back">← 目录</a>
      <span class="langtoggle" id="langBtn">EN</span>
    </div>
  </header>

  <p class="hook" id="hook"></p>

  <div class="panel">
    <p class="q" id="shopQ"></p>
    <div class="grid mats" id="mats"></div>
  </div>

  <div class="panel">
    <p class="q" id="meterQ"></p>
    <div class="meters">
      <div class="meter">
        <div class="mlabel"><span id="budgetLabel"></span><span id="budgetVal"></span></div>
        <div class="mbar"><div class="mfill bad" id="budgetFill" style="width:0"></div></div>
      </div>
      <div class="meter">
        <div class="mlabel"><span id="payloadLabel"></span><span id="payloadVal"></span></div>
        <div class="mbar"><div class="mfill blue" id="payloadFill" style="width:0"></div></div>
      </div>
    </div>
    <div class="shipline" id="shipline"></div>
  </div>

  <div class="panel">
    <p class="q" id="decisionQ"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="badge" id="badge">
    <span class="medal">🏅</span>
    <span id="badgeText"></span>
  </div>

<script>
(() => {
  // ---------- material model (numbers drive the meters) ----------
  // BUDGET is a fixed pot; each ship costs `cost`. Steel is cheap enough that
  // the same pot builds ~3 ships. Payload is per-ship lift capacity (tons).
  const BUDGET = 300;      // $M pot
  const MAXCOST = 300;     // bar full-scale for cost/ship
  const MAXPAY  = 150;     // bar full-scale for payload
  const MATS = {
    alli:   { pay:110, cost:180 },
    carbon: { pay:150, cost:300 },  // MOST payload, budget explodes
    steel:  { pay:90,  cost:100 },  // less payload, but pot builds 3
    titan:  { pay:130, cost:250 },
  };

  // ---------- i18n ----------
  const T = {
    zh: {
      title:'材料商店', titleEn:'Material Shop', lang:'EN', back:'← 目录',
      hook:'马斯克：<b>轻、强、便宜</b>——只能挑两个。星舰最后选了<b>菜刀那种不锈钢</b>。为什么？',
      shopQ:'挑一张材料卡，看看它给星舰带来什么 👇',
      meterQ:'两个仪表会一直告诉你：这材料花多少钱、能扛多少货。',
      decisionQ:'<b>真正的决定：</b>星舰要<b>再入大气(上千度)</b>，还要<b>快速造几十艘</b>炸着试。你选哪种材料？',
      budgetLabel:'💰 预算 / 每艘成本', payloadLabel:'📦 载荷 / 能扛多少货',
      shipPrompt:'点一张卡看看 →',
      ships:(c,n)=>`一笔 <b>$${BUDGET}M</b> 预算，这材料每艘 $${c}M —— 同样预算能造 <b>${n} 艘</b>。`,
      costUnit:(c)=>`$${c}M / 艘`, payUnit:(p)=>`${p} 吨`,
      mats:{
        alli:{ name:'铝锂合金', sub:'Al-Li', attrs:[['轻','⭐⭐⭐'],['强','⭐⭐'],['价','⭐⭐']] },
        carbon:{ name:'碳纤维', sub:'Carbon', attrs:[['轻','⭐⭐⭐⭐'],['强','⭐⭐⭐'],['价','💸💸💸💸'],['怕热','🔥融']] },
        steel:{ name:'不锈钢', sub:'Steel', attrs:[['轻','⭐'],['强','⭐⭐⭐'],['耐热','⭐⭐⭐⭐'],['价','✅白菜']] },
        titan:{ name:'钛合金', sub:'Titanium', attrs:[['轻','⭐⭐'],['强','⭐⭐⭐⭐'],['价','💸💸💸']] },
      },
      tap:'已选 ✓',
      choices:{
        carbon:{ key:'A', label:'碳纤维', cls:'half',
          fb:'<b>各有优劣，不算错。</b>我们真的选过！后来发现<b>又贵又怕热</b>，全推翻了。省下的重量，被返工的时间和钱吃光了。' },
        steel:{ key:'B', label:'不锈钢', cls:'correct',
          fb:'<b>和我想到一起了。</b>重就用<b>推力</b>补回来。便宜、耐热、能快造几十艘炸着试 —— 这才是星舰的活法。🏅' },
        alli:{ key:'C', label:'铝锂合金', cls:'wrong',
          fb:'星舰再入会被<b>烧穿</b>。铝太怕热了。<br><b>炸了？又一份数据。 / Boom? Another data point.</b>' },
      },
      badgeLocked:'徽章未解锁：选对再入耐得住、又能快造的材料，即可获得「材料大师」。',
      badgeEarned:'已获得徽章「材料大师」——好答案是选对<b>该在乎的那两样</b>。',
    },
    en: {
      title:'Material Shop', titleEn:'材料商店', lang:'中', back:'← Menu',
      hook:'Musk: <b>Light, strong, cheap</b> — pick only two. Starship ended up using <b>the stainless steel of a kitchen knife</b>. Why?',
      shopQ:'Tap a material card to see what it gives Starship 👇',
      meterQ:'Two meters keep telling you: how much this costs, and how much cargo it lifts.',
      decisionQ:'<b>The real call:</b> Starship must <b>reenter (thousands of °C)</b> and be <b>built by the dozens fast</b> to blow up in tests. Which material?',
      budgetLabel:'💰 Budget / cost per ship', payloadLabel:'📦 Payload / cargo it lifts',
      shipPrompt:'Tap a card →',
      ships:(c,n)=>`One <b>$${BUDGET}M</b> pot, this costs $${c}M/ship — the same pot builds <b>${n} ship${n>1?'s':''}</b>.`,
      costUnit:(c)=>`$${c}M / ship`, payUnit:(p)=>`${p} t`,
      mats:{
        alli:{ name:'Al-Li', sub:'铝锂合金', attrs:[['Light','⭐⭐⭐'],['Strong','⭐⭐'],['Cost','⭐⭐']] },
        carbon:{ name:'Carbon fiber', sub:'碳纤维', attrs:[['Light','⭐⭐⭐⭐'],['Strong','⭐⭐⭐'],['Cost','💸💸💸💸'],['Heat','🔥melts']] },
        steel:{ name:'Stainless steel', sub:'不锈钢', attrs:[['Light','⭐'],['Strong','⭐⭐⭐'],['Heat','⭐⭐⭐⭐'],['Cost','✅dirt cheap']] },
        titan:{ name:'Titanium', sub:'钛合金', attrs:[['Light','⭐⭐'],['Strong','⭐⭐⭐⭐'],['Cost','💸💸💸']] },
      },
      tap:'Picked ✓',
      choices:{
        carbon:{ key:'A', label:'Carbon fiber', cls:'half',
          fb:'<b>Not wrong — just has a cost.</b> We really chose it! Turned out <b>pricey and heat-shy</b>, so we scrapped it all. The weight we saved got eaten by rework time and money.' },
        steel:{ key:'B', label:'Stainless steel', cls:'correct',
          fb:'<b>You think like me.</b> Heavy? Just add more <b>thrust</b>. Cheap, heat-proof, and you can build dozens to blow up in tests — that\'s the Starship way. 🏅' },
        alli:{ key:'C', label:'Al-Li', cls:'wrong',
          fb:'On reentry it gets <b>burned through</b>. Aluminum hates heat.<br><b>Boom? Another data point.</b>' },
      },
      badgeLocked:'Badge locked: pick the material that survives reentry AND builds fast to earn "Materials Master".',
      badgeEarned:'Badge earned: "Materials Master" — a good answer picks the <b>right two things to care about</b>.',
    }
  };
  let lang = 'zh';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const matsEl = $('mats'), choicesEl = $('choices'), feedbackEl = $('feedback');
  const budgetFill = $('budgetFill'), payloadFill = $('payloadFill');
  const budgetVal = $('budgetVal'), payloadVal = $('payloadVal');
  const shiplineEl = $('shipline');
  const badgeEl = $('badge'), badgeText = $('badgeText');

  // ---------- state ----------
  let selected = null;   // material key currently shown on meters
  let decided  = false;  // final decision locked?
  let earned = false;
  try{ earned = localStorage.getItem('mg.badge.material-triangle')==='1'; }catch(e){}

  // ---------- meters ----------
  function updateMeters(){
    const t = T[lang];
    if(!selected){
      budgetFill.style.width = '0'; payloadFill.style.width = '0';
      budgetVal.textContent = ''; payloadVal.textContent = '';
      shiplineEl.innerHTML = '<span class="muted">'+t.shipPrompt+'</span>';
      return;
    }
    const m = MATS[selected];
    budgetFill.style.width = Math.min(100, m.cost/MAXCOST*100) + '%';
    budgetFill.className = 'mfill ' + (m.cost <= 150 ? 'ok' : 'bad');
    payloadFill.style.width = Math.min(100, m.pay/MAXPAY*100) + '%';
    budgetVal.textContent = t.costUnit(m.cost);
    payloadVal.textContent = t.payUnit(m.pay);
    const ships = Math.floor(BUDGET / m.cost);
    shiplineEl.innerHTML = t.ships(m.cost, ships);
  }

  // ---------- material cards ----------
  function buildCards(){
    const t = T[lang];
    matsEl.innerHTML = '';
    for(const key of ['alli','carbon','steel','titan']){
      const md = t.mats[key];
      const card = document.createElement('div');
      card.className = 'card mat' + (selected===key ? ' sel' : '');
      let html = '<span class="tap">'+t.tap+'</span>';
      html += '<h3>'+md.name+' <span class="muted" style="font-weight:400;font-size:12px">'+md.sub+'</span></h3>';
      for(const [a,s] of md.attrs){
        html += '<div class="attr"><span>'+a+'</span><span class="stars">'+s+'</span></div>';
      }
      card.innerHTML = html;
      card.addEventListener('click', ()=>{ selected = key; buildCards(); updateMeters(); });
      matsEl.appendChild(card);
    }
  }

  // ---------- decision choices ----------
  function buildChoices(){
    const t = T[lang];
    choicesEl.innerHTML = '';
    for(const key of ['carbon','steel','alli']){
      const c = t.choices[key];
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.type = 'button';
      btn.dataset.key = key;
      btn.innerHTML = '<span class="key">'+c.key+'</span><span>'+c.label+'</span>';
      btn.addEventListener('click', ()=> decide(key));
      choicesEl.appendChild(btn);
    }
    // if already decided, keep it shown
    if(decided) applyDecisionStyles();
    feedbackEl.innerHTML = decided ? T[lang].choices[decided].fb : '';
  }

  function applyDecisionStyles(){
    [...choicesEl.children].forEach(btn=>{
      const key = btn.dataset.key;
      btn.classList.remove('correct','wrong','half','dim');
      if(key===decided){ btn.classList.add(T[lang].choices[key].cls); }
      else { btn.classList.add('dim'); }
    });
  }

  function decide(key){
    decided = key;
    // reflect the chosen material on the meters too
    selected = key; buildCards(); updateMeters();
    applyDecisionStyles();
    feedbackEl.innerHTML = T[lang].choices[key].fb;
    if(key==='steel'){
      earned = true;
      try{ localStorage.setItem('mg.badge.material-triangle','1'); }catch(e){}
    }
    renderBadge();
  }

  // ---------- badge ----------
  function renderBadge(){
    badgeEl.className = 'badge' + (earned ? ' earned' : '');
    badgeText.innerHTML = earned ? T[lang].badgeEarned : T[lang].badgeLocked;
  }

  // ---------- static text ----------
  function renderStatic(){
    const t = T[lang];
    $('title').textContent = t.title;
    $('titleEn').textContent = t.titleEn;
    $('langBtn').textContent = t.lang;
    $('back').textContent = t.back;
    $('hook').innerHTML = t.hook;
    $('shopQ').textContent = t.shopQ;
    $('meterQ').textContent = t.meterQ;
    $('decisionQ').innerHTML = t.decisionQ;
    $('budgetLabel').textContent = t.budgetLabel;
    $('payloadLabel').textContent = t.payloadLabel;
    document.documentElement.lang = lang;
    buildCards();
    buildChoices();
    updateMeters();
    renderBadge();
  }

  // ---------- events ----------
  $('langBtn').addEventListener('click', ()=>{
    lang = lang==='zh' ? 'en' : 'zh';
    $('back').setAttribute('href','../index.html');
    renderStatic();
  });

  // ---------- init ----------
  renderStatic();
})();
</script>
</body>
</html>
